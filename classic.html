    const cx = Math.round(mouse.x - OX), cy = Math.round(mouse.y - OY);
    ctx.fillStyle = '#140c26'; ctx.fillRect(cx - 5, cy - 1, 11, 3); ctx.fillRect(cx - 1, cy - 5, 3, 11);
    ctx.fillStyle = leveledUp ? '#ffd23f' : '#ffffff'; ctx.fillRect(cx - 4, cy, 3, 1); ctx.fillRect(cx + 2, cy, 3, 1); ctx.fillRect(cx, cy - 4, 1, 3); ctx.fillRect(cx, cy + 2, 1, 3);
  }
  ctx.restore();
}

function drawHUD() {
  // left panel: hearts + coins
  panel(4, 4, 128, 38);
  for (let i = 0; i < 3; i++) drawHeart(10 + i * 18, 10, 2, i < hp);
  ctx.save();
  drawCoinSprite(14, 32, 0.7);
  ctx.restore();
  let coinTxt = totalCoins > 5 ? String(totalCoins) : coins + '/5';
  drawText(coinTxt, 24, 29, 1, '#ffd23f', 'left', '#140c26');
  if (leveledUp) {
    const blink = Math.floor(globalT * 4) % 2 === 0;
    ctx.fillStyle = blink ? '#ffd23f' : '#f2b233'; ctx.fillRect(62, 26, 66, 12);
    drawText('LEVEL UP', 95, 29, 1, '#2a1a00', 'center');
  } else {
    ctx.fillStyle = '#3b2b63'; ctx.fillRect(62, 30, 64, 4);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(62, 30, Math.round(64 * coins / 5), 4);
  }

  // top-center status message
  let msg, col = '#ffffff';
  if (!spider.alive) { msg = 'OH NO!'; col = '#ff5a7a'; }
  else if (starCoin) { msg = 'GRAB THE STAR COIN!'; col = '#ffd23f'; }
  else if (!lizard.alive) { msg = 'VICTORY!'; col = '#7df06a'; }
  else if (lizard.frozen > 0) { msg = 'LIZARD STUCK! BITE IT!'; col = Math.floor(globalT * 5) % 2 ? '#ffffff' : '#ffd23f'; }
  else if (leveledUp) { msg = 'READY TO FIGHT! WEB THE LIZARD'; col = Math.floor(globalT * 3) % 2 ? '#ffd23f' : '#ffffff'; }
  else msg = 'COLLECT 5 COINS TO LEVEL UP';
  const mw = textWidth(msg, 1) + 12;
  let mx = BW / 2;
  if (mx - mw / 2 < 138) mx = 138 + mw / 2;
  panel(Math.round(mx - mw / 2), 6, mw, 13);
  drawText(msg, mx, 9, 1, col, 'center');
  drawText(fmtTime(gameTime), mx, 23, 1, 'rgba(255,255,255,0.8)', 'center', '#140c26');

  // pause button
  const pb = TL.pause;
  panel(pb.x, pb.y, pb.w, pb.h, 0.7);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(pb.x + 6, pb.y + 5, 3, 10); ctx.fillRect(pb.x + 11, pb.y + 5, 3, 10);

  // banner
  if (banner) {
    const k = banner.t / banner.max;
    const pop = Math.min(1, (1 - k) * 8);
    const scale = pop < 1 ? 3 : 4;
    const y = Math.round(BH * 0.38);
    ctx.globalAlpha = clamp(banner.t * 3, 0, 1);
    drawText(banner.text, BW / 2, y, scale, banner.color, 'center', null, '#140c26');
    if (banner.sub) drawText(banner.sub, BW / 2, y + 36, 1, '#ffffff', 'center', null, '#140c26');
    ctx.globalAlpha = 1;
  }
}

function drawTouchControls() {
  ctx.save();
  // left joystick
  const jb = touch.joy.id !== null ? { x: touch.joy.bx, y: touch.joy.by } : TL.joy;
  ctx.globalAlpha = touch.joy.id !== null ? 0.85 : 0.5;
  ctx.fillStyle = 'rgba(20,12,40,0.45)'; ctx.beginPath(); ctx.arc(jb.x, jb.y, TL.joy.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(jb.x + touch.joy.vx * TL.joy.r, jb.y + touch.joy.vy * TL.joy.r, 13, 0, Math.PI * 2); ctx.fill();
  // jump
  ctx.globalAlpha = touch.jump.id !== null ? 0.95 : 0.65;
  ctx.fillStyle = touch.jump.id !== null ? '#8ef06f' : '#3fae3a';
  ctx.beginPath(); ctx.arc(TL.jump.x, TL.jump.y, TL.jump.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#140c26'; ctx.lineWidth = 2; ctx.stroke();
  drawText('JUMP', TL.jump.x, TL.jump.y - 3, 1, '#ffffff', 'center', '#140c26');
  // web aim stick
  ctx.globalAlpha = touch.web.id !== null ? 0.95 : 0.65;
  ctx.fillStyle = touch.web.id !== null ? '#ffe45c' : '#d99a00';
  ctx.beginPath(); ctx.arc(TL.web.x, TL.web.y, TL.web.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#140c26'; ctx.lineWidth = 2; ctx.stroke();
  // web icon
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4; ctx.moveTo(TL.web.x - Math.cos(a) * 12, TL.web.y - Math.sin(a) * 12); ctx.lineTo(TL.web.x + Math.cos(a) * 12, TL.web.y + Math.sin(a) * 12); }
  ctx.stroke();
  ctx.beginPath(); ctx.arc(TL.web.x, TL.web.y, 7, 0, Math.PI * 2); ctx.stroke();
  drawText('WEB', TL.web.x, TL.web.y + 14, 1, '#ffffff', 'center', '#140c26');
  if (touch.web.id !== null) {
    let dx = touch.web.dx, dy = touch.web.dy; const d = Math.hypot(dx, dy);
    if (d > TL.web.r) { dx = dx / d * TL.web.r; dy = dy / d * TL.web.r; }
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(TL.web.x + dx, TL.web.y + dy, 9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawTitle(y) {
  const t = globalT;
  const w1 = textWidth('GEAR', 6), w2 = textWidth('BUGS', 6), gap = 30;
  const total = w1 + gap + w2, x0 = Math.round(BW / 2 - total / 2);
  drawGear(ctx, x0 - 26, y + 20, 14, 8, t * 1.5, '#f2b233', '#1b1230');
  drawGear(ctx, x0 - 8, y + 44, 8, 6, -t * 2.6, '#d99a00', '#1b1230');
  drawGear(ctx, x0 + total + 26, y + 20, 14, 8, -t * 1.5, '#7df06a', '#1b1230');
  drawGear(ctx, x0 + total + 8, y + 44, 8, 6, t * 2.6, '#4fb944', '#1b1230');
  const bob = Math.round(Math.sin(t * 2) * 2);
  drawText('GEAR', x0, y + bob, 6, '#ffd23f', 'left', '#8a5a00', '#140c26');
  drawText('BUGS', x0 + w1 + gap, y - bob, 6, '#7df06a', 'left', '#2f7f2b', '#140c26');
  drawGear(ctx, x0 + w1 + gap / 2, y + 20, 6, 6, t * 3, '#ffffff', '#140c26');
}

function drawMenu() {
  drawBackdrop();
  dim(0.35);
  const ty = OY + 58;
  drawTitle(ty);
  drawText('A TINY SPIDER ADVENTURE', BW / 2, ty + 58, 1, '#ffffff', 'center', '#140c26');
  // parade: spider running from the lizard across the ground
  const span = WORLD_W + 120;
  const sxp = ((globalT * 60) % span) - 60 + OX;
  drawSpiderSprite(sxp, OY + 312, 0, 1, globalT * 25, { gear: globalT * 6 });
  drawLizardSprite(sxp - 70, OY + 314, 0, 1, globalT * 12, Math.sin(globalT * 3) * 0.3, { mouthOpen: Math.sin(globalT * 2) > 0.7 });
  drawButtons();
  const hint = lastInput === 'touch' ? 'TAP TO SELECT' : lastInput === 'gamepad' ? 'D-PAD + A TO SELECT' : 'ARROWS + ENTER OR CLICK';
  drawText(hint, BW / 2, OY + 272, 1, 'rgba(255,255,255,0.85)', 'center', '#140c26');
  if (bestTime !== null) drawText('BEST TIME ' + fmtTime(bestTime), BW / 2, OY + 286, 1, '#ffd23f', 'center', '#140c26');
}

function drawOptions() {
  drawBackdrop();
  dim(0.6);
  drawText('OPTIONS', BW / 2, BH / 2 - 130, 4, '#ffd23f', 'center', null, '#140c26');
  drawButtons();
  // controls reference panel
  const px = BW / 2 - 50, py = BH / 2 - 88, pw = 300, ph = 186;
  panel(px, py, pw, ph, 0.8);
  const lines = [
    ['KEYBOARD + MOUSE', '#ffd23f'],
    ['WASD/ARROWS  CRAWL + CLIMB', '#ffffff'],
    ['SPACE        JUMP / LET GO OF WEB', '#ffffff'],
    ['CLICK        SHOOT WEB AT CURSOR', '#ffffff'],
    ['J/K/F        SHOOT WEB', '#ffffff'],
    ['ESC / P      PAUSE', '#ffffff'],
    ['GAMEPAD', '#7df06a'],
    ['L-STICK/DPAD CRAWL    A  JUMP', '#ffffff'],
    ['R-STICK AIM  RB/RT/X  SHOOT WEB', '#ffffff'],
    ['START        PAUSE', '#ffffff'],
    ['TOUCH', '#9ad0ff'],
    ['LEFT SIDE    VIRTUAL STICK', '#ffffff'],
    ['WEB BUTTON   DRAG TO AIM, RELEASE', '#ffffff'],
    ['TAP WORLD    SHOOT WEB THERE', '#ffffff'],
  ];
  lines.forEach(([l, c], i) => drawText(l, px + 10, py + 8 + i * 12.5, 1, c));
  drawText('HOLD A DIRECTION TO CRAWL ALL THE WAY AROUND ROCKS!', BW / 2, BH / 2 + 110, 1, 'rgba(255,255,255,0.8)', 'center', '#140c26');
}

function drawEndScreen(win) {
  dim(0.62);
  const y = BH / 2 - 90;
  if (win) {
    drawText('VICTORY!', BW / 2, y, 6, '#ffd23f', 'center', '#8a5a00', '#140c26');
    drawText('THE LIZARD IS WEBBED AND BITTEN!', BW / 2, y + 52, 1, '#ffffff', 'center', '#140c26');
  } else {
    drawText('GAME OVER', BW / 2, y, 6, '#ff5a7a', 'center', '#7a1f3a', '#140c26');
    drawText('THE LIZARD GOT YOU. TRY AGAIN!', BW / 2, y + 52, 1, '#ffffff', 'center', '#140c26');
  }
  const pw = 200, px = Math.round(BW / 2 - pw / 2), py = y + 66;
  panel(px, py, pw, 44, 0.8);
  drawText('TIME   ' + fmtTime(gameTime), px + 16, py + 8, 1, '#ffffff');
  drawText('COINS  ' + totalCoins, px + 16, py + 20, 1, '#ffd23f');
  drawText('HP     ' + Math.max(0, hp) + '/3', px + 16, py + 32, 1, '#ff8ca0');
  if (win && newRecord) { if (Math.floor(globalT * 4) % 2) drawText('NEW BEST!', px + pw - 12, py + 8, 1, '#7df06a', 'right'); }
  else if (bestTime !== null) drawText('BEST ' + fmtTime(bestTime), px + pw - 12, py + 8, 1, '#7df06a', 'right');
  drawButtons();
}

function drawRotatePrompt() {
  ctx.fillStyle = '#1a1330'; ctx.fillRect(0, 0, BW, BH);
  const cx = BW / 2, cy = BH / 2 - 60;
  const a = (Math.sin(globalT * 2) * 0.5 + 0.5) * Math.PI / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-a);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(-30, -52, 60, 104);
  ctx.fillStyle = '#1a1330'; ctx.fillRect(-25, -44, 50, 84);
  ctx.fillStyle = '#7df06a'; ctx.fillRect(-25, 10, 50, 30);
  ctx.restore();
  drawText('ROTATE YOUR DEVICE', cx, cy + 90, 3, '#ffffff', 'center', '#000000');
  drawText('GEAR BUGS PLAYS BEST IN LANDSCAPE', cx, cy + 124, 2, '#ffd23f', 'center');
  drawText('TAP TO PLAY ANYWAY', cx, cy + 160, 2, 'rgba(255,255,255,0.7)', 'center');
}

function render() {
  ctx.imageSmoothingEnabled = false;
  if (rotateBlocked()) { drawRotatePrompt(); return; }
  switch (gameState) {
    case 'menu': drawMenu(); break;
    case 'options': drawOptions(); break;
    case 'play':
      drawWorld(); drawHUD();
      if (lastInput === 'touch') drawTouchControls();
      break;
    case 'pause':
      drawWorld(); drawHUD(); dim(0.55);
      drawText('PAUSED', BW / 2, BH / 2 - 60, 5, '#ffffff', 'center', null, '#140c26');
      drawButtons();
      break;
    case 'gameover': drawWorld(); drawEndScreen(false); break;
    case 'victory': drawWorld(); drawEndScreen(true); break;
  }
  if (gameState !== 'play') {
    canvas.style.cursor = canvas.style.cursor === 'none' ? 'default' : canvas.style.cursor;
  } else if (lastInput !== 'mouse') canvas.style.cursor = 'default';
}

/* =====================================================================
   10. RESIZE & MAIN LOOP
   ===================================================================== */
function resize() {
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  const aspect = vw / vh;
  if (aspect >= WORLD_W / WORLD_H) { BH = WORLD_H; BW = Math.round(WORLD_H * aspect); }
  else { BW = WORLD_W; BH = Math.round(WORLD_W / aspect); }
  canvas.width = BW; canvas.height = BH;
  canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
  OX = Math.floor((BW - WORLD_W) / 2);
  OY = Math.floor((BH - WORLD_H) / 2);
  ctx.imageSmoothingEnabled = false;
  buildLayers();
  layoutTouch();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  globalT += dt;
  pollGamepad();
  handleGlobalInput(dt);
  if (gameState === 'play' && !rotateBlocked()) update(dt);
  updateAmbient(dt);
  render();
  for (const k in keysPressed) delete keysPressed[k];
  requestAnimationFrame(frame);
}

resize();
newGame();          // prepare a world so menus have something to show
gameState = 'menu';
requestAnimationFrame(frame);
</script>
