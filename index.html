/* ===== 66_ants.js ===== */
/* =====================================================================
   66_ANTS - level 6: the ant colony
   ---------------------------------------------------------------------
   Nest   : invisible controller. Ants trickle out of the ant hill slowly,
            then faster and faster; every ant that comes out raises the
            sand. When a spider gets 5 flies the nest bursts: a swarm,
            flying ants and the Queen pour out until the Queen falls.
   Ant    : wanders over every surface; locks on and bites when a spider
            gets close. One web kills it (no power-up needed).
   FlyingAnt: flies around the hill, dives at nearby spiders. One web.
   Queen  : big crowned ant. Web her (needs 5 flies), then bite her.
   ===================================================================== */
const allSurfaces = p => p.y > WORLD_TOP + 2;

class Ant extends Enemy {
  constructor(x, y, opts = {}) {
    super('ant', x, y);
    this.r = 5; this.hitR = 10; this.state = 'air'; this.plat = null; this.s = 0; this.nx = 0; this.ny = -1;
    this.vx = opts.vx !== undefined ? opts.vx : (Math.random() - 0.5) * 140; this.vy = opts.vy !== undefined ? opts.vy : -150 - Math.random() * 60;
    this.walk = 0; this.wanderSign = Math.random() < 0.5 ? -1 : 1; this.locked = false; this.calmT = 0.8;
    this.attackCD = 0.6; this.jumpCD = 1 + Math.random(); this.stallT = 0; this.base = 30; this.chase = 62; this.lockR = 58;
  }
  onWeb(W) { this.squash(W, true); return 'kill'; }
  biteable() { return false; }
  squash(W, byWeb) {
    if (!this.alive) return;
    this.alive = false;
    burst(W, this.x, this.y, 10, this.burstColors(), 70, 0.45);
    if (byWeb) { SFX.play('beedown'); floater(W, this.x, this.y - 10, 'SPLAT!', '#ffffff'); }
  }
  burstColors() { return ['#0c0c10', '#3a3a46', '#ffffff', '#24242c']; }
  update(dt, W) {
    if (this.mirror) { this.glide(dt); return; }
    const D = W.D;
    this.attackCD -= dt; this.jumpCD -= dt; this.calmT -= dt;
    if (this.plat && !PLATS.includes(this.plat)) { this.state = 'air'; this.plat = null; }   // buried under the sand
    const t = W.nearestTarget(this.x, this.y);
    const d = t ? dist(this.x, this.y, t.x, t.y) : 999;
    if (!this.locked && this.calmT <= 0 && t && d < this.lockR * Math.sqrt(D.aggro) && lineOfSight(this.x, this.y, t.x, t.y)) { this.locked = true; this.lockFlash = 0.4; }
    if (this.locked && (d > 160 || !t)) this.locked = false;
    this.lockFlash = Math.max(0, (this.lockFlash || 0) - dt);
    if (this.state === 'air') crawlerFly(this, dt, null, W);
    else if (!this.tickFrozen(dt, W)) {
      let sign = this.wanderSign, speed = this.base * D.speed;
      if (this.locked && t) {
        const g = greedyDir(this, t.x, t.y, allSurfaces);
        sign = g.sign; speed = this.chase * D.speed;
        if (!sign || this.stallT > 0.35) {
          if (this.jumpCD <= 0 && d < 140) { jumpToward(this, t.x, t.y - 4, 300, 0.3, 0.7, 240); this.jumpCD = (1.6 + Math.random()) / D.aggro; this.stallT = 0; }
        }
      } else if (Math.random() < dt * 0.25) this.wanderSign *= -1;
      if (this.state === 'stuck' && sign) {
        const res = crawlMove(this, sign * speed * dt, allSurfaces);
        if (res === 'blocked') { this.stallT += dt; if (!this.locked) this.wanderSign *= -1; }
        else { this.stallT = Math.max(0, this.stallT - dt); this.facing = sign; this.walk += speed * dt; }
      }
      if (this.state === 'stuck' && !this.locked && this.jumpCD <= 0 && Math.random() < dt * 0.08) {   // the odd random hop
        jumpToward(this, this.x + (Math.random() - 0.5) * 120, this.y - 40 - Math.random() * 40, 260, 0.35, 0.7, 200); this.jumpCD = 2.5;
      }
    }
    if (this.state === 'stuck') syncStuck(this);
    const target = this.state === 'stuck' ? Math.atan2(this.ny, this.nx) + Math.PI / 2 : Math.atan2(this.vy, Math.abs(this.vx) + 1) * 0.4;
    this.drawAngle += angDiff(this.drawAngle, target) * Math.min(1, dt * 14);
    if (this.frozenT > 0 || !t) return;
    // bite on contact, then back off for a moment
    if (this.locked && this.attackCD <= 0 && d < this.r + t.r + 3) {
      W.hurt(t, 'hit', this); this.attackCD = 1.5; this.locked = false; this.calmT = 1.6; this.wanderSign = -(Math.sign(t.x - this.x) || 1);
    }
  }
  draw(W) {
    if (!this.alive) return;
    drawAnt(this.x, this.y, this.drawAngle, this.facing, this.walk, { angry: this.locked, flash: this.lockFlash > 0, hell: W.D.hell, air: this.state === 'air' });
  }
}

class Queen extends Ant {
  constructor(x, y) {
    super(x, y, { vx: (Math.random() - 0.5) * 80, vy: -240 });
    this.type = 'queen'; this.r = 9; this.hitR = 16; this.base = 40; this.chase = 70; this.lockR = 110; this.breathT = 0;
    this.hopT = 3;
  }
  onWeb(W, S) { return Enemy.prototype.onWeb.call(this, W, S); }
  biteable() { return this.frozenT > 0; }
  cancelAttacks() { this.breathT = 0; }
  defeat(W, by) { Enemy.prototype.defeat.call(this, W, by); }
  burstColors() { return ['#0c0c10', '#ffd23f', '#3a3a46', '#ffffff']; }
  update(dt, W) {
    if (this.mirror) { this.glide(dt); return; }
    // she darts around the arena now and then so the fight stays lively
    this.hopT -= dt;
    if (this.state === 'stuck' && this.frozenT <= 0 && this.hopT <= 0 && !this.locked) {
      this.hopT = (3 + Math.random() * 3) / W.D.aggro;
      jumpToward(this, 80 + Math.random() * 480, 60 + Math.random() * 140, 380, 0.4, 0.9, 260);
    }
    super.update(dt, W);
    if (this.frozenT > 0) return;
    const t = W.nearestTarget(this.x, this.y);
    if (t && this.state === 'stuck') { const h = headFrom(this, 12); hellBreath(this, W, dt, h.x, h.y, Math.atan2(t.y - h.y, t.x - h.x), t); }
  }
  draw(W) {
    if (!this.alive) return;
    drawAnt(this.x, this.y, this.drawAngle, this.facing, this.walk, { queen: true, angry: this.locked, hell: W.D.hell, frozen: this.frozenT > 0, shiver: this.frozenT > 0 && this.frozenT < 1.5, air: this.state === 'air', fire: this.breathT > 0 });
    this.drawFreezeBar(W);
  }
}

class FlyingAnt extends Bee {
  constructor(x, y, home) {
    super(x, y, null);
    this.type = 'fant'; this.home = home; this.seeR = 100; this.spd = 70; this.vy = -90;
  }
  onWeb(W, S) { this.knock(W, S, false); return 'knock'; }
  draw(W) {
    if (!this.alive) return;
    drawAnt(this.x, this.y, this.state === 'fall' ? T * 9 : 0, this.facing, T * 40, { wings: this.state !== 'fall', angry: this.state === 'chase', hell: W.D.hell, air: true });
  }
}

/* ---------- The nest: spawns the colony and raises the sand ---------- */
class Nest extends Enemy {
  constructor(W) {
    super('nest', W.L.enemySpawn.x, W.L.enemySpawn.y);
    const L = W.L, D = W.D;
    this.mound = L.mound; this.ground = L.plats.find(p => p.type === 'sand2');
    this.gBase = this.ground.y; this.gH = this.ground.h; this.mBase = this.mound.y; this.mH = this.mound.h; this.spawnBase = L.spawns.map(s => s.y);
    this.phase = 'calm'; this.t = 0; this.swarmT = 0; this.spawnT = 3; this.flyT = 0; this.rise = 0; this.riseTarget = 0; this.queen = null;
    this.hellK = D.hell ? 1.4 : 1;
    this.maxRise = 118;
  }
  webbable() { return false; }
  biteable() { return false; }
  hole() { return { x: this.mound.x + this.mound.w / 2, y: this.mound.y - 2 }; }
  count(type) { let n = 0; for (const e of this.W.enemies) if (e.alive && e.type === type) n++; return n; }
  emitAnt(W) {
    const h = this.hole();
    W.enemies.push(new Ant(h.x + (Math.random() - 0.5) * 6, h.y - 4));
    burst(W, h.x, h.y, 5, ['#e8b27a', '#c99560'], 50, 0.4, 200, 1);
    this.riseTarget = Math.min(this.maxRise, this.riseTarget + (this.phase === 'calm' ? 1.6 : 0.9));
  }
  update(dt, W) {
    this.W = W;
    const D = W.D;
    this.t += dt;
    if (this.mound.burstT > 0) this.mound.burstT -= dt;
    if (this.phase === 'calm') {
      // trickle: slow at first, steadily quicker
      const interval = Math.max(1.4, 6.5 - this.t * 0.07) / Math.sqrt(D.aggro);
      const cap = Math.min(9, 3 + Math.floor(this.t / 18)) + (D.hell ? 3 : 0);
      this.spawnT -= dt;
      if (this.spawnT <= 0) { this.spawnT = interval; if (this.count('ant') < cap) this.emitAnt(W); }
      const best = Math.max(0, ...W.spiders.filter(s => s.alive).map(s => s.flies));
      this.mound.tremble = best >= 4;
      if (W.spiders.some(s => s.alive && s.powered)) this.burst(W);
    } else if (this.phase === 'swarm') {
      this.swarmT += dt;
      const interval = Math.max(0.3, 1.1 - this.swarmT * 0.02) / Math.sqrt(D.aggro);
      const cap = Math.round((D.speed < 0.9 ? 11 : 15) * this.hellK + Math.min(8, this.swarmT / 6));
      this.spawnT -= dt;
      if (this.spawnT <= 0) { this.spawnT = interval; if (this.count('ant') < cap) this.emitAnt(W); }
      this.flyT -= dt;
      if (this.flyT <= 0) { this.flyT = 5; if (this.count('fant') < this.fliers) { const h = this.hole(); W.enemies.push(new FlyingAnt(h.x, h.y - 8, { x: h.x, y: 130 })); } }
      this.riseTarget = Math.min(this.maxRise, this.riseTarget + 0.5 * dt);   // the swarm keeps digging
      if (this.queen && !this.queen.alive) this.finish(W);
    } else if (this.phase === 'done') {
      for (const e of W.enemies) if (e.alive && e.poofT !== undefined) { e.poofT -= dt; if (e.poofT <= 0) { e.alive = false; burst(W, e.x, e.y, 6, ['#e8b27a', '#24242c'], 50, 0.4); } }
    }
    // the sand creeps up as the colony digs out
    const prev = this.rise;
    this.rise = approach(this.rise, this.riseTarget, 7 * dt);
    const dy = -(this.rise - prev);
    this.ground.y = this.gBase - this.rise; this.ground.h = this.gH + this.rise; this.ground.dy = dy;
    this.mound.y = this.mBase - this.rise; this.mound.dy = dy;
    W.L.spawns.forEach((s, i) => { s.y = this.spawnBase[i] - this.rise; });
    if (dy) this.buryCheck(W);
    if (this.phase === 'swarm' && Math.random() < dt * 8) { const h = this.hole(); W.particles.push({ x: h.x + (Math.random() - 0.5) * 14, y: h.y, vx: (Math.random() - 0.5) * 40, vy: -40 - Math.random() * 40, life: 0.6, max: 0.6, color: '#e8c890', size: 1, grav: 120 }); }
  }
  buryCheck(W) {
    const top = this.ground.y;
    for (let i = PLATS.length - 1; i >= 0; i--) {
      const p = PLATS[i];
      if (!p.buriable || top > p.y + p.h * 0.45) continue;
      PLATS.splice(i, 1);
      burst(W, p.x + p.w / 2, top, 10, ['#e8b27a', '#c99560'], 50, 0.5);
      for (const s of W.spiders) {
        if (s.plat === p) { s.state = 'air'; s.plat = null; s.vx = 0; s.vy = -40; }
        if (s.rope && s.rope.plat === p) { s.state = 'air'; s.rope = null; }
      }
      for (const e of W.enemies) if (e.plat === p) { e.state = 'air'; e.plat = null; }
    }
  }
  burst(W) {
    this.phase = 'swarm'; this.mound.burstT = 1.5; this.mound.open = true; this.mound.tremble = false; this.spawnT = 0.6;
    const D = W.D, h = this.hole();
    SFX.play('shriek'); shake(0.6, 6);
    burst(W, h.x, h.y, 50, ['#e8b27a', '#c99560', '#f6e0a8', '#8a5a2a'], 180, 0.9, 260);
    const n = D.speed < 0.9 ? 6 : D.hell ? 12 : 9;
    for (let i = 0; i < n; i++) W.enemies.push(new Ant(h.x + (Math.random() - 0.5) * 20, h.y - 6, { vx: (Math.random() - 0.5) * 260, vy: -200 - Math.random() * 120 }));
    this.fliers = D.speed < 0.9 ? 2 : D.hell ? 5 : 3;
    for (let i = 0; i < this.fliers; i++) { const f = new FlyingAnt(h.x + (i - 1) * 10, h.y - 10, { x: h.x, y: 130 }); f.vx = (Math.random() - 0.5) * 120; W.enemies.push(f); }
    this.queen = new Queen(h.x, h.y - 10);
    W.enemies.push(this.queen);
    this.riseTarget = Math.min(this.maxRise, this.riseTarget + 10);
    if (W.rules.onBossSpawn) W.rules.onBossSpawn(this.queen);
  }
  finish(W) {
    this.phase = 'done';
    // without their queen the colony scatters
    let k = 0;
    for (const e of W.enemies) if (e.alive && (e.type === 'ant' || e.type === 'fant')) e.poofT = 0.4 + 0.12 * k++;
  }
  draw() {}
}

/* Ant sprite: head, thorax, big abdomen, six scurrying legs. o.queen adds a crown, o.wings flutters */
function drawAnt(x, y, ang, facing, walk, o) {
  const q = !!o.queen, s = q ? 2 : 1;
  ctx.save(); ctx.translate(Math.round(x + (o.shiver ? Math.sin(T * 60) : 0)), Math.round(y)); ctx.rotate(ang); ctx.scale(facing * s, s);
  const dark = '#0c0c10', mid = o.hell ? '#3a1414' : q ? '#2c2c36' : '#24242c', hi = o.hell ? '#8a2a2a' : '#5a5a6a';   // black ants with a glossy sheen
  // legs (drawn under the body), alternating tripod gait
  ctx.fillStyle = dark;
  for (let i = 0; i < 3; i++) {
    const ph = Math.sin(walk * 0.5 + i * 2.1) * (o.air ? 0.4 : 1.6), lx = -1 + i * 2;
    ctx.fillRect(Math.round(lx + ph), 1, 1, 3); ctx.fillRect(Math.round(lx - ph * 0.6) - 1, 3, 2, 1);
  }
  if (o.wings) { const f = Math.sin(T * 60) > 0; ctx.fillStyle = 'rgba(220,235,255,0.75)'; ctx.fillRect(-4, f ? -6 : -4, 5, 2); ctx.fillRect(-1, f ? -7 : -5, 5, 2); }
  // abdomen, thorax, head
  pxEllipse(ctx, -5, -1, q ? 4 : 3, q ? 3 : 2, dark);
  pxEllipse(ctx, -5, -2, q ? 3 : 2, q ? 2 : 1, mid);
  if (q) { ctx.fillStyle = '#3e3e4a'; ctx.fillRect(-8, -1, 1, 3); ctx.fillRect(-6, -1, 1, 3); ctx.fillRect(-4, -1, 1, 3); }
  ctx.fillStyle = hi; ctx.fillRect(q ? -7 : -6, -3, 2, 1);
  ctx.fillStyle = dark; ctx.fillRect(-1, -2, 3, 2); ctx.fillStyle = mid; ctx.fillRect(-1, -2, 2, 1);
  pxCircle(ctx, 3, -2, 1.5, dark); ctx.fillStyle = hi; ctx.fillRect(3, -3, 1, 1);
  ctx.fillStyle = o.angry || o.flash ? '#ff3b3b' : '#ffd27a'; ctx.fillRect(4, -2, 1, 1);
  // antennae + mandibles
  ctx.fillStyle = dark; ctx.fillRect(4, -5, 1, 2); ctx.fillRect(5, -6, 1, 1); ctx.fillRect(2, -5, 1, 2); ctx.fillRect(1, -6, 1, 1);
  if (o.angry) { ctx.fillStyle = '#ffe6c8'; ctx.fillRect(5, -1, 1, 1); }
  if (q) { // crown
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(1, -5, 5, 1); ctx.fillRect(1, -7, 1, 2); ctx.fillRect(3, -8, 1, 3); ctx.fillRect(5, -7, 1, 2);
    ctx.fillStyle = '#ff2d4a'; ctx.fillRect(3, -6, 1, 1);
  }
  ctx.restore();
  if (o.frozen) { ctx.globalAlpha = 0.6; pxCircle(ctx, x, y - 2, q ? 14 : 7, '#ffffff'); ctx.globalAlpha = 1; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - 12, y - 8); ctx.lineTo(x + 12, y + 4); ctx.moveTo(x - 10, y + 4); ctx.lineTo(x + 11, y - 9); ctx.stroke(); }
  if (o.fire && Math.random() < 0.3) { ctx.fillStyle = '#ffe45c'; ctx.fillRect(Math.round(x + facing * 10), Math.round(y - 4), 2, 2); }
}

/* ===== 70_world.js ===== */
/* =====================================================================
   70_WORLD - the simulation container shared by campaign, VS and warm-up
   ---------------------------------------------------------------------
   Game-mode rules plug in through a `rules` object of callbacks, so the
   same physics/enemy code runs everywhere.
   ===================================================================== */
class World {
  constructor(o) {
    this.mode = o.mode;                         // 'campaign' | 'vs' | 'warmup'
    this.biome = o.biome; this.seed = o.seed >>> 0;
    this.D = o.D || DIFFS[o.diff !== undefined ? o.diff : 1];
    this.authority = o.authority !== false;     // simulates enemies + flies (offline / host)
    this.rules = o.rules || {};
    this.L = generateLevel(this.biome, this.seed);
    PLATS = this.L.plats;
    WATER_Y = this.L.water ? this.L.water.y : Infinity;
    this.spiders = []; this.remotes = new Map();
    this.enemies = []; this.flies = []; this.webs = []; this.enemyShots = [];
    this.fire = new FireSystem(); this.particles = []; this.floaters = [];
    this.starCoin = null; this.time = 0; this.localId = null; this.aim = null;
    this.claimed = new Map();                   // fly id -> time (guest optimistic claims)
    this.ambient = [];
    const ar = rng(this.seed ^ 0x55);
    const n = this.biome >= 3 ? 26 : 4;
    for (let i = 0; i < n; i++) this.ambient.push({ x: ar() * REF_W, y: 40 + ar() * 220, t: ar() * 10, c: pick(ar, ['#ff8cc6', '#ffd23f', '#9ad0ff', '#ffffff']) });
    buildLevelArt(this.L);
  }
  activate() { PLATS = this.L.plats; WATER_Y = this.L.water ? this.L.water.y : Infinity; if (ART.level !== this.L || ART.bw !== BW || ART.bh !== BH) buildLevelArt(this.L); }

  /* ---------- queries ---------- */
  allSpiders() { const a = this.spiders.slice(); for (const r of this.remotes.values()) a.push(r); return a; }
  findSpider(id) { for (const s of this.spiders) if (s.id === id) return s; return this.remotes.get(id) || null; }
  localSpider() { return this.spiders.find(s => s.id === this.localId) || null; }
  targets() {
    const out = [];
    for (const s of this.spiders) if (s.alive) out.push({ x: s.x, y: s.y, r: s.r, vx: s.vx, vy: s.vy, id: s.id, ref: s, local: true });
    if (this.authority) for (const s of this.remotes.values()) if (s.alive && s.x > -50) out.push({ x: s.x, y: s.y, r: s.r, vx: s.vx, vy: s.vy, id: s.id, ref: s, local: false });
    return out;
  }
  nearestTarget(x, y) {
    let best = null, bd = Infinity;
    for (const t of this.targets()) { const d = dist(x, y, t.x, t.y); if (d < bd) { bd = d; best = t; } }
    return best;
  }
  hurt(t, kind, src) {
    if (t.local) t.ref.applyHurt(kind, src, this);
    else if (this.rules.onRemoteHurt) this.rules.onRemoteHurt(t.id, kind, src);
  }

  /* ---------- flies ---------- */
  spawnFly(id, kind) {
    for (let tries = 0; tries < 60; tries++) {
      const x = 40 + Math.random() * (REF_W - 80), y = 40 + Math.random() * 220;
      if (y > WATER_Y - 30) continue;
      if (platAt(x, y) || findCollision(x, y, 10)) continue;
      let ok = true;
      for (const s of this.spiders) if (dist(x, y, s.x, s.y) < 70) ok = false;
      if (!ok) continue;
      const f = new Fly(x, y, id, kind);
      this.flies.push(f);
      burst(this, x, y, 8, kind === 'heart' ? ['#ff2d4a', '#ffb3c1'] : ['#fff3a0', '#ffd23f'], 50, 0.4, 0, 1);
      return f;
    }
    return null;
  }
  collectFly(f, sp) {
    const i = this.flies.indexOf(f);
    if (i >= 0) this.flies.splice(i, 1);
    if (f.heart) { if (this.rules.onHeart) this.rules.onHeart(sp, f); else healSpider(this, sp, f.x, f.y); return; }
    burst(this, f.x, f.y, 10, ['#ffd23f', '#fff3a0', '#ffffff'], 80, 0.5);
    if (this.rules.onFlyCollected) this.rules.onFlyCollected(sp, f);
  }

  /* ---------- simulation step ---------- */
  step(dt, controlsFor) {
    this.time += dt;
    if (this.L.movers) {
      // lifts run on a round clock; VS nudges it toward the host's so everyone sees the same positions
      this.moverT = (this.moverT || 0) + dt;
      if (this.moverTarget !== undefined) { const err = this.moverTarget - this.moverT; if (Math.abs(err) > 1) this.moverT = this.moverTarget; else this.moverT += err * Math.min(1, dt * 3); }
      updateMovers(this.L, this.moverT);
    }
    // ropes anchored to a moving lift or the rising sand travel with it
    for (const s of this.spiders) if (s.rope && s.rope.plat && (s.rope.plat.dx || s.rope.plat.dy)) { s.rope.ax += s.rope.plat.dx || 0; s.rope.ay += s.rope.plat.dy || 0; }
    for (const s of this.spiders) s.update(dt, controlsFor(s), this);
    for (const r of this.remotes.values()) r.update(dt);
    for (const e of this.enemies) if (e.alive) e.update(dt, this);
    for (let i = this.enemies.length - 1; i >= 0; i--) { const e = this.enemies[i]; if (!e.alive && (e.type === 'bee' || e.type === 'ant' || e.type === 'fant')) this.enemies.splice(i, 1); }
    for (const w of this.webs) w.update(dt, this);
    this.webs = this.webs.filter(w => !w.dead);
    this.updateEnemyShots(dt);
    if (this.authority) this.fire.update(dt, this);
    for (const f of this.flies.slice()) f.update(dt, this);
    this.flies = this.flies.filter(f => !f.gone);
    // touching a fly collects it
    for (const s of this.spiders) {
      if (!s.alive) continue;
      for (const f of this.flies.slice()) if (f.state === 'free' && dist(s.x, s.y, f.x, f.y) < s.r + (f.heart ? 9 : 6)) { if (!f.heart) SFX.play('fly'); this.collectFly(f, s); }
    }
    // bites: a powered spider touching a frozen enemy defeats it
    for (const s of this.spiders) {
      if (!s.alive || s.immobile) continue;
      for (const e of this.enemies) {
        if (!e.alive) continue;
        const can = e.biteCheck ? e.biteCheck(s) : e.biteable() && dist(s.x, s.y, e.x, e.y) < s.r + e.r + 4;
        if (can && this.rules.onEnemyBite) this.rules.onEnemyBite(e, s);
      }
      if (this.mode === 'vs' && s.powered && this.rules.onPvPBite) {
        for (const o of this.allSpiders()) if (o !== s && o.alive && o.team !== s.team && o.frozenT > 0 && dist(s.x, s.y, o.x, o.y) < s.r + o.r + 3) this.rules.onPvPBite(s, o);
      }
    }
    // star coin (campaign)
    if (this.starCoin) {
      const sc = this.starCoin; sc.t += dt;
      if (!sc.landed) {
        const prevY = sc.y;
        sc.vy = Math.min(sc.vy + G * dt, 400); sc.y += sc.vy * dt;
        for (const p of PLATS) if (sc.vy > 0 && sc.x >= p.x - 3 && sc.x <= p.x + p.w + 3 && prevY + 9 <= p.y + 1 + Math.max(0, -(p.dy || 0)) && sc.y + 9 >= p.y) { sc.y = p.y - 9; sc.landed = true; sc.vy = 0; if (p.move) { sc.plat = p; sc.ox = sc.x - p.x; } break; }
        if (sc.y > WATER_Y - 20) { sc.y = WATER_Y - 20; sc.landed = true; sc.vy = 0; }
      }
      if (sc.plat) { sc.x = sc.plat.x + sc.ox; sc.y = sc.plat.y - 9; }
      for (const s of this.spiders) if (s.alive && sc.t > 0.6 && dist(s.x, s.y, sc.x, sc.y) < s.r + 11) { this.starCoin = null; if (this.rules.onStarCoin) this.rules.onStarCoin(s, sc); break; }
      if (this.starCoin && Math.random() < dt * 12) this.particles.push({ x: sc.x + (Math.random() - 0.5) * 16, y: sc.y + (Math.random() - 0.5) * 16, vx: 0, vy: -15, life: 0.5, max: 0.5, color: '#fff3a0', size: 1, grav: 0 });
    }
    // particles / floaters / ambient
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt; if (p.life <= 0) { this.particles.splice(i, 1); continue; }
      p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = this.floaters.length - 1; i >= 0; i--) { const f = this.floaters[i]; f.life -= dt; f.y -= 22 * dt; if (f.life <= 0) this.floaters.splice(i, 1); }
    for (const a of this.ambient) { a.t += dt; if (this.biome >= 3) { a.x += Math.sin(a.t * 0.5) * 6 * dt; a.y += Math.cos(a.t * 0.7) * 4 * dt; } else { a.x += Math.cos(a.t * 0.7) * 20 * dt; a.y += Math.sin(a.t * 1.3) * 15 * dt; } a.x = clamp(a.x, 20, 620); a.y = clamp(a.y, 30, 290); }
    for (const [id, t] of this.claimed) if (this.time - t > 3) this.claimed.delete(id);
  }
  updateEnemyShots(dt) {
    for (const s of this.enemyShots) {
      s.life -= dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.kind === 'fire') { s.vy += 60 * dt; if (Math.random() < 0.7) this.particles.push({ x: s.x, y: s.y, vx: 0, vy: -10, life: 0.25, max: 0.25, color: pick(Math.random, ['#ff8a00', '#ffe45c']), size: 2, grav: 0 }); }
      const p = platAt(s.x, s.y);
      if (p) {
        s.life = 0;
        if (s.kind === 'fire') { if (this.authority) this.fire.ignite(p, s.x - s.vx * 0.02, s.y - s.vy * 0.02, this); burst(this, s.x, s.y, 6, ['#ff8a00', '#ffe45c'], 50, 0.3); }
        else burst(this, s.x, s.y, 8, ['#ffffff', '#cccccc'], 40, 0.4);
        continue;
      }
      if (!this.authority) continue;
      for (const t of this.targets()) if (dist(s.x, s.y, t.x, t.y) < t.r + 4) { s.life = 0; this.hurt(t, s.kind === 'fire' ? 'fire' : 'stun', s.src || s); burst(this, s.x, s.y, 8, s.kind === 'fire' ? ['#ff8a00', '#ffe45c'] : ['#ffffff'], 60, 0.4); break; }
    }
    this.enemyShots = this.enemyShots.filter(s => s.life > 0);
  }

  /* ---------- rendering ---------- */
  draw() {
    this.activate();
    let sx = 0, sy = 0;
    if (shakeT > 0) { sx = Math.round((Math.random() - 0.5) * shakeMag * 2); sy = Math.round((Math.random() - 0.5) * shakeMag * 2); }
    ctx.save();
    ctx.translate(sx, sy);
    ctx.drawImage(ART.sky, 0, 0);
    for (const c of ART.clouds) ctx.drawImage(ART.cloudSprites[c.spr], Math.round(c.x), Math.round(c.y));
    if (this.biome === 4) { ctx.save(); ctx.translate(OX, OY); drawFactoryGears(T); ctx.restore(); }
    ctx.drawImage(ART.scene, 0, 0);
    ctx.translate(OX, OY);
    for (const p of PLATS) if (p.dyn) drawDynPlatform(p, this.time);
    drawWheat(this.L, T, false);
    this.drawAmbient();
    this.fire.draw();
    for (const f of this.flies) f.draw();
    if (this.starCoin) drawStarCoin(this.starCoin.x, this.starCoin.y + (this.starCoin.landed ? Math.sin(T * 3) * 2 : 0));
    for (const e of this.enemies) if (e.type === 'hive') e.draw(this);
    for (const e of this.enemies) if (e.type !== 'hive') e.draw(this);
    for (const s of this.spiders) if (s.rope && s.state === 'rope') drawRope(s.x, s.y, s.rope);
    for (const w of this.webs) w.draw(this);
    this.drawAimGuide();
    for (const r of this.remotes.values()) r.draw();
    for (const s of this.spiders) s.draw(this);
    if (this.mode === 'vs') for (const s of this.allSpiders()) this.drawNameTag(s);
    for (const s of this.enemyShots) {
      if (s.kind === 'fire') { pxCircle(ctx, s.x, s.y, 3, '#ff6a00'); pxCircle(ctx, s.x, s.y, 2, '#ffe45c'); }
      else { pxCircle(ctx, s.x, s.y, 3, '#e8e8f0'); ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y) - 1, 2, 2); }
    }
    for (const p of this.particles) { ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size); }
    ctx.globalAlpha = 1;
    drawWater(this.L, T);
    drawWheat(this.L, T, true);
    for (const f of this.floaters) { ctx.globalAlpha = clamp(f.life * 2, 0, 1); drawText(f.text, f.x, f.y, 1, f.color, 'center', '#140c26'); }
    ctx.globalAlpha = 1;
    // mouse crosshair
    const me = this.localSpider();
    if (me && me.alive && Input.last === 'mouse' && Input.mouse.active && gameplayPointer) {
      const cx = Math.round(Input.mouse.x - OX), cy = Math.round(Input.mouse.y - OY);
      ctx.fillStyle = '#140c26'; ctx.fillRect(cx - 5, cy - 1, 11, 3); ctx.fillRect(cx - 1, cy - 5, 3, 11);
      ctx.fillStyle = me.powered ? '#ffd23f' : '#ffffff'; ctx.fillRect(cx - 4, cy, 3, 1); ctx.fillRect(cx + 2, cy, 3, 1); ctx.fillRect(cx, cy - 4, 1, 3); ctx.fillRect(cx, cy + 2, 1, 3);
    }
    ctx.restore();
  }
  /* rare glowing red heart butterfly: random chance once `elapsed` passes 10 s */
  maybeSpawnHeart(dt, elapsed) {
    if (elapsed < 10 || this.flies.some(f => f.heart)) return;
    if (Math.random() < dt / 50) this.spawnFly(undefined, 'heart');
  }
  drawAmbient() {
    for (const a of this.ambient) {
      if (this.biome === 5) { const gx = Math.round(((a.x + this.time * 40 + a.t * 7) % 680) - 20), gy = Math.round(a.y); ctx.globalAlpha = 0.5; ctx.fillStyle = '#fff0c8'; ctx.fillRect(gx, gy, 2, 1); ctx.globalAlpha = 1; continue; }
      if (this.biome === 4) { ctx.globalAlpha = 0.25 + 0.25 * Math.sin(a.t * 2); ctx.fillStyle = '#cfe0ff'; ctx.fillRect(Math.round(a.x), Math.round(a.y), 1, 1); ctx.globalAlpha = 1; continue; }
      if (this.biome === 3) { if (a.x > 330 && a.y > 80) { ctx.globalAlpha = 0.35 + 0.3 * Math.sin(a.t * 2); ctx.fillStyle = '#ffe3a0'; ctx.fillRect(Math.round(a.x), Math.round(a.y), 1, 1); ctx.globalAlpha = 1; } continue; }
      if (this.biome === 2) { // seagulls
        const fy = Math.round(a.y * 0.4), fx = Math.round(a.x), w = Math.sin(a.t * 6) > 0 ? 1 : 0;
        ctx.fillStyle = '#ffffff'; ctx.fillRect(fx - 3, fy - w, 3, 1); ctx.fillRect(fx + 1, fy - w, 3, 1); ctx.fillRect(fx, fy, 1, 1);
        continue;
      }
      const f = Math.abs(Math.sin(a.t * 14)) * 2;
      ctx.fillStyle = a.c; ctx.fillRect(Math.round(a.x - 1 - f), Math.round(a.y - 1), Math.ceil(f) + 1, 2); ctx.fillRect(Math.round(a.x + 1), Math.round(a.y - 1), Math.ceil(f) + 1, 2);
      ctx.fillStyle = '#2a1a3a'; ctx.fillRect(Math.round(a.x), Math.round(a.y - 1), 1, 3);
    }
  }
  drawNameTag(s) {
    if (s.x < -50 || !s.alive) return;
    const col = SPIDER_COLORS[s.style.c % 6].ui;
    const label = s.name + (s.flies ? ' ' + Math.min(5, s.flies) : '');
    drawText(label, s.x, s.y - 20, 1, col, 'center', '#140c26');
    if (s.powered) drawText('*', s.x + textWidth(label) / 2 + 5, s.y - 20, 1, '#ffd23f', 'left', '#140c26');
  }
  drawAimGuide() {
    const me = this.localSpider(), aim = this.aim;
    if (!settings.aim || !me || !me.alive || !aim) return;
    let dx, dy;
    if (aim.type === 'point') { dx = aim.x - me.x; dy = aim.y - me.y; } else { dx = aim.x; dy = aim.y; }
    const m = Math.hypot(dx, dy); if (m < 0.01) return;
    dx /= m; dy /= m;
    const hit = rayPlat(me.x, me.y, dx, dy, SP.WEB_RANGE, 3);
    const len = hit ? hit.t : SP.WEB_RANGE;
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    for (let t = 12; t < len; t += 7) ctx.fillRect(Math.round(me.x + dx * t), Math.round(me.y + dy * t), 1, 1);
    if (hit) { ctx.fillStyle = '#7df06a'; ctx.fillRect(Math.round(hit.x) - 2, Math.round(hit.y), 5, 1); ctx.fillRect(Math.round(hit.x), Math.round(hit.y) - 2, 1, 5); }
  }
}

/* ===== 75_campaign.js ===== */
/* =====================================================================
   75_CAMPAIGN - campaign rules, overworld map with fog of war, ending
   ===================================================================== */
const Campaign = {
  W: null, level: 0, diff: 1, phase: 'play', timer: 0, banner: null, time: 0, flyT: 0, me: null,

  restart() { this.start(this.level, this.diff, undefined, this.opts); },
  start(level, diff, forcedSeed, opts) {
    this.opts = opts || {}; this.practice = !!this.opts.practice; this.infinite = !!this.opts.infinite; this.respawnT = 0;
    this.level = level; this.diff = diff; this.phase = 'play'; this.timer = 0; this.time = 0; this.flyT = 0.5;
    const seed = forcedSeed !== undefined ? forcedSeed : (Math.random() * 0xFFFFFFFF) >>> 0;   // pseudo-random layout every attempt
    const W = this.W = new World({ mode: 'campaign', biome: level, seed, diff, authority: true, rules: this.rules() });
    const L = W.L;
    const me = this.me = new SpiderBody('me', L.spawns[0].x, L.spawns[0].y, { style: save.style, name: 'YOU', facing: 1 });
    W.spiders.push(me); W.localId = me.id;
    const es = L.enemySpawn;
    if (level === 0) W.enemies.push(new Lizard(es.x, es.y));
    else if (level === 1) W.enemies.push(new Hive(L.hive.x, L.hive.y));
    else if (level === 2) W.enemies.push(new Gecko(es.x, es.y));
    else if (level === 3) W.enemies.push(new Widow(es.x, es.y, { plat: es.plat }));
    else if (level === 4) W.enemies.push(new LongLegs(es.x, es.y, W.D));
    else W.enemies.push(new Nest(W));          // the queen arrives when the nest bursts
    this.boss = W.enemies[0];
    for (let i = 0; i < 2; i++) W.spawnFly();
    const B = BIOMES[level];
    if (level === 5) this.banner = { text: 'LEVEL 6: ' + B.name, sub: 'CATCH 5 FLIES - THEN THE NEST BURSTS! TAKE DOWN THE QUEEN', t: 3.4, max: 3.4, color: '#ffd23f' };
    else this.banner = B.boss ? { text: 'BOSS: ' + B.npc, sub: 'GET 5 FLIES, THEN WEB ITS LEGS AND BITE THEM OFF', t: 3.4, max: 3.4, color: '#ff8c42' }
                         : { text: 'LEVEL ' + (level + 1) + ': ' + B.name, sub: 'CATCH 5 GOLDEN FLIES, THEN TAKE DOWN THE ' + B.npc, t: 3, max: 3, color: '#ffd23f' };
    track('game_start', { mode: 'campaign', level: level + 1, difficulty: DIFFS[diff].name });
  },
  rules() {
    const C = this;
    return {
      onFlyCollected(sp, f) {
        if (sp.flies >= 5) return;
        sp.flies++;
        floater(C.W, f.x, f.y - 10, '+1 FLY', '#ffd23f');
        if (sp.flies === 5) {
          SFX.play('powerup'); shake(0.2, 2);
          burst(C.W, sp.x, sp.y, 30, ['#ffd23f', '#fff3a0', '#ffffff'], 140, 0.9);
          C.banner = { text: 'POWERED UP!', sub: 'READY TO FIGHT! WEB THE ' + BIOMES[C.level].npc, t: 2.6, max: 2.6, color: '#ffd23f' };
          for (const fl of C.W.flies) if (!fl.heart) burst(C.W, fl.x, fl.y, 4, ['#fff3a0'], 30, 0.3);
          C.W.flies = C.W.flies.filter(fl => fl.heart);
        }
      },
      onEnemyBite(e, sp) { if (sp.powered && e.alive) e.defeat(C.W, sp.slot); },
      onEnemyTrapped(e) {
        if (e.type === 'dll') { C.banner = e.phase === 'legs' ? { text: 'LEG WEBBED!', sub: 'BITE IT TO TEAR IT OFF!', t: 1.6, max: 1.6, color: '#ffffff' } : { text: 'BODY WEBBED!', sub: 'BITE IT!', t: 1.6, max: 1.6, color: '#ffffff' }; return; }
        C.banner = { text: e.type === 'hive' ? 'HIVE WEBBED!' : BIOMES[C.level].npc + ' STUCK!', sub: 'CRAWL OVER AND BITE IT!', t: 1.8, max: 1.8, color: '#ffffff' };
      },
      onBossSpawn(q) {
        C.boss = q;
        C.banner = { text: 'THE NEST BURST!', sub: 'WEB THE QUEEN ANT (CROWN), THEN BITE HER!', t: 2.8, max: 2.8, color: '#ff8c42' };
      },
      onBossPhase(e, what) {
        if (what === 'ball') C.banner = { text: 'ALL LEGS GONE!', sub: 'THE BODY IS ROLLING - WEB IT, THEN BITE IT!', t: 2.6, max: 2.6, color: '#ff8c42' };
        else C.banner = { text: 'LEG TORN OFF!', sub: e.legs.length + (e.legs.length === 1 ? ' LEG TO GO' : ' LEGS TO GO'), t: 1.6, max: 1.6, color: '#ffd23f' };
      },
      onEnemyDefeated(e) {
        if (e !== C.boss) return;
        C.W.starCoin = { x: e.x, y: e.y - 6, vy: -140, landed: false, t: 0 };
        C.banner = { text: BIOMES[C.level].npc + ' DEFEATED!', sub: 'GRAB THE STAR COIN!', t: 2.2, max: 2.2, color: '#7df06a' };
      },
      onBeeDown() {},
      onStarCoin(sp, sc) {
        SFX.play('star');
        burst(C.W, sc.x, sc.y, 40, ['#ffd23f', '#fff3a0', '#ff8cc6', '#9ad0ff', '#7df06a'], 160, 1.0);
        floater(C.W, sc.x, sc.y - 14, '+1 STAR COIN', '#ffd23f');
        C.complete();
      },
      onSpiderDead(sp, cause) {
        if (C.infinite) { C.respawnT = 1.2; C.banner = { text: 'RESPAWNING...', sub: 'INFINITE HEARTS', t: 1.2, max: 1.2, color: '#9ad0ff' }; return; }
        C.phase = 'dead'; C.timer = 1.8;
        C.banner = { text: cause === 'water' ? 'SPLASH!' : cause === 'bite' ? 'BITTEN!' : 'OH NO!', sub: '', t: 1.8, max: 1.8, color: '#ff5a7a' };
      },
    };
  },
  complete() {
    this.phase = 'won'; this.timer = 2.8;
    if (this.practice) {
      SFX.play('complete');
      this.banner = { text: 'PRACTICE CLEAR!', sub: 'NICE! TRY ANOTHER LEVEL OR DIFFICULTY', t: 2.8, max: 2.8, color: '#7df06a' };
      return;
    }
    save.stars++;
    save.cleared[this.diff][this.level] = 1;
    const was = save.unlocked[this.diff];
    save.unlocked[this.diff] = Math.max(was, Math.min(NUM_LEVELS, this.level + 2));
    this.newUnlock = save.unlocked[this.diff] > was ? save.unlocked[this.diff] - 1 : -1;
    persist();
    SFX.play('complete');
    this.banner = { text: 'LEVEL CLEAR!', sub: 'STAR COINS: ' + save.stars, t: 2.8, max: 2.8, color: '#ffd23f' };
    track('round_end', { mode: 'campaign', level: this.level + 1, secs: Math.round(this.time) });
  },
  update(dt, c) {
    const W = this.W;
    if (this.phase === 'play') this.time += dt;
    W.aim = c.aim;
    W.step(dt, s => s === this.me && this.phase === 'play' ? c : NO_CONTROLS);
    // keep a couple of flies buzzing around until the spider is powered up
    if (this.phase === 'play') W.maybeSpawnHeart(dt, this.time);
    if (this.me.flies < 5 && this.phase === 'play') {
      const active = W.flies.filter(f => !f.heart).length;
      if (active < Math.min(3, 5 - this.me.flies)) { this.flyT -= dt; if (this.flyT <= 0) { W.spawnFly(); this.flyT = 1.4; } }
    }
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
    if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeMag = 0; }
    if (this.phase === 'dead') { this.timer -= dt; if (this.timer <= 0) { setScene('gameover'); SFX.play('gameover'); } }
    if (this.respawnT > 0) {
      this.respawnT -= dt;
      if (this.respawnT <= 0) {
        const s = W.L.spawns[0], old = this.me;
        const nb = new SpiderBody('me', s.x, s.y, { style: save.style, name: 'YOU', facing: 1 });
        nb.flies = old.flies; nb.invuln = 2;
        W.spiders[W.spiders.indexOf(old)] = nb; this.me = nb;
        burst(W, s.x, s.y, 16, ['#9ad0ff', '#ffffff'], 80, 0.5);
      }
    }
    if (this.phase === 'won') {
      this.timer -= dt;
      if (this.timer <= 0 && this.practice) { setScene('practice'); return; }
      if (this.timer <= 0) {
        if (this.level === NUM_LEVELS - 1) { setScene('ending'); SFX.play('complete'); }
        else { Overworld.enter(this.level, this.newUnlock); setScene('overworld'); }
      }
    }
  },
  statusLine() {
    const me = this.me, boss = this.boss, npc = BIOMES[this.level].npc;
    if (!me.alive) return ['OH NO!', '#ff5a7a'];
    if (this.phase === 'won') return ['LEVEL CLEAR!', '#7df06a'];
    if (this.W.starCoin) return ['GRAB THE STAR COIN!', '#ffd23f'];
    if (me.stunT > 0) return ['WEBBED! MASH BUTTONS TO BREAK FREE!', Math.floor(T * 6) % 2 ? '#ffffff' : '#ff5a7a'];
    if (boss.type === 'nest') {
      if (me.flies >= 3) return ['CAREFUL - THE NEST BURSTS AT 5 FLIES!', Math.floor(T * 4) % 2 ? '#ff8c42' : '#ffffff'];
      return ['CATCH 5 GOLDEN FLIES - DODGE THE ANTS', '#ffffff'];
    }
    if (boss.type === 'dll') {
      const blink = Math.floor(T * 5) % 2 ? '#ffffff' : '#ffd23f';
      if (boss.phase === 'legs') {
        if (boss.legs.some(l => l.webT > 0)) return ['LEG WEBBED! BITE IT OFF!', blink];
        if (me.powered) return ['WEB A LEG, THEN BITE IT OFF  (' + boss.legs.length + ' LEFT)', Math.floor(T * 3) % 2 ? '#ffd23f' : '#ffffff'];
        return ['CATCH 5 GOLDEN FLIES - KEEP AWAY FROM ITS LEGS', '#ffffff'];
      }
      if (boss.frozenT > 0) return ['BODY STUCK! BITE IT!', blink];
      if (me.powered) return ['WEB THE ROLLING BODY!', Math.floor(T * 3) % 2 ? '#ffd23f' : '#ffffff'];
    }
    if (boss.frozenT > 0) return [npc + ' STUCK! BITE IT!', Math.floor(T * 5) % 2 ? '#ffffff' : '#ffd23f'];
    if (me.powered) return ['READY TO FIGHT! WEB THE ' + npc, Math.floor(T * 3) % 2 ? '#ffd23f' : '#ffffff'];
    return ['CATCH 5 GOLDEN FLIES', '#ffffff'];
  },
  draw() {
    this.W.draw();
    drawCampaignHUD(this);
  },
};

function drawCampaignHUD(C) {
  const me = C.me;
  panel(4, 4, 136, 40);
  for (let i = 0; i < me.maxHp; i++) drawHeart(10 + i * 18, 10, 2, i < me.hp);
  for (let i = 0; i < 5; i++) {
    const fx = 14 + i * 14, fy = 34;
    if (i < me.flies) { pxCircle(ctx, fx, fy, 4, '#ffd23f'); ctx.fillStyle = '#fff3a0'; ctx.fillRect(fx - 1, fy - 2, 1, 1); ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(fx - 3, fy - 5, 2, 2); ctx.fillRect(fx + 1, fy - 5, 2, 2); }
    else { pxCircle(ctx, fx, fy, 3, '#3b2b63'); }
  }
  if (me.powered) { const blink = Math.floor(T * 4) % 2 === 0; ctx.fillStyle = blink ? '#ffd23f' : '#f2b233'; ctx.fillRect(84, 28, 52, 12); drawText('POWER', 110, 31, 1, '#2a1a00', 'center'); }
  else drawText(me.flies + '/5', 86, 31, 1, '#ffd23f', 'left', '#140c26');
  // status + level info
  const [msg, col] = C.statusLine();
  const mw = textWidth(msg) + 12;
  let mx = BW / 2;
  if (mx - mw / 2 < 146) mx = 146 + mw / 2;
  panel(Math.round(mx - mw / 2), 6, mw, 13);
  drawText(msg, mx, 9, 1, col, 'center');
  const D = DIFFS[C.diff];
  drawText((C.practice ? 'PRACTICE ' : '') + 'L' + (C.level + 1) + ' ' + BIOMES[C.level].name + ' - ' + D.name + (C.infinite ? ' - INF HEARTS' : '') + '  ' + fmtTime(C.time), mx, 23, 1, D.color, 'center', '#140c26');
  // star tally
  drawStarShape(ctx, BW - 62, 16, 6, '#ffd23f', 0);
  drawText('x' + save.stars, BW - 54, 13, 1, '#ffd23f', 'left', '#140c26');
  if (C.boss && C.boss.type === 'dll' && C.boss.alive) drawBossBar(C.boss);
  drawPauseButton();
  drawBanner(C.banner);
}

/* Boss health: one pip per leg, then the body */
function drawBossBar(b) {
  const n = b.maxLegs, w = n * 9 + 26, x = Math.round(BW / 2 - w / 2), y = BH - 18;
  panel(x - 4, y - 4, w + 8, 16, 0.75);
  drawText('BOSS', x, y, 1, '#ff8c42', 'left');
  for (let i = 0; i < n; i++) {
    const on = i < b.legs.length, px = x + 28 + i * 9;
    ctx.fillStyle = on ? (b.legs[i].webT > 0 ? '#ffffff' : '#9aa4b4') : '#3b2b63'; ctx.fillRect(px, y, 2, 7); ctx.fillRect(px + 2, y + 5, 3, 2);
  }
  if (b.phase === 'ball') { pxCircle(ctx, x + w - 6, y + 3, 4, b.frozenT > 0 ? '#ffffff' : '#ff4a2a'); }
}

/* =====================================================================
   OVERWORLD - Super Mario World style map, fog of war over locked biomes
   ===================================================================== */
const Overworld = {
  nodes: [
    { x: 92,  y: 262, biome: 0 },
    { x: 226, y: 170, biome: 1 },
    { x: 400, y: 236, biome: 2 },
    { x: 548, y: 122, biome: 3 },
    { x: 560, y: 272, biome: 4 },
    { x: 300, y: 296, biome: 5 },
  ],
  cur: 0, tok: { x: 92, y: 262 }, walk: null, unlockAnim: null, map: null, mapKey: '', fog: null, puffs: [],
  enter(fromLevel, newUnlock) {
    this.diff = save.diff;
    if (fromLevel !== undefined && fromLevel >= 0) this.cur = fromLevel;
    this.cur = Math.min(this.cur, save.unlocked[this.diff] - 1);
    const n = this.nodes[this.cur];
    this.tok = { x: n.x, y: n.y }; this.walk = null;
    this.unlockAnim = newUnlock >= 0 && newUnlock !== undefined ? { node: newUnlock, t: 0 } : null;
    if (this.unlockAnim) SFX.play('unlock');
    if (!this.puffs.length) { const r = rng(99); for (let i = 0; i < 40; i++) this.puffs.push({ x: r() * REF_W, y: r() * REF_H, r: 18 + r() * 30, s: 3 + r() * 6, ph: r() * TAU }); }
  },
  unlockedCount() { return save.unlocked[this.diff]; },
  moveTo(i) {
    if (i < 0 || i >= this.nodes.length || i >= this.unlockedCount() || this.walk) return;
    if (i === this.cur) return;
    this.walk = { from: this.cur, to: i, t: 0 };
    SFX.play('step');
  },
  update(dt, nav) {
    if (this.unlockAnim) { this.unlockAnim.t += dt; if (this.unlockAnim.t > 2.2) { const nd = this.unlockAnim.node; this.unlockAnim = null; this.moveTo(nd); } }
    if (this.walk) {
      const a = this.nodes[this.walk.from], b = this.nodes[this.walk.to];
      const len = dist(a.x, a.y, b.x, b.y) * Math.abs(this.walk.to - this.walk.from);
      this.walk.t += dt * 140 / Math.max(1, len);
      const k = clamp(this.walk.t, 0, 1);
      const pathPt = this.pathPoint(this.walk.from, this.walk.to, k);
      this.tok.x = pathPt.x; this.tok.y = pathPt.y;
      if (Math.floor(this.walk.t * 12) !== Math.floor((this.walk.t - dt * 140 / Math.max(1, len)) * 12)) SFX.play('step');
      if (k >= 1) { this.cur = this.walk.to; this.walk = null; }
      return;
    }
    if (nav.right || nav.up) this.moveTo(this.cur + 1);
    if (nav.left || nav.down) this.moveTo(this.cur - 1);
    if (nav.tabL) this.setDiff(this.diff - 1);
    if (nav.tabR) this.setDiff(this.diff + 1);
  },
  setDiff(d) {
    d = clamp(d, 0, 3);
    if (d === this.diff) return;
    this.diff = save.diff = d; persist();
    this.cur = Math.min(this.cur, this.unlockedCount() - 1);
    const n = this.nodes[this.cur]; this.tok = { x: n.x, y: n.y };
    SFX.play('select');
  },
  pathPoint(from, to, k) {
    // walk along consecutive node segments with a gentle arc
    const dir = to > from ? 1 : -1, segs = Math.abs(to - from);
    const f = k * segs, i = Math.min(segs - 1, Math.floor(f)), lk = f - i;

let Trystero = null, trysteroPromise = null;

/* Trystero API shim - works with both the array-style ([send, onMessage])

let TR_ARRAY_API = false;      // older Trystero: makeAction returns [send, onMessage]; room.onPeerJoin(fn)

  const wrap = fn => (data, from) => {
    const peerId = typeof from === 'string' ? from : from && from.peerId;
    if (!peerId) return;
    if (data && typeof data === 'object') { if (seen.has(data)) return; seen.add(data); }
    fn(data, peerId);

    send: (d, to) => r.send(d, to ? { target: to } : undefined),
    on: fn => { const h = wrap(fn); if (typeof r.onMessage === 'function') { try { r.onMessage(h); } catch (e) {} } try { r.onMessage = h; } catch (e) {} },

}

  const recent = new Map();
  const h = id => { const t = recent.get(id); const now = nowMs(); if (t && now - t < 150) return; recent.set(id, now); fn(id); };
  // 0.25+: onPeerJoin/onPeerLeave are setter properties; older versions take a callback
  if (TR_ARRAY_API && typeof room[ev] === 'function') { try { room[ev](h); } catch (e) {} }

  if (iceCache && Date.now() - iceCacheT < 3600e3) return iceCache;
  let turn = [];

    turn = await Promise.race([Promise.resolve([METERED_TURN]), sleep(3000).then(() => { throw new Error('timeout'); })]);

/* ---------- Strict-network (symmetric NAT) detection, Safari-safe ---------- */
let strictNet = null, natDetectPromise = null;
function parseCand(s) {
  const p = String(s).replace(/^a=/, '').split(' ');
  if (p.length < 8) return null;
  const o = { proto: (p[2] || '').toLowerCase(), ip: p[4], port: +p[5], type: p[7] };
  const ri = p.indexOf('raddr'); if (ri > 0) o.raddr = p[ri + 1];
  const rp = p.indexOf('rport'); if (rp > 0) o.rport = p[rp + 1];
  return o;
}
function gatherCandidates(config, ms) {
  return new Promise(resolve => {
    const out = [];
    let pc;
    try { pc = new RTCPeerConnection(config); pc.createDataChannel('probe'); } catch (e) { resolve(out); return; }
    const done = () => { try { pc.close(); } catch (e) {} resolve(out); };
    pc.onicecandidate = e => { if (!e.candidate) { setTimeout(done, 50); return; } const c = parseCand(e.candidate.candidate); if (c) out.push(c); };
    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(done);
    setTimeout(done, ms);
  });
}
function classifyNat(cands) {
  const srflx = cands.filter(c => c.type === 'srflx');
  const hostUdp = new Set(cands.filter(c => c.type === 'host' && c.proto === 'udp').map(c => c.ip + ':' + c.port));
  if (!srflx.length) return null;
  const hidden = srflx.every(c => !c.raddr || c.raddr === '0.0.0.0' || c.raddr === '::');
  if (!hidden) {
    // Symmetric NAT = the same local socket maps to different public ports per STUN server
    const groups = {};
    for (const c of srflx) { const k = c.raddr + ':' + c.rport; (groups[k] = groups[k] || new Set()).add(c.ip + ':' + c.port); }
    return Object.values(groups).some(s => s.size > 1);
  }

  const pub = new Set(srflx.map(c => c.ip + ':' + c.port));
  if (hostUdp.size === 1) return pub.size > 1;

}

  if (natDetectPromise && !force) return natDetectPromise;
  natDetectPromise = (async () => {
    if (!window.RTCPeerConnection) return null;
    const c = await gatherCandidates({ iceServers: STUN_SERVERS }, 3500);
    return classifyNat(c);

}

/* =====================================================================

class NetAdapter {
  constructor() { this.h = {}; this.closed = false; }
  on(ev, fn) { (this.h[ev] = this.h[ev] || []).push(fn); return this; }
  emit(ev, ...a) { for (const f of this.h[ev] || []) { try { f(...a); } catch (e) { console.error('[net]', ev, e); } } }
  connect(code, role) {}
  publish(obj) {}
  close() { this.closed = true; }
  linked() { return false; }
  report() { return ''; }
}
/* Offline / bots: the local player is the host of a room with nobody else */
class NullAdapter extends NetAdapter {
  constructor() { super(); this.role = 'host'; this.code = 'BOTS'; this.selfId = 'local'; }
  connect(code, role) { this.code = code || 'BOTS'; this.emit('status'); }
  linked() { return true; }
  report() { return 'OFFLINE - BOT MATCH'; }
}
