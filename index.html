    const rtc = this.relay ? { iceServers: ice.turn, iceTransportPolicy: 'relay' } : { iceServers: ice.all };
    this.joinRoom('room-' + this.code.toLowerCase(), rtc);
    this.startedT = this.roomT = nowMs();
    if (!this.timer) this.timer = setInterval(() => this.tick(), 1000);
    this.emit('status');
  }
  joinRoom(roomId, rtc) {
    this.rtc = rtc; this.roomId = roomId;
    this.room = trJoin(rtc, roomId);
    const A = n => trAction(this.room, n);
    this.aHi = A('hi'); this.aOk = A('ok'); this.aFull = A('full'); this.aP = A('p');
    this.aHi.on((d, id) => this.onHi(d, id));
    this.aOk.on((d, id) => this.onOk(d, id));
    this.aFull.on((d, id) => this.onFull(d, id));
    this.aP.on((d, id) => this.onP(d, id));
    trRoomEvent(this.room, 'onPeerJoin', id => this.onPeerJoin(id));
    trRoomEvent(this.room, 'onPeerLeave', id => this.onPeerLeave(id));
  }
  joinerCount() { let n = 0; for (const p of this.peers.values()) if (p.slot > 0) n++; return n; }
  freeSlot() { const used = new Set([...this.peers.values()].map(p => p.slot)); for (let s = 1; s <= 3; s++) if (!used.has(s)) return s; return -1; }
  onPeerJoin(id) { try { this.aHi.send({ v: 1, role: this.role }, id); } catch (e) {} }
  onHi(d, id) {
    if (!d || d.v !== 1) return;
    if (this.role === 'host') {
      if (d.role === 'host') {           // two hosts raced onto one code
        if (String(this.selfId) > String(id)) this.rehost();
        return;
      }
      const p = this.peers.get(id);
      if (p && p.slot > 0) { this.aOk.send({ v: 1, slot: p.slot }, id); return; }   // idempotent
      const slot = this.freeSlot();
      if ((this.matchStarted && !this.lateJoin) || slot < 0 || this.acceptJoiner === false) { this.aFull.send({ v: 1 }, id); return; }
      this.peers.set(id, { slot, lastSeen: nowMs(), leaveT: 0 });
      this.aOk.send({ v: 1, slot }, id);
      this.emit('join', id, slot);
    } else if (d.role === 'host') {
      this.aHi.send({ v: 1, role: 'join' }, id);   // joiners re-send hi when they see a host
    }
  }
  onOk(d, id) {
    if (this.role !== 'join' || !d || d.v !== 1) return;
    if (this.isLinked && this.hostId === id) return;
    this.hostId = id; this.isLinked = true; this.slot = d.slot | 0;
    this.peers.set(id, { slot: 0, lastSeen: nowMs(), leaveT: 0 });
    track('match_found', { secs: Math.round((nowMs() - this.startedT) / 1000), relay: this.relay, strict: strictNet, attempts: this.attempt });
    this.emit('linked', this.slot, id);
    this.emit('status');
  }
  onFull(d, id) { if (this.role === 'join' && !this.isLinked) this.emit('full'); }
  onP(d, id) {
    if (!d || typeof d !== 'object') return;
    let rec = this.peers.get(id);
    if (this.role === 'host' && !rec) return;            // not an accepted joiner
    if (this.role === 'join') {
      if (!this.isLinked) return;
      if (!rec) { rec = { slot: d.s | 0, lastSeen: nowMs(), leaveT: 0 }; this.peers.set(id, rec); }
    }
    rec.lastSeen = nowMs(); rec.leaveT = 0;
    if (d.bye) { this.dropPeer(id, 'bye'); return; }
    this.emit('state', id, d);
    if (id === this.hostId && d.w) this.emit('snapshot', d.w, id);
    if (typeof d.sh === 'number') { if (rec.sh !== undefined && d.sh > rec.sh) this.emit('fire', id, d); rec.sh = d.sh; }
  }
  onPeerLeave(id) { const rec = this.peers.get(id); if (rec) rec.leaveT = nowMs(); }   // counts only after 3 s grace
  tick() {
    if (this.closed) return;
    const now = nowMs();
    for (const [id, rec] of [...this.peers]) {
      if (rec.leaveT && now - rec.leaveT > 3000 && now - rec.lastSeen > 3000) this.dropPeer(id, 'left');
      else if (now - rec.lastSeen > 6000) this.dropPeer(id, 'timeout');
    }
    if (this.role === 'join' && !this.isLinked && this.room && now - this.startedT > (this.relay ? 50000 : 35000)) {
      track('connect_retry', { attempt: this.attempt, relay: this.relay });
      this.retry();
    }
    if (this.role === 'host' && this.idleRefresh && this.joinerCount() === 0 && !this.matchStarted && this.room && now - this.roomT > 60000) {
      this.roomT = now; this.leaveRoom();                                           // recover from dropped relay sockets
      const id = this.roomId, rtc = this.rtc;
      (this.leaving || Promise.resolve()).then(() => { if (!this.closed && !this.room) this.joinRoom(id, rtc); });
    }
  }
  dropPeer(id, why) {
    if (!this.peers.has(id)) return;
    this.peers.delete(id);
    this.emit('leave', id, why);
    if (this.role === 'join' && id === this.hostId) { this.isLinked = false; this.emit('hostleft', why); }
    this.emit('status');
  }
  publish(obj) { if (this.aP && this.room) { try { this.aP.send(obj); } catch (e) {} } }
  sendBye() { this.publish({ bye: 1 }); }
  leaveRoom() {
    try { if (this.room) { const p = this.room.leave(); this.leaving = Promise.resolve(p).catch(() => {}).then(() => { this.leaving = null; }); } } catch (e) {}
    this.room = null; this.aP = null;
  }
  retry() { this.leaveRoom(); this.peers.clear(); this.connect(this.code, this.role); }
  rehost() { this.leaveRoom(); this.peers.clear(); const c = randomCode(); this.attempt = 0; this.emit('code', c); this.connect(c, 'host'); }
  close() {
    if (this.closed) return;
    this.sendBye();
    this.closed = true;
    const room = this.room;
    setTimeout(() => { try { if (room) room.leave(); } catch (e) {} }, 120);   // let the bye flush
    this.room = null; this.aP = null;
    clearInterval(this.timer); this.timer = null; this.peers.clear(); this.isLinked = false;
  }
  linked() { return this.role === 'host' ? true : this.isLinked; }
  report() {
    return (this.role === 'host' ? 'HOST' : 'JOIN') + ' ' + this.code + '  ' + (this.linked() ? (this.role === 'host' ? 'OPEN' : 'LINKED') : 'CONNECTING') +
      '  TRY ' + this.attempt + (this.relay ? '  RELAY' : '') + '  PEERS ' + this.peers.size + (strictNet === true ? '  STRICT NAT' : '');
  }
}

/* Quick Play: shared pool room + open lobbies.
   - Everyone searching sits in one pool room and broadcasts `seek` every
     few seconds ({ t: waitStart, lob: code|0, n: players, done }).
   - An open lobby seen in the pool is joined straight away (no handshake).
   - With no lobby around, the lowest peer id among the visible seekers
     opens one and keeps advertising it until it starts or fills up.
   - Duplicate empty lobbies merge into the one with the lower host id.
   - Self-healing: re-enter the pool after 20 s alone / 15 s with no lobby
     forming, keeping the original wait-start time. */
class QuickMatchAdapter extends TrysteroAdapter {
  constructor() {
    super();
    this.pool = null; this.poolTimer = null; this.seekers = new Map(); this.waitStart = Date.now();
    this.mode = 'idle';                  // idle | seek | joining | lobby | linked
    this.lobbyCode = null; this.lobbyOpen = false; this.badLobbies = new Map();
    this.poolEnterT = 0; this.lastSeekT = 0; this.poolAttempts = 0; this.joinT = 0;
    this.idleRefresh = false;
    this.lateJoin = true;               // players may join mid-match (they spectate until the next round)
  }
  async search() {
    if (this.closed) return;
    this.mode = 'seek';
    const lib = await loadTrystero();
    if (!lib) { this.emit('error', 'lib'); return; }
    this.selfId = lib.selfId;
    if (this.pool) { this.broadcastSeek(); this.emit('status'); return; }
    try { await this.enterPool(); }
    catch (e) { console.warn('[net] pool entry failed', e); setTimeout(() => { if (!this.closed && this.mode === 'seek') this.search(); }, 3000); }
  }
  async enterPool() {
    await Promise.race([detectStrictNat(), sleep(600)]);
    if (this.poolLeaving) await this.poolLeaving;
    if (this.closed || this.pool) return;
    const ice = await iceServers();
    const rtc = strictNet === true ? { iceServers: ice.turn, iceTransportPolicy: 'relay' } : { iceServers: ice.all };  // the pool never forces relay otherwise
    this.poolAttempts++;
    this.pool = trJoin(rtc, NET.POOL_ROOM);
    this.qSeek = trAction(this.pool, 'seek');
    this.qSeek.on((d, id) => this.onSeek(d, id));
    trRoomEvent(this.pool, 'onPeerJoin', id => { try { this.qSeek.send(this.seekMsg(), id); } catch (e) {} });
    trRoomEvent(this.pool, 'onPeerLeave', id => this.seekers.delete(id));
    this.poolEnterT = nowMs(); this.lastSeekT = 0;
    if (!this.poolTimer) this.poolTimer = setInterval(() => this.poolTick(), 500);
    this.broadcastSeek();
    this.emit('status');
  }
  players() { return 1 + this.joinerCount(); }
  seekMsg() {
    const lobby = this.mode === 'lobby' && this.lobbyOpen && this.players() < 4;
    return { v: 1, t: this.waitStart, lob: lobby ? this.lobbyCode : 0, n: lobby ? this.players() : 0, done: this.mode === 'joining' || this.mode === 'linked' || (this.mode === 'lobby' && !lobby) ? 1 : 0 };
  }
  broadcastSeek() { if (this.pool && this.qSeek) { try { this.qSeek.send(this.seekMsg()); } catch (e) {} } this.lastSeekT = nowMs(); }
  leavePool() {
    if (this.pool) {
      try { this.qSeek.send({ v: 1, t: this.waitStart, done: 1 }); } catch (e) {}
      const p = this.pool;
      this.poolLeaving = sleep(150).then(() => p.leave()).catch(() => {}).then(() => { this.poolLeaving = null; });
    }
    this.pool = null; this.seekers.clear();
  }
  onSeek(d, id) {
    if (!d || d.v !== 1) return;
    if (d.done) { this.seekers.delete(id); return; }
    const s = this.seekers.get(id) || { id, firstSeen: nowMs() };
    s.t = d.t; s.lob = d.lob || 0; s.n = d.n || 0; s.lastSeen = nowMs();
    this.seekers.set(id, s);
  }
  openLobbies(now) {
    return [...this.seekers.values()].filter(s => s.lob && s.n < 4 && now - s.lastSeen < 9000 && !(this.badLobbies.get(s.lob) > now));
  }
  poolTick() {
    if (this.closed || !this.pool) return;
    const now = nowMs();
    for (const [id, s] of this.seekers) if (now - s.lastSeen > 15000) this.seekers.delete(id);
    if (now - this.lastSeekT > (this.mode === 'lobby' ? 2000 : 3000)) this.broadcastSeek();
    if (this.mode === 'seek') {
      const lobbies = this.openLobbies(now).sort((a, b) => b.n - a.n || a.t - b.t);
      if (lobbies.length) { this.joinLobby(lobbies[0].lob); return; }
      const others = [...this.seekers.values()].filter(s => !s.lob && now - s.lastSeen < 9000);
      if (others.length && now - this.poolEnterT > 1200 && others.every(s => String(this.selfId) < String(s.id))) { this.openLobby(); return; }
      // self-healing pool
      if ((!others.length && now - this.poolEnterT > 20000) || (others.length && now - this.poolEnterT > 15000)) {
        this.leavePool(); this.enterPool().catch(() => setTimeout(() => this.search(), 3000));
      }
    } else if (this.mode === 'lobby') {
      // two lobbies opened at once: an empty one folds into the lower host id's lobby
      if (this.joinerCount() === 0) {
        const other = this.openLobbies(now).filter(s => s.lob !== this.lobbyCode && String(s.id) < String(this.selfId)).sort((a, b) => b.n - a.n)[0];
        if (other) { this.leaveRoom(); this.peers.clear(); this.joinLobby(other.lob); }
      }
    } else if (this.mode === 'joining') {
      if (this.isLinked) { this.mode = 'linked'; this.leavePool(); return; }
      if (now - this.joinT > 12000) { this.giveUp(this.code); }
    }
  }
  openLobby() {
    this.attempt = 0;
    this.mode = 'lobby'; this.lobbyCode = randomCode(); this.lobbyOpen = true; this.matchStarted = false;
    this.emit('matched', this.lobbyCode, 'host');
    this.connect(this.lobbyCode, 'host').then(() => this.broadcastSeek());
    this.broadcastSeek();
  }
  joinLobby(code) {
    this.attempt = 0;
    this.mode = 'joining'; this.joinT = nowMs(); this.lobbyOpen = false;
    this.broadcastSeek();
    this.emit('matched', code, 'join');
    this.connect(code, 'join');
  }
  giveUp(code) {
    // couldn't get into that lobby: avoid it for a while and keep searching
    this.badLobbies.set(code, nowMs() + 30000);
    this.leaveRoom(); this.peers.clear(); this.isLinked = false;
    this.mode = 'seek'; this.poolEnterT = nowMs();
    this.emit('requeue');
    if (!this.pool) this.search(); else this.broadcastSeek();
  }
  onFull() { if (this.role === 'join' && !this.isLinked && this.mode === 'joining') this.giveUp(this.code); }
  onOk(d, id) { super.onOk(d, id); if (this.isLinked && this.mode === 'joining') { this.mode = 'linked'; this.leavePool(); } }
  closeLobby() { if (this.mode === 'lobby') { this.lobbyOpen = false; this.broadcastSeek(); this.leavePool(); } }
  close() { this.leavePool(); clearInterval(this.poolTimer); this.poolTimer = null; super.close(); }
  report() {
    if (this.mode === 'seek') return 'SEARCHING  SEEN ' + this.seekers.size + '  POOL TRY ' + this.poolAttempts + (strictNet === true ? '  STRICT NAT' : '');
    if (this.mode === 'lobby') return 'LOBBY ' + this.lobbyCode + '  PLAYERS ' + this.players() + '/4  ' + (this.lobbyOpen ? 'OPEN' : 'CLOSED') + '  SEEN ' + this.seekers.size;
    return super.report();
  }
}

/* =====================================================================
   NETWORK TEST (diagnostics screen, ~15 s)
   ===================================================================== */
const NetTest = {
  steps: [], running: false, verdict: '', verdictColor: '#ffffff', copied: 0, started: 0,
  NAMES: ['Browser has WebRTC + secure context', 'Matchmaking library loaded', 'Page server reachable', 'Nostr relays reachable', 'STUN gives a public address', 'TURN allocation works', 'Relay link (message via TURN)', 'NAT type'],
  async run() {
    if (this.running) return;
    this.running = true; this.verdict = ''; this.started = nowMs();
    this.steps = this.NAMES.map(n => ({ name: n, status: 'wait', detail: '' }));
    const S = this.steps;
    const set = (i, status, detail) => { S[i].status = status; S[i].detail = detail || ''; };
    track('net_test', {});
    // 1
    set(0, 'run');
    const hasRTC = !!window.RTCPeerConnection, secure = !!window.isSecureContext;
    set(0, hasRTC && secure ? 'ok' : 'fail', !hasRTC ? 'NO WEBRTC IN THIS BROWSER' : !secure ? 'NOT A SECURE (HTTPS) PAGE' : 'OK');
    // 2
    set(1, 'run');
    const lib = await Promise.race([loadTrystero(), sleep(8000).then(() => null)]);
    set(1, lib ? 'ok' : 'fail', lib ? 'TRYSTERO 0.25.4 (NOSTR)' : 'COULD NOT LOAD FROM CDN');
    // 3
    set(2, 'run');
    try { const r = await Promise.race([fetch(location.href.split('#')[0], { cache: 'no-store' }), sleep(5000).then(() => null)]); set(2, r && r.ok ? 'ok' : 'warn', r ? 'HTTP ' + r.status : 'TIMEOUT'); }
    catch (e) { set(2, 'warn', 'UNREACHABLE'); }
    // 4 + 5 in parallel
    set(3, 'run'); set(4, 'run');
    const relayP = Promise.all(NET.RELAY_PROBES.map(u => new Promise(res => {
      let ws; const t = setTimeout(() => { try { ws.close(); } catch (e) {} res(false); }, 4500);
      try { ws = new WebSocket(u); ws.onopen = () => { clearTimeout(t); try { ws.close(); } catch (e) {} res(true); }; ws.onerror = () => { clearTimeout(t); res(false); }; } catch (e) { clearTimeout(t); res(false); }
    })));
    const stunP = hasRTC ? gatherCandidates({ iceServers: STUN_SERVERS }, 4000) : Promise.resolve([]);
    const [relays, stunC] = await Promise.all([relayP, stunP]);
    const nOpen = relays.filter(Boolean).length;
    set(3, nOpen >= 2 ? 'ok' : nOpen === 1 ? 'warn' : 'fail', nOpen + '/' + relays.length + ' RELAYS OPEN');
    const srflx = stunC.filter(c => c.type === 'srflx');
    set(4, srflx.length ? 'ok' : 'warn', srflx.length ? 'PUBLIC ADDRESS FOUND' : 'NO PUBLIC ADDRESS (UDP BLOCKED?)');
    // 6
    set(5, 'run');
    const ice = await iceServers();
    const turnC = hasRTC ? await gatherCandidates({ iceServers: ice.turn, iceTransportPolicy: 'relay' }, 6000) : [];
    const relayC = turnC.filter(c => c.type === 'relay');
    set(5, relayC.length ? 'ok' : 'fail', relayC.length ? 'RELAY ALLOCATED' : 'NO RELAY CANDIDATE');
    // 7
    set(6, 'run');
    let link = false;
    if (relayC.length) link = await this.relayLink(ice, 7000);
    set(6, link ? 'ok' : 'fail', link ? 'MESSAGE DELIVERED' : relayC.length ? 'NO MESSAGE THROUGH RELAY' : 'SKIPPED');
    // 8
    set(7, 'run');
    const nat = classifyNat(stunC);
    strictNet = nat;
    set(7, nat === false ? 'ok' : nat === true ? 'warn' : 'warn', nat === false ? 'OPEN / CONE' : nat === true ? 'STRICT (SYMMETRIC) - WILL USE RELAY' : 'UNKNOWN');
    // verdict
    const ok = i => S[i].status === 'ok';
    if (!ok(0) || !ok(1) || nOpen === 0) { this.verdict = 'MAY NOT CONNECT'; this.verdictColor = '#ff5a7a'; }
    else if (ok(4) && nat !== true) { this.verdict = 'GOOD TO CONNECT'; this.verdictColor = '#7df06a'; }
    else if (ok(5) && ok(6)) { this.verdict = 'SHOULD CONNECT (VIA RELAY)'; this.verdictColor = '#ffd23f'; }
    else { this.verdict = 'MAY NOT CONNECT - TRY ANOTHER NETWORK'; this.verdictColor = '#ff5a7a'; }
    this.running = false;
  },
  async relayLink(ice, ms) {
    let a, b;
    try {
      const cfg = { iceServers: ice.turn, iceTransportPolicy: 'relay' };
      a = new RTCPeerConnection(cfg); b = new RTCPeerConnection(cfg);
      a.onicecandidate = e => { if (e.candidate) b.addIceCandidate(e.candidate).catch(() => {}); };
      b.onicecandidate = e => { if (e.candidate) a.addIceCandidate(e.candidate).catch(() => {}); };
      const ch = a.createDataChannel('t');
      const got = new Promise(res => { b.ondatachannel = e => { e.channel.onmessage = m => res(m.data === 'ping'); }; });
      ch.onopen = () => { try { ch.send('ping'); } catch (e) {} };
      const offer = await a.createOffer(); await a.setLocalDescription(offer); await b.setRemoteDescription(offer);
      const ans = await b.createAnswer(); await b.setLocalDescription(ans); await a.setRemoteDescription(ans);
      return await Promise.race([got, sleep(ms).then(() => false)]);
    } catch (e) { return false; }
    finally { try { a && a.close(); } catch (e) {} try { b && b.close(); } catch (e) {} }
  },
  report() {
    const lines = ['GEAR BUGS network test', 'Build: ' + BUILD, 'When: ' + new Date().toISOString(), 'Browser: ' + navigator.userAgent, ''];
    this.steps.forEach((s, i) => lines.push((i + 1) + '. ' + s.name + ': ' + s.status.toUpperCase() + (s.detail ? ' - ' + s.detail : '')));
    lines.push('', 'Verdict: ' + (this.verdict || '(running)'));
    return lines.join('\n');
  },
};

/* ===== 85_vs.js ===== */
/* =====================================================================
   85_VS - multiplayer VS mode (up to 4 players)
   ---------------------------------------------------------------------
   Authority model (per spec):
   - Host: world (flies, NPC hazards, bots), match phase machine
     wait -> intro -> play -> result -> final, round clock, scores, roster.
   - Each player: their own spider (position, velocity, state, hp...).
   - Shooter-authoritative hits: per-target counters dmg{id:[slow,freeze]}
     and bites bt{id:n}, tagged with round dr. Victims apply until their
     applied counts match. Shots replay from sh counters.
   - Positions are normalized 0..1e4 over REF_W x REF_H.
   ===================================================================== */
const VS_PTS = { fly: 10, bee: 15, lizard: 40, gecko: 40, widow: 60, dll: 80, leg: 10, elim: 50 };
const VS_ROUNDS = 5;                  // Field > Meadow > Island > Barn > Factory
const VS_ROUND_TIME = 100, VS_INTRO = 3.5, VS_RESULT = 5;
const SLOT_COLORS = [0, 1, 2, 4];
const TEAM_NAMES = ['RED TEAM', 'BLUE TEAM'], TEAM_COLORS = ['#ff4d5e', '#4da3ff'];
const nX = x => Math.round(clamp(x, -200, REF_W + 200) / REF_W * 1e4), nY = y => Math.round(clamp(y, -200, REF_H + 200) / REF_H * 1e4);
const dX = v => v / 1e4 * REF_W, dY = v => v / 1e4 * REF_H;
const ENEMY_CODES = { lizard: 1, gecko: 2, widow: 3, hive: 4, bee: 5, dll: 6 };
const VS_DIFF = Object.assign({}, DIFFS[1], { beeMax: 2, freeze: 6 });

const VS = {
  net: null, searchNet: null, kind: 'quick',        // quick | private | bots
  sub: 'idle',                                     // searching | connecting | wait | match | closed
  isHost: false, myId: 'local', mySlot: 0,
  roster: [], mode: 'ffa', phase: 'wait', rn: 0, phaseT: 0, seeds: [], countdown: -1,
  scores: [], W: null, me: null, bots: new Map(), warm: null,
  applied: {}, appliedNpc: { h: 0, k: 0, s: 0, g: 0, f: 0 }, npcHits: {}, claims: [], processed: {}, credited: {},
  pres: new Map(), pubT: 0, msg: '', msgT: 0, searchT: 0, botWhileWaiting: false, finalT: 0, rematchClosed: false,
  roundRes: null, respawns: [], lastPhase: '', biteCD: {}, hostId: null, banner: null, flyT: 0,

  /* ---------------- entry points ---------------- */
  reset() {
    if (this.net) { try { this.net.close(); } catch (e) {} }
    if (this.searchNet && this.searchNet !== this.net) { try { this.searchNet.close(); } catch (e) {} }
    this.net = null; this.searchNet = null; this.sub = 'idle'; this.isHost = false; this.myId = 'local'; this.mySlot = 0;
    this.roster = []; this.mode = 'ffa'; this.phase = 'wait'; this.rn = 0; this.phaseT = 0; this.seeds = []; this.countdown = -1;
    this.scores = [0, 1, 2, 3].map(() => this.blankScore());
    this.W = null; this.me = null; this.bots = new Map(); this.applied = {}; this.npcHits = {}; this.claims = []; this.processed = {}; this.credited = {};
    this.pres = new Map(); this.msg = ''; this.msgT = 0; this.searchT = 0; this.botWhileWaiting = false; this.finalT = 0; this.rematchClosed = false;
    this.roundRes = null; this.respawns = []; this.biteCD = {}; this.hostId = null; this.banner = null; this.autoT = -1; this.waitStart = nowMs(); this.ready = false;
    this.appliedNpc = { h: 0, k: 0, s: 0, g: 0, f: 0 };
  },
  blankScore() { return { pts: 0, fl: 0, kills: 0, npc: 0, wins: 0, rp: 0 }; },
  startQuick() {
    this.reset(); this.kind = 'quick'; this.sub = 'searching'; this.mode = 'ffa';
    const q = this.searchNet = new QuickMatchAdapter();
    this.wireNet(q);
    q.on('matched', (code, role) => this.onMatched(q, code, role));
    q.on('requeue', () => {
      // couldn't get into that lobby (full / unreachable): keep searching
      this.sub = 'searching'; this.isHost = false; this.roster = []; this.ready = false; this.autoT = -1; this.W = null; this.me = null; this.phase = 'wait';
      this.flash('LOBBY UNAVAILABLE - STILL SEARCHING');
    });
    q.search();
    track('game_start', { mode: 'quick' });
  },
  hostPrivate() {
    this.reset(); this.kind = 'private'; this.sub = 'wait';
    const n = this.net = new TrysteroAdapter();
    this.wireNet(n);
    this.isHost = true; this.mySlot = 0;
    this.code = randomCode();
    n.connect(this.code, 'host');
    this.initHostLobby();
    track('game_start', { mode: 'private_host' });
  },
  joinPrivate(code) {
    this.reset(); this.kind = 'private'; this.sub = 'connecting';
    const n = this.net = new TrysteroAdapter();
    this.wireNet(n);
    this.isHost = false; this.code = code;
    n.connect(code, 'join');
    track('game_start', { mode: 'private_join' });
  },
  botMatch() {
    this.reset(); this.kind = 'bots'; this.sub = 'wait';
    const n = this.net = new NullAdapter();
    this.wireNet(n); n.connect('BOTS', 'host');
    this.isHost = true; this.mySlot = 0; this.myId = 'local';
    this.initHostLobby();
    for (let s = 1; s <= 3; s++) this.addBot(s);
    track('game_start', { mode: 'bots' });
  },
  onMatched(q, code, role) {
    // a lobby was found / opened: use the pool link for it
    this.W = null; this.me = null; this.bots = new Map(); this.phase = 'wait';
    this.scores = [0, 1, 2, 3].map(() => this.blankScore());
    this.net = q; this.code = code;
    this.isHost = role === 'host';
    this.ready = false; this.autoT = -1;
    this.mode = 'ffa';
    if (this.isHost) { this.sub = 'wait'; this.mySlot = 0; this.initHostLobby(); this.flash('PLAYERS FOUND - LOBBY OPEN'); }
    else { this.sub = 'connecting'; this.roster = []; this.flash('LOBBY FOUND - JOINING'); }
    SFX.play('join');
  },
  wireNet(n) {
    n.on('status', () => {
      // the host learns its Trystero peer id once the library has loaded
      if (n === this.net && this.isHost && n.selfId && this.myId !== n.selfId) {
        const old = this.myId; this.myId = n.selfId;
        for (const r of this.roster) if (r.id === old) r.id = n.selfId;
        if (this.me) this.me.id = n.selfId;
        if (this.W && this.W.localId === old) this.W.localId = n.selfId;
      }
    });
    n.on('join', (id, slot) => this.onJoin(n, id, slot));
    n.on('linked', (slot, hostId) => { if (n !== this.net) return; this.mySlot = slot; this.hostId = hostId; this.myId = n.selfId; this.sub = 'wait'; SFX.play('join'); if (this.kind === 'quick') this.flash('JOINED THE LOBBY!'); });
    n.on('state', (id, d) => { if (n === this.net) this.onPresence(id, d); });
    n.on('fire', (id, d) => { if (n === this.net) this.onFire(id, d); });
    n.on('snapshot', (w, id) => { if (n === this.net && !this.isHost) this.onSnapshot(w); });
    n.on('leave', (id, why) => { if (n === this.net) this.onLeave(id, why); });
    n.on('hostleft', () => { if (n !== this.net) return; this.flash('HOST LEFT THE MATCH'); this.endToMenu(2.5); });
    n.on('full', () => { if (n !== this.net) return; if (this.kind === 'quick') return; else { this.flash('ROOM FULL OR MATCH IN PROGRESS'); this.endToMenu(2.5); } });
    n.on('code', c => { this.code = c; this.flash('NEW ROOM CODE ' + c); });
    n.on('error', e => { if (n !== this.net && n !== this.searchNet) return; this.flash(e === 'lib' ? "COULDN'T LOAD MULTIPLAYER" : 'NETWORK ERROR'); if (e === 'lib') this.endToMenu(3); });
  },
  flash(m) { this.msg = m; this.msgT = 3; },
  endToMenu(delay) {
    this.sub = 'closed';
    setTimeout(() => { if (VS.sub === 'closed') { VS.reset(); setScene('menu'); } }, delay * 1000);
  },
  leave() {
    if (this.net && this.net.role === 'join' && !this.net.isLinked && this.net.attempt) track('connect_abandon', { attempts: this.net.attempt });
    this.reset(); setScene('menu');
  },

  /* ---------------- roster (host) ---------------- */
  initHostLobby() {
    this.myId = this.net.selfId || 'local';
    this.roster = [{ slot: 0, id: this.myId, name: 'P1', style: Object.assign({}, save.style), bot: false }];
    this.autoT = -1;
  },
  humans() { return this.roster.filter(r => !r.bot); },
  active() { return this.roster.filter(r => !r.spec); },           // players in the current round (not spectating)
  backToLobby(msg) {
    this.phase = 'wait'; this.sub = 'wait'; this.W = null; this.me = null; this.bots = new Map();
    this.ready = false; this.autoT = -1; this.roundRes = null;
    for (const r of this.roster) { r.spec = false; r.ready = false; }
    this.scores = [0, 1, 2, 3].map(() => this.blankScore());
    if (this.net) this.net.matchStarted = false;
    if (msg) this.flash(msg);
  },
  addBot(slot) {
    if (slot === undefined) { const used = new Set(this.roster.map(r => r.slot)); for (let s = 1; s <= 3; s++) if (!used.has(s)) { slot = s; break; } }
    if (slot === undefined || this.roster.some(r => r.slot === slot)) return;
    this.roster.push({ slot, id: 'bot' + slot, name: 'BOT' + (slot + 1), style: { c: SLOT_COLORS[slot], h: [0, 5, 2, 6][slot], p: [0, 1, 2, 3][slot] }, bot: true });
    this.roster.sort((a, b) => a.slot - b.slot);
  },
  removeBot() { for (let i = this.roster.length - 1; i >= 0; i--) if (this.roster[i].bot) { this.roster.splice(i, 1); return; } },
  onJoin(n, id, slot) {
    if (n !== this.net || !this.isHost) return;
    this.roster = this.roster.filter(r => r.slot !== slot && r.id !== id);
    const midMatch = this.phase !== 'wait' && this.phase !== 'final';
    this.roster.push({ slot, id, name: 'P' + (slot + 1), style: { c: SLOT_COLORS[slot], h: 0, p: 0 }, bot: false, spec: midMatch });
    this.roster.sort((a, b) => a.slot - b.slot);
    if (this.phase !== 'wait') this.scores[slot] = this.blankScore();
    SFX.play('join'); this.flash('P' + (slot + 1) + (midMatch ? ' JOINED - PLAYS NEXT ROUND' : ' JOINED'));
    if (this.kind === 'quick' && this.phase === 'wait' && this.autoT >= 0) this.autoT = Math.max(this.autoT, 15);   // give the newcomer time
    if (this.kind !== 'quick' && this.humans().length >= 4 && this.phase === 'wait') this.autoT = Math.min(this.autoT < 0 ? 3 : this.autoT, 3);
  },
  onLeave(id, why) {
    const W = this.W;
    if (W) W.remotes.delete(id);
    this.pres.delete(id);
    if (!this.isHost) return;
    const r = this.roster.find(x => x.id === id);
    if (!r) return;
    SFX.play('leave'); this.flash(r.name + ' LEFT');
    if (this.kind === 'quick') {
      this.roster = this.roster.filter(x => x !== r);
      if (W) W.remotes.delete(id);
      if (this.phase !== 'wait' && this.phase !== 'final' && this.active().length < 2) this.backToLobby('NOT ENOUGH PLAYERS - BACK TO THE LOBBY');
      return;
    }
    if (this.phase === 'wait' || this.phase === 'final') {
      this.roster = this.roster.filter(x => x !== r);
      if (this.net && this.net.peers && this.kind !== 'bots') this.net.matchStarted = false;   // reopen a clean slot
    } else {
      // hand the slot to a bot so the match continues
      r.bot = true; r.id = 'bot' + r.slot; r.name = 'BOT' + (r.slot + 1);
      if (W) {
        const last = this.lastPos && this.lastPos[id];
        const sp = W.L.spawns[r.slot];
        const b = new SpiderBody(r.id, last ? last.x : sp.x, last ? last.y : sp.y, { slot: r.slot, style: r.style, name: r.name, bot: true, team: this.teamOf(r.slot) });
        if (last && !last.al) { b.alive = false; b.hp = 0; }
        b.flies = this.scores[r.slot].fl;
        W.spiders.push(b); this.bots.set(r.slot, { body: b, brain: new BotBrain(b) });
      }
    }
  },
  effectiveStyles() {
    // resolve color clashes by slot: lower slot keeps its pick
    const used = new Set();
    for (const r of this.roster.slice().sort((a, b) => a.slot - b.slot)) {
      let c = r.style.c % SPIDER_COLORS.length;
      if (used.has(c)) { c = SLOT_COLORS[r.slot]; if (used.has(c)) { for (let k = 0; k < SPIDER_COLORS.length; k++) if (!used.has(k)) { c = k; break; } } }
      used.add(c);
      r.eff = { c, h: r.style.h, p: r.style.p };
    }
  },
  teamOf(slot) { return this.mode === '2v2' ? slot % 2 : slot; },
  canStart() {
    const n = this.roster.length, h = this.humans().length;
    if (this.mode === '1v1') return h <= 2 && n >= 1;
    if (this.mode === '2v2') return h <= 4;
    return n >= 2;
  },
  cycleMode(dir = 1) {
    const modes = ['ffa', '1v1', '2v2'];
    let i = modes.indexOf(this.mode);
    for (let k = 0; k < 3; k++) { i = (i + dir + 3) % 3; const m = modes[i]; if (m === '1v1' && this.humans().length > 2) continue; this.mode = m; break; }
    SFX.play('select');
  },

  /* ---------------- match flow (host) ---------------- */
  startMatch() {
    if (!this.isHost) return;
    // fill / trim participants for the chosen mode
    if (this.mode === '1v1') { while (this.roster.length > 2) { const i = this.roster.findIndex(r => r.bot); if (i < 0) break; this.roster.splice(i, 1); } if (this.roster.length < 2) this.addBot(); }
    else if (this.kind === 'quick') { this.mode = 'ffa'; this.roster = this.roster.filter(r => !r.bot); }
    else if (this.mode === '2v2') { while (this.roster.length < 4) this.addBot(); }
    else if (this.roster.length < 2) this.addBot();
    if (this.net) this.net.matchStarted = true;
    this.effectiveStyles();
    this.scores = [0, 1, 2, 3].map(() => this.blankScore());
    this.seeds = Array.from({ length: VS_ROUNDS }, () => (Math.random() * 0xFFFFFFFF) >>> 0);
    this.rematchClosed = false;
    this.beginRound(0);
    this.sub = 'match';
    track('game_start', { mode: 'vs_' + this.mode, players: this.humans().length });
  },
  beginRound(rn) {
    for (const r of this.roster) r.spec = false;
    this.rn = rn; this.phase = 'intro'; this.phaseT = VS_INTRO;
    for (const s of this.scores) { s.fl = 0; s.rp = 0; }
    this.npcHits = {}; this.processed = {}; this.credited = {}; this.respawns = []; this.biteCD = {};
    this.buildRoundWorld();
  },
  buildRoundWorld() {
    const rn = this.rn;
    const W = this.W = new World({ mode: 'vs', biome: rn, seed: this.seeds[rn] || 1, D: VS_DIFF, authority: this.isHost, rules: this.rules() });
    this.effectiveStyles();
    const meR = this.roster.find(r => r.slot === this.mySlot) || { slot: this.mySlot, name: 'P' + (this.mySlot + 1), eff: save.style };
    const sp = W.L.spawns[this.mySlot] || W.L.spawns[0];
    this.me = new SpiderBody(this.myId, sp.x, sp.y, { slot: this.mySlot, style: meR.eff || save.style, name: meR.name, team: this.teamOf(this.mySlot), facing: sp.x < 320 ? 1 : -1 });
    W.spiders.push(this.me); W.localId = this.myId;
    if (meR.spec) { const m = this.me; m.spectator = true; m.alive = false; m.hp = 0; m.x = -999; m.y = 9999; m.vx = m.vy = 0; }
    this.applied = {}; this.appliedNpc = { h: 0, k: 0, s: 0, g: 0, f: 0 }; this.claims = [];
    this.bots = new Map();
    if (this.isHost) {
      for (const r of this.roster) if (r.bot) {
        const s = W.L.spawns[r.slot];
        const b = new SpiderBody(r.id, s.x, s.y, { slot: r.slot, style: r.eff, name: r.name, bot: true, team: this.teamOf(r.slot), facing: s.x < 320 ? 1 : -1 });
        W.spiders.push(b); this.bots.set(r.slot, { body: b, brain: new BotBrain(b) });
      }
      this.spawnHazard(rn);
      for (let i = 0; i < 3; i++) W.spawnFly();
      this.flyT = 1;
    }
    this.banner = meR.spec ? { text: 'SPECTATING', sub: 'YOU JOIN AT THE START OF THE NEXT ROUND', t: 3, max: 3, color: '#9ad0ff' }
                           : { text: 'ROUND ' + (rn + 1) + '/' + VS_ROUNDS, sub: BIOMES[rn].name + ' - FIRST TO 5 FLIES GETS THE POWER', t: VS_INTRO, max: VS_INTRO, color: '#ffd23f' };
    SFX.play('round');
  },
  spawnHazard(rn) {
    const W = this.W, L = W.L;
    if (rn === 0) W.enemies.push(new Lizard(320, L.spawns[0].y));
    else if (rn === 1) W.enemies.push(new Hive(L.hive.x, L.hive.y, { invulnerable: true }));
    else if (rn === 2) W.enemies.push(new Gecko(320, L.spawns[0].y));
    else if (rn === 3) W.enemies.push(new Widow(L.enemySpawn.x, L.enemySpawn.y, { speedMul: 0.75, plat: L.enemySpawn.plat }));
    else W.enemies.push(new LongLegs(L.enemySpawn.x, L.enemySpawn.y, VS_DIFF, { legs: 4 }));
  },
  /* seconds since this round's intro began - drives the factory lifts identically for everyone */
  roundClock() { return this.phase === 'intro' ? VS_INTRO - this.phaseT : this.phase === 'play' ? VS_INTRO + VS_ROUND_TIME - this.phaseT : undefined; },
  rules() {
    const V = this;
    return {
      onFlyCollected(sp, f) {
        if (V.phase !== 'play') return;
        if (V.isHost) V.awardFly(sp.slot, f);
        else if (sp === V.me) { V.claims.push(f.id); if (V.claims.length > 12) V.claims.shift(); V.W.claimed.set(f.id, V.W.time); floater(V.W, f.x, f.y - 10, '+1', '#ffd23f'); }
      },
      onHeart(sp, f) {
        if (V.phase !== 'play') return;
        if (sp.local) healSpider(V.W, sp, f.x, f.y);
        if (!V.isHost && sp === V.me) { V.claims.push(f.id); if (V.claims.length > 12) V.claims.shift(); V.W.claimed.set(f.id, V.W.time); }
      },
      onPvPHit(shooter, target) {
        const k = shooter.dmg[target.id] || (shooter.dmg[target.id] = [0, 0]);
        if (shooter.powered) { k[1]++; SFX.play('trap'); floater(V.W, target.x, target.y - 16, 'FROZEN!', '#ffffff'); }
        else { k[0]++; SFX.play('slow'); floater(V.W, target.x, target.y - 16, 'SLOWED!', '#9ad0ff'); }
      },
      onPvPBite(biter, victim) {
        const key = biter.id + '>' + victim.id;
        if (V.biteCD[key] && V.W.time - V.biteCD[key] < 1.5) return;
        V.biteCD[key] = V.W.time;
        biter.bites[victim.id] = (biter.bites[victim.id] || 0) + 1;
        SFX.play('bite'); floater(V.W, victim.x, victim.y - 16, 'CHOMP!', '#ffd23f');
      },
      onEnemyBite(e, sp) { if (V.isHost && sp.powered && e.alive && e.type !== 'hive') e.defeat(V.W, sp.slot); },
      onBossPhase(e, what, bySlot) { if (V.isHost && what === 'leg' && bySlot !== undefined && bySlot >= 0) V.addPts(bySlot, VS_PTS.leg); },
      onEnemyDefeated(e, bySlot) {
        if (!V.isHost) return;
        if (bySlot !== undefined && bySlot >= 0) V.addPts(bySlot, VS_PTS[e.type] || 30, 'npc');
        V.respawns.push({ type: e.type, t: 10 });
      },
      onBeeDown(bee, S) { if (V.isHost && S && S.slot !== undefined) V.addPts(S.slot, VS_PTS.bee, 'npc'); },
      onRemoteHurt(id, kind, src) {
        const r = V.roster.find(x => x.id === id);
        if (!r) return;
        const h = V.npcHits[r.slot] || (V.npcHits[r.slot] = { h: 0, k: 0, s: 0, g: 0, f: 0 });
        const key = kind === 'kill' ? 'k' : kind === 'stun' ? 's' : kind === 'sting' ? 'g' : kind === 'fire' ? 'f' : 'h';
        const cdk = id + key;
        if (V.biteCD[cdk] && V.W.time - V.biteCD[cdk] < 1.6) return;   // mirror the victim's invulnerability window
        V.biteCD[cdk] = V.W.time;
        h[key]++;
      },
      onSpiderDead(sp, cause, by) {
        if (sp === V.me) { V.myDeath = { cause, by }; }
        if (V.isHost) V.creditDeath(sp.slot, by);
      },
    };
  },
  addPts(slot, n, kind) {
    const s = this.scores[slot]; if (!s) return;
    s.pts += n; s.rp += n;
    if (kind === 'npc') s.npc++;
  },
  awardFly(slot, f) {
    const s = this.scores[slot]; if (!s) return;
    if (s.fl >= 5) { this.addPts(slot, 2); return; }
    s.fl++; this.addPts(slot, VS_PTS.fly);
    const body = this.bodyForSlot(slot);
    if (body) body.flies = s.fl;
    if (s.fl === 5) { const r = this.roster.find(x => x.slot === slot); if (this.W) { floater(this.W, f.x, f.y - 20, (r ? r.name : '') + ' POWERED UP!', '#ffd23f'); SFX.play('powerup'); } }
  },
  bodyForSlot(slot) { if (slot === this.mySlot) return this.me; const b = this.bots.get(slot); return b ? b.body : null; },
  creditDeath(victimSlot, bySlot) {
    if (this.credited[victimSlot]) return;
    this.credited[victimSlot] = true;
    if (bySlot !== undefined && bySlot >= 0 && bySlot !== victimSlot && this.teamOf(bySlot) !== this.teamOf(victimSlot)) { this.scores[bySlot].kills++; this.addPts(bySlot, VS_PTS.elim); }
  },
  aliveBySlot() {
    const out = {};
    for (const r of this.active()) {
      if (r.slot === this.mySlot) out[r.slot] = this.me ? this.me.alive : true;
      else if (r.bot) { const b = this.bots.get(r.slot); out[r.slot] = b ? b.body.alive : false; }
      else { const p = this.pres.get(r.id); out[r.slot] = p && p.dr === this.rn ? !!p.al : true; }
    }
    return out;
  },
  hostPhaseTick(dt) {
    this.phaseT -= dt;
    if (this.phase === 'intro' && this.phaseT <= 0) { this.phase = 'play'; this.phaseT = VS_ROUND_TIME; SFX.play('go'); }
    else if (this.phase === 'play') {
      const alive = this.aliveBySlot();
      const teams = new Set(this.active().map(r => this.teamOf(r.slot)));
      const aliveTeams = new Set(this.active().filter(r => alive[r.slot]).map(r => this.teamOf(r.slot)));
      if ((teams.size >= 2 && aliveTeams.size <= 1) || this.phaseT <= 0) this.endRound(alive, aliveTeams);
      // keep flies buzzing
      if (this.W.flies.filter(f => !f.heart).length < 4) { this.flyT -= dt; if (this.flyT <= 0) { this.W.spawnFly(); this.flyT = 1.5; } }
      this.W.maybeSpawnHeart(dt, VS_ROUND_TIME - this.phaseT);
      for (const r of this.respawns) { r.t -= dt; if (r.t <= 0) { r.done = true; this.spawnHazard(this.rn); } }
      this.respawns = this.respawns.filter(r => !r.done);
    } else if (this.phase === 'result' && this.phaseT <= 0) {
      if (this.rn < VS_ROUNDS - 1) this.beginRound(this.rn + 1);
      else { this.phase = 'final'; this.phaseT = 60; this.finalT = 0; SFX.play('complete'); track('match_end', { mode: this.mode, humans: this.humans().length }); }
    }
  },
  endRound(alive, aliveTeams) {
    let winTeam = -1, why = '';
    if (aliveTeams.size === 1 && this.phaseT > 0) { winTeam = [...aliveTeams][0]; why = 'LAST SPIDER STANDING'; }
    else {
      const tp = {};
      for (const r of this.active()) { const t = this.teamOf(r.slot); tp[t] = (tp[t] || 0) + this.scores[r.slot].rp + (alive[r.slot] ? 1 : 0); }
      const sorted = Object.entries(tp).sort((a, b) => b[1] - a[1]);
      if (sorted.length && (sorted.length === 1 || sorted[0][1] > sorted[1][1])) { winTeam = +sorted[0][0]; why = 'TIME UP - MOST POINTS'; }
      else why = 'TIME UP - TIED';
    }
    let res = 'DRAW!';
    if (winTeam >= 0) {
      for (const r of this.active()) if (this.teamOf(r.slot) === winTeam) this.scores[r.slot].wins++;
      res = this.mode === '2v2' ? TEAM_NAMES[winTeam] + ' WINS!' : ((this.roster.find(r => r.slot === winTeam) || {}).name || '?') + ' WINS THE ROUND!';
    }
    this.roundRes = { res, why, team: winTeam };
    this.phase = 'result'; this.phaseT = VS_RESULT;
    SFX.play('complete');
    track('round_end', { mode: this.mode, round: this.rn + 1 });
  },
  rematch() {
    if (!this.isHost || this.phase !== 'final' || this.rematchClosed) return;
    this.roster = this.roster.filter(r => r.bot || r.id === this.myId || this.net.peers && this.net.peers.has(r.id));
    this.startMatch();
  },

  /* ---------------- presence / snapshot ---------------- */
  presenceOf(sp) {
    const shotA = Math.round(sp.lastShot.a * 1000);
    return {
      v: 1, on: 1, s: sp.slot, nm: sp.name, cz: [sp.style.c, sp.style.h, sp.style.p],
      x: nX(sp.x), y: nY(sp.y), vx: Math.round(sp.vx || 0), vy: Math.round(sp.vy || 0), a: Math.round(sp.drawAngle * 100), f: sp.facing,
      st: sp.state === 'stuck' ? 's' : sp.state === 'rope' ? 'r' : 'a', al: sp.alive ? 1 : 0, hp: sp.hp,
      frz: Math.round(sp.frozenT * 10) / 10, slw: Math.round(sp.slowT * 10) / 10, stn: Math.round(sp.stunT * 10) / 10,
      sh: sp.sh, sx: nX(sp.lastShot.x), sy: nY(sp.lastShot.y), sa: shotA,
      ra: sp.state === 'rope' && sp.rope ? [nX(sp.rope.ax), nY(sp.rope.ay)] : 0,
      dmg: sp.dmg, bt: sp.bites, dr: this.rn, kb: sp.alive ? -1 : sp.killedBy, pw: sp.powered ? 1 : 0,

  /* ---------------- per-frame ---------------- */
  update(dt, c, nav) {

    if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeMag = 0; }

    if (this.sub === 'wait' && this.isHost) {

      const h = this.humans().length;
      if (this.kind === 'quick') {
        // everyone pressed START -> go now; otherwise start 60 s after a second player arrives (no bots)
        const allReady = h >= 2 && this.humans().every(r => r.slot === this.mySlot ? this.ready : r.ready);
        if (allReady) { if (this.autoT < 0 || this.autoT > 1.2) { this.autoT = 1.2; this.allReady = true; SFX.play('go'); } }
        else { this.allReady = false; if (h >= 2 && this.autoT < 0) this.autoT = 60; else if (h < 2) this.autoT = -1; }
        if (this.autoT >= 0) { this.autoT -= dt; if (this.autoT <= 0) { this.autoT = -1; this.startMatch(); } }
      } else if (this.kind !== 'bots') {
        if (h >= 4 && this.autoT < 0) this.autoT = 3;
        else if (h >= 2 && this.autoT < 0) this.autoT = this.kind === 'quick' ? 12 : 45;
        else if (h < 2 && this.kind !== 'bots') this.autoT = -1;
        if (this.autoT >= 0) { this.autoT -= dt; if (this.autoT <= 0) { this.autoT = -1; this.startMatch(); } }

    if (this.isHost) this.hostPhaseTick(dt);
    W.moverTarget = this.roundClock();
    const canMove = this.phase === 'play';
    W.aim = canMove ? c.aim : null;
    W.step(dt, s => {
      if (!canMove) return NO_CONTROLS;
      if (s === this.me) return c;
      if (this.isHost && s.isBot) { const b = this.bots.get(s.slot); return b ? b.brain.think(dt, W, this) : NO_CONTROLS; }
      return NO_CONTROLS;
    });

  /* ---------------- rendering ---------------- */

/* =====================================================================
   BOT BRAIN - simple VS opponent: hunt flies, power up, web + bite rivals
   ===================================================================== */
class BotBrain {
  constructor(body) { this.b = body; this.t = Math.random(); this.goal = null; this.shootCD = 1 + Math.random(); this.stuckT = 0; this.lx = body.x; this.ly = body.y; this.ropeT = 0; this.mood = Math.random(); }
  think(dt, W, V) {
    const b = this.b, c = { mx: 0, my: 0, jump: false, jumpHeld: false, shoot: null, mash: 0, pause: false, aim: null };
    if (!b.alive) return c;
    if (b.frozenT > 0 || b.stunT > 0) { if (Math.random() < dt * 7) c.mash = 1; return c; }
    this.t -= dt; this.shootCD -= dt;
    // progress tracking
    if (dist(b.x, b.y, this.lx, this.ly) < 1.5) this.stuckT += dt; else this.stuckT = Math.max(0, this.stuckT - dt * 2);
    this.lx = b.x; this.ly = b.y;
    // danger: flee hazards
    let danger = null;
    for (const e of W.enemies) if (e.alive && e.frozenT <= 0 && e.type !== 'hive' && dist(b.x, b.y, e.x, e.y) < (e.type === 'widow' ? 80 : e.type === 'dll' ? 90 : 50)) danger = e;
    const rivals = W.allSpiders().filter(o => o !== b && o.alive && o.team !== b.team);
    let target = null, mode = '';
    if (b.powered) {
      const frozen = rivals.filter(o => o.frozenT > 0).sort((p, q) => dist(b.x, b.y, p.x, p.y) - dist(b.x, b.y, q.x, q.y))[0];
      if (frozen) { target = frozen; mode = 'bite'; }
      else { const r = rivals.sort((p, q) => dist(b.x, b.y, p.x, p.y) - dist(b.x, b.y, q.x, q.y))[0]; if (r) { target = r; mode = 'hunt'; } }
    }
    if (!target) {
      const f = W.flies.filter(q => q.state === 'free').sort((p, q) => dist(b.x, b.y, p.x, p.y) - dist(b.x, b.y, q.x, q.y))[0];
      if (f) { target = f; mode = 'fly'; }
      else { const r = rivals[0]; if (r) { target = r; mode = 'hunt'; } }
    }
    if (danger) { target = { x: b.x + (b.x - danger.x) * 2, y: b.y - 40 }; mode = 'flee'; }
    if (!target) return c;
    const d = dist(b.x, b.y, target.x, target.y);
    const los = lineOfSight(b.x, b.y, target.x, target.y);
    // shooting decisions
    if (this.shootCD <= 0 && los) {
      if (mode === 'fly' && d < 235 && d > 16) { c.shoot = { type: 'point', x: target.x + (target.vx || 0) * 0.08, y: target.y + (target.vy || 0) * 0.08 }; this.shootCD = 0.45 + Math.random() * 0.5; }
      else if (mode === 'hunt' && d < 200) { c.shoot = { type: 'point', x: target.x + (target.vx || 0) * 0.15, y: target.y + (target.vy || 0) * 0.15 }; this.shootCD = 0.7 + Math.random() * 0.6; }
      else if (mode === 'fly' && rivals.length && Math.random() < 0.02) { const r = rivals[0]; if (dist(b.x, b.y, r.x, r.y) < 150 && lineOfSight(b.x, b.y, r.x, r.y)) { c.shoot = { type: 'point', x: r.x, y: r.y }; this.shootCD = 1.2; } }
    }
    // movement toward target
    let dx = target.x - b.x, dy = target.y - b.y;
    const m = Math.hypot(dx, dy) || 1;
    if (b.state === 'stuck') {
      c.mx = dx / m; c.my = dy / m;
      // target far above: grapple to something above it
      if ((dy < -50 && Math.abs(dx) < 140 && this.stuckT > 0.25) || this.stuckT > 0.8) {
        if (this.shootCD <= 0) {
          const ax = clamp(b.x + dx * 0.6 + (Math.random() - 0.5) * 40, 20, 620), ay = Math.max(20, Math.min(b.y - 60, target.y - 30));
          c.shoot = { type: 'point', x: ax, y: ay }; this.shootCD = 0.6;
        } else if (this.stuckT > 1.2) { c.jump = true; this.stuckT = 0; }
      }
      if (mode === 'flee' && Math.random() < dt * 3) c.jump = true;
      if (b.ny < -0.5 && Math.abs(dx) < 30 && dy < -40 && Math.random() < dt * 2) c.jump = true;
    } else if (b.state === 'rope') {
      this.ropeT += dt;
      c.mx = Math.sign(dx); c.my = dy < -10 ? -1 : 0;
      if ((Math.abs(dx) < 40 && dy > -10) || this.ropeT > 1.6) { c.jump = true; this.ropeT = 0; }
    } else {
      this.ropeT = 0;
      c.mx = Math.sign(dx) * Math.min(1, Math.abs(dx) / 30);
    }
    return c;
  }
}

    b.push({ label: 'OPTIONS', x: cx, y: y0 + (inVs ? 56 : 84), w: 170, h: 22, action: () => { optionsReturn = 'pause'; setScene('options'); } });
    b.push({ label: inVs ? 'LEAVE MATCH' : 'MAIN MENU', x: cx, y: y0 + (inVs ? 84 : 112), w: 170, h: 22, action: () => { if (inVs) VS.leave(); else setScene('menu'); } });
    return b;
  },
  draw() {
    if (pauseFrom === 'vs') { VS.draw(); } else Campaign.draw();
    dim(0.6);
    drawText('PAUSED', BW / 2, BH / 2 - 80, 5, '#ffffff', 'center', null, '#140c26');
    if (pauseFrom === 'vs') drawText('THE MATCH KEEPS RUNNING!', BW / 2, BH / 2 - 44, 1, '#ffd23f', 'center', '#140c26');
    drawUIButtons(this.buttons(), uiSel);
  },
};
let pauseFrom = 'level';
Screens.gameover = {
  buttons() {
    const cx = BW / 2, y0 = BH / 2 + 30;
    return [
      { label: 'TRY AGAIN', x: cx, y: y0, w: 170, h: 22, action: () => { Campaign.restart(); setScene('level'); } },
      Campaign.practice ? { label: 'PRACTICE MENU', x: cx, y: y0 + 28, w: 170, h: 22, action: () => setScene('practice') }
                        : { label: 'WORLD MAP', x: cx, y: y0 + 28, w: 170, h: 22, action: () => { Overworld.enter(Campaign.level); setScene('overworld'); } },
      { label: 'MAIN MENU', x: cx, y: y0 + 56, w: 170, h: 22, action: () => setScene('menu') },
    ];
  },
  draw() {
    Campaign.W.draw(); dim(0.62);
    drawText('GAME OVER', BW / 2, BH / 2 - 80, 6, '#ff5a7a', 'center', '#7a1f3a', '#140c26');
    const cause = Campaign.me.cause;
    const why = cause === 'water' ? 'YOU FELL IN THE WATER!' : cause === 'bite' ? 'THE ' + BIOMES[Campaign.level].npc + ' GOT YOU!' : cause === 'fire' ? 'BURNED UP!' : 'OUT OF HEALTH!';
    drawText(why, BW / 2, BH / 2 - 26, 1, '#ffffff', 'center', '#140c26');
    drawText('A NEW LAYOUT AWAITS ON EVERY TRY', BW / 2, BH / 2 - 12, 1, '#bba8ff', 'center', '#140c26');
    drawUIButtons(this.buttons(), uiSel);
  },
};
Screens.ending = {
  fx: [],
  buttons() {
    const cx = BW / 2, y0 = BH / 2 + 46, d = Campaign.diff;
    const b = [];
    if (d < 3) b.push({ label: 'TRY ' + DIFFS[d + 1].name, x: cx, y: y0, w: 190, h: 22, action: () => { save.diff = d + 1; persist(); Overworld.enter(0); setScene('overworld'); } });
    b.push({ label: 'WORLD MAP', x: cx, y: y0 + (d < 3 ? 28 : 0), w: 190, h: 22, action: () => { Overworld.enter(NUM_LEVELS - 1); setScene('overworld'); } });
    b.push({ label: 'MAIN MENU', x: cx, y: y0 + (d < 3 ? 56 : 28), w: 190, h: 22, action: () => setScene('menu') });
    return b;
  },
  update(dt) {
    if (Math.random() < dt * 3) { const x = Math.random() * BW, y = 30 + Math.random() * BH * 0.4, col = pick(Math.random, ['#ffd23f', '#ff5a7a', '#7df06a', '#9ad0ff', '#b77cff']); for (let i = 0; i < 26; i++) { const a = Math.random() * TAU, s = 30 + Math.random() * 70; this.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1.4, col }); } }
    for (const p of this.fx) { p.life -= dt; p.vy += 40 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    this.fx = this.fx.filter(p => p.life > 0);
    return false;
  },
  draw() {
    drawMenuBackdrop(); dim(0.55);
    for (const p of this.fx) { ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
    ctx.globalAlpha = 1;
    drawText('YOU BEAT THE ' + BIOMES[NUM_LEVELS - 1].npc + '!', BW / 2, BH / 2 - 112, 2, '#ffffff', 'center', null, '#140c26');
    const s = textWidth('NEW LEVELS COMING SOON!', 4) > BW - 20 ? 3 : 4;
    drawText('NEW LEVELS COMING SOON!', BW / 2, BH / 2 - 80, s, '#ffd23f', 'center', '#8a5a00', '#140c26');
    drawStarShape(ctx, BW / 2 - 40, BH / 2 - 20, 12, '#ffd23f', T);
    drawText('x ' + save.stars, BW / 2 - 22, BH / 2 - 27, 2, '#ffd23f', 'left', '#140c26');
    drawText('CLEARED ON ' + DIFFS[Campaign.diff].name, BW / 2, BH / 2 + 4, 1, DIFFS[Campaign.diff].color, 'center', '#140c26');
    drawParade();
    drawUIButtons(this.buttons(), uiSel);
  },
};
Screens.rotate = {
  draw() {
    ctx.fillStyle = '#1a1330'; ctx.fillRect(0, 0, BW, BH);
    const cx = BW / 2, cy = BH / 2 - 60, a = (Math.sin(T * 2) * 0.5 + 0.5) * Math.PI / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-a);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(-30, -52, 60, 104);
    ctx.fillStyle = '#1a1330'; ctx.fillRect(-25, -44, 50, 84);
    ctx.fillStyle = '#7df06a'; ctx.fillRect(-25, 10, 50, 30);
    ctx.restore();
    drawText('ROTATE YOUR DEVICE', cx, cy + 90, 3, '#ffffff', 'center', '#000000');
    drawText('GEAR BUGS PLAYS BEST IN LANDSCAPE', cx, cy + 124, 2, '#ffd23f', 'center');
    drawText('TAP TO PLAY ANYWAY', cx, cy + 160, 2, 'rgba(255,255,255,0.7)', 'center');
  },
};

/* ===== 90_main.js ===== */
/* =====================================================================
   90_MAIN - scene machine, main loop, resize, version check, boot
   ===================================================================== */
let scene = 'menu';
let ignoreRotate = false;
let newVersion = false;

function setScene(name) {
  const from = scene;
  scene = name; uiSel = 0;
  consumeInput();
  if ((name === 'level' || name === 'vs') && Input.last === 'touch' && from !== 'pause') tryFullscreenLandscape();
}
function isGameplay() {
  if (scene === 'level') return true;
  if (scene === 'vs') return VS.sub === 'match' && VS.phase !== 'final' && !!VS.W;
  return false;
}
function rotateBlocked() { return isTouchDevice && window.innerHeight > window.innerWidth && !ignoreRotate; }
/* ---------- Fullscreen (must run inside a user gesture) ---------- */
const fsSupported = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const isStandalone = () => !!((window.matchMedia && matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) || navigator.standalone);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function lockLandscape() { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }
function tryFullscreenLandscape() {
  try {
    if (isFullscreen()) return;
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).then(lockLandscape).catch(() => {});
    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); lockLandscape(); }
  } catch (e) {}
}
function exitFullscreen() {
  try { if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } catch (e) {}
}
function toggleFullscreen() { if (isFullscreen()) { exitFullscreen(); settings.autoFull = false; } else { tryFullscreenLandscape(); settings.autoFull = true; } persist(); }
document.addEventListener('fullscreenchange', () => setTimeout(resize, 100));
/* ---------- Install as an app (Chrome / Edge / Android) ---------- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('appinstalled', () => { deferredInstall = null; });
function promptInstall() {
  if (!deferredInstall) return;
  const d = deferredInstall; deferredInstall = null;
  try { d.prompt(); d.userChoice.catch(() => {}); } catch (e) {}
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
document.addEventListener('webkitfullscreenchange', () => setTimeout(resize, 100));
function onFocusLost() {
  if (scene === 'level') { pauseFrom = 'level'; setScene('pause'); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) onFocusLost();
  else checkVersion();
});
window.addEventListener('pagehide', () => { if (VS.net) { try { VS.net.close(); } catch (e) {} } if (VS.searchNet) { try { VS.searchNet.close(); } catch (e) {} } });

/* ---------- Build stamp: refetch the page to spot new deploys ---------- */
async function checkVersion() {
  if (BUILD.indexOf('__') === 0 || location.protocol === 'file:') return;
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    const t = await r.text();
    const m = t.match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD) newVersion = true;
  } catch (e) {}
}
setInterval(checkVersion, 60000);
function versionButton() { return { label: 'NEW VERSION READY', x: BW / 2, y: BH - 12, w: 150, h: 16, action: () => location.reload() }; }

/* ---------- Scene plumbing ---------- */
function sceneButtons() {
  if (scene === 'overworld') return Overworld.buttons();
  if (scene === 'vs') return VS.currentButtons();
  const s = Screens[scene];
  return s && s.buttons ? s.buttons() : [];
}
function backAction() {
  switch (scene) {
    case 'options': Screens.options.confirmReset = false; setScene(optionsReturn); break;
    case 'controls': setScene('options'); break;
    case 'private': setScene('menu'); break;
    case 'practice': setScene('menu'); break;
    case 'nettest': setScene(netTestReturn); break;
    case 'pause': setScene(pauseFrom); break;
    case 'gameover': Overworld.enter(Campaign.level); setScene('overworld'); break;
    case 'ending': setScene('menu'); break;
    case 'overworld': setScene('menu'); break;
    case 'vs': if (VS.sub === 'wait' || VS.sub === 'connecting' || VS.sub === 'searching') VS.leave(); break;
    default: return;
  }
  SFX.play('back');
}
function genericNav(buttons, nav) {
  // pointer taps
  for (const t of Input.taps) {
    for (let i = 0; i < buttons.length; i++) {
      const b = buttons[i];
      if (!b.disabled && inRect(t, btnRect(b))) { uiSel = i; SFX.play('confirm'); b.action(); consumeInput(); return; }
    }
  }
  // mouse hover selects
  if (Input.last === 'mouse' && Input.mouse.active) {
    for (let i = 0; i < buttons.length; i++) if (inRect(Input.mouse, btnRect(buttons[i]))) { if (uiSel !== i) SFX.play('select'); uiSel = i; }
  }
  const n = buttons.length;
  if (nav.back) { backAction(); return; }
  if (!n) return;
  const step = d => { for (let k = 0; k < n; k++) { uiSel = (uiSel + d + n) % n; if (!buttons[uiSel].disabled) break; } SFX.play('select'); };
  if (nav.up || nav.left) step(-1);
  if (nav.down || nav.right) step(1);
  uiSel = clamp(uiSel, 0, n - 1);
  if (nav.confirm && buttons[uiSel] && !buttons[uiSel].disabled) { SFX.play('confirm'); buttons[uiSel].action(); consumeInput(); }
}
function hoverCursor(buttons) {
  if (Input.last !== 'mouse') return;
  let over = buttons.some(b => inRect(Input.mouse, btnRect(b)));
  if (scene === 'overworld') over = over || Overworld.nodes.some(n => dist(Input.mouse.x - OX, Input.mouse.y - OY, n.x, n.y) < 26);
  canvas.style.cursor = gameplayPointer ? (uiHot.some(r => inRect(Input.mouse, r)) ? 'pointer' : 'none') : over ? 'pointer' : 'default';
}

/* ---------- Per-frame update ---------- */
function update(dt) {
  if (rotateBlocked()) {
    if (Input.taps.length || Input.pressed.Enter || Input.pressed.Space || gp.pressed(0)) ignoreRotate = true;
    if (VS.sub !== 'idle' && scene === 'vs') VS.update(dt, NO_CONTROLS, {});
    return;
  }
  // "NEW VERSION READY" pill (menus, lobbies, results)
  if (newVersion && !gameplayPointer) {
    const vb = versionButton();
    for (const t of Input.taps) if (inRect(t, btnRect(vb))) { vb.action(); return; }
  }
  const nav = readMenuNav(dt);
  if (scene === 'level') {
    const c = readPlayerControls();
    if (c.pause) { pauseFrom = 'level'; setScene('pause'); SFX.play('select'); return; }
    Campaign.update(dt, c);
    return;
  }
  if (scene === 'vs') {
    if (isGameplay()) {
      // overlay buttons (search screen) take taps before gameplay
      for (const t of Input.taps) for (const b of VS.overlayButtons()) if (inRect(t, btnRect(b))) { SFX.play('confirm'); b.action(); consumeInput(); return; }
      const c = readPlayerControls();
      if (c.pause && VS.sub === 'match') { pauseFrom = 'vs'; setScene('pause'); SFX.play('select'); VS.update(dt, NO_CONTROLS, nav); return; }
      if (c.pause && VS.sub !== 'match') { VS.leave(); return; }
      VS.update(dt, c, nav);
      return;
    }
    VS.update(dt, NO_CONTROLS, nav);
    if (scene === 'vs') {
      const bs = VS.currentButtons();
      if (VS.sub === 'wait' && VS.isHost && (nav.tabL || nav.tabR)) VS.cycleMode(nav.tabL ? -1 : 1);
      genericNav(bs, nav);
    }
    return;
  }
  if (scene === 'pause' && pauseFrom === 'vs') VS.update(dt, NO_CONTROLS, nav);
  if (scene === 'pause' && pauseFrom === 'vs' && scene === 'pause' && VS.sub === 'idle') { setScene('menu'); return; }
  if (scene === 'overworld') {
    for (const t of Input.taps) {
      const bs = Overworld.buttons();
      const hitBtn = bs.find(b => inRect(t, btnRect(b)));
      if (hitBtn) { SFX.play('confirm'); hitBtn.action(); consumeInput(); return; }
      if (Overworld.tapNode(t)) { consumeInput(); return; }
    }
    if (nav.confirm) { Overworld.play(); return; }
    if (nav.back) { backAction(); return; }
    Overworld.update(dt, nav);
    return;
  }
  const S = Screens[scene];
  if (S && S.update && S.update(dt, nav)) {
    // screen handled its own navigation; still honour pointer taps on its buttons
    for (const t of Input.taps) for (const b of S.buttons()) if (!b.disabled && inRect(t, btnRect(b))) { SFX.play('confirm'); b.action(); consumeInput(); return; }
    return;
  }
  genericNav(sceneButtons(), nav);
}

/* ---------- Render ---------- */
function render() {
  ctx.imageSmoothingEnabled = false;
  uiHot = [];
  if (rotateBlocked()) { Screens.rotate.draw(); return; }
  switch (scene) {
    case 'level': Campaign.draw(); break;
    case 'overworld': Overworld.draw(); break;
    case 'vs': VS.draw(); break;
    default: if (Screens[scene]) Screens[scene].draw(); break;
  }
  if (gameplayPointer && Input.last === 'touch' && !(scene === 'vs' && VS.sub === 'match' && VS.me && !VS.me.alive)) drawTouchControls();
  if (newVersion && !gameplayPointer) drawButton(versionButton(), Math.floor(T * 2) % 2 === 0);
  hoverCursor(gameplayPointer ? [] : sceneButtons());
}

/* ---------- Resize ---------- */
function resize() {
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  const aspect = vw / vh;
  if (aspect >= REF_W / REF_H) { BH = REF_H; BW = Math.round(REF_H * aspect); }
  else { BW = REF_W; BH = Math.round(REF_W / aspect); }
  canvas.width = BW; canvas.height = BH;
  canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
  OX = Math.floor((BW - REF_W) / 2);
  OY = Math.floor((BH - REF_H) / 2);
  ctx.imageSmoothingEnabled = false;
  ART.level = null;            // force art rebuild at the new size
  layoutTouch();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ---------- Main loop ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  T += dt;
  pollGamepad();
  gameplayPointer = isGameplay();
  try { update(dt); } catch (e) { console.error(e); }
  gameplayPointer = isGameplay();
  try { render(); } catch (e) { console.error(e); }
  endFrameInput();
  requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
resize();
(function boot() {
  const params = new URLSearchParams(location.search);
  const room = (params.get('room') || '').toUpperCase();
  if (room.length === 4 && [...room].every(ch => NET.CODE_CHARS.includes(ch))) { Screens.join.code = room; scene = 'join'; }
  // warm the network stack at page load (ICE servers + strict-NAT detection)
  iceServers();
  setTimeout(() => { detectStrictNat(); }, 400);
  setTimeout(() => { loadTrystero(); }, 1500);
  setTimeout(checkVersion, 5000);
})();
requestAnimationFrame(frame);

</script>
