const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);

const TAU = Math.PI * 2;

function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((cx - x1) * dx + (cy - y1) * dy) / l2, 0, 1) : 0;

// Liang-Barsky: does segment intersect axis-aligned rect (optionally inset)?
function segRect(x1, y1, x2, y2, p, inset = 0) {
  const rx = p.x + inset, ry = p.y + inset, rw = p.w - inset * 2, rh = p.h - inset * 2;
  if (rw <= 0 || rh <= 0) return false;

  const ps = [-dx, dx, -dy, dy], qs = [x1 - rx, rx + rw - x1, y1 - ry, ry + rh - y1];
  for (let i = 0; i < 4; i++) {
    if (ps[i] === 0) { if (qs[i] < 0) return false; }
    else {
      const t = qs[i] / ps[i];
      if (ps[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; }

// Seeded RNG (mulberry32) - levels, rocks and art are deterministic from a seed
function rng(seed) {

    let t = Math.imul(a ^ a >>> 15, 1 | a);

}

/* ---------- Pixel drawing primitives ---------- */
function pxCircle(g, cx, cy, r, color) {
  g.fillStyle = color; cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  for (let dy = -r; dy <= r; dy++) { const dx = Math.floor(Math.sqrt(r * r - dy * dy)); g.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1); }
}
function pxEllipse(g, cx, cy, rx, ry, color) {
  g.fillStyle = color; ry = Math.max(1, Math.round(ry));
  for (let dy = -ry; dy <= ry; dy++) {
    const dx = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
    g.fillRect(Math.round(cx - dx), Math.round(cy + dy), dx * 2 + 1, 1);
  }
}
function roundRectPx(g, x, y, w, h, rad, color) {
  g.fillStyle = color; rad = Math.min(rad, Math.floor(h / 2), Math.floor(w / 2));
  for (let i = 0; i < h; i++) {
    let inset = 0;
    if (i < rad) inset = rad - Math.floor(Math.sqrt(rad * rad - (rad - i - 0.5) * (rad - i - 0.5)));
    else if (i > h - 1 - rad) { const k = i - (h - 1 - rad); inset = rad - Math.floor(Math.sqrt(Math.max(0, rad * rad - (k - 0.5) * (k - 0.5)))); }
    g.fillRect(x + inset, y + i, w - inset * 2, 1);
  }
}

const fontCache = {};
function getFontAtlas(color) {
  if (fontCache[color]) return fontCache[color];
  const chars = Object.keys(FONT);
  const c = makeCanvas(chars.length * 6, 8), g = c.getContext('2d');
  g.fillStyle = color;
  const index = {};
  chars.forEach((ch, i) => {
    index[ch] = i;
    const cols = FONT[ch];
    for (let x = 0; x < 5; x++) for (let y = 0; y < 7; y++) if ((cols[x] >> y) & 1) g.fillRect(i * 6 + x, y, 1, 1);
  });
  return (fontCache[color] = { canvas: c, index });
}
function textWidth(str, scale = 1) { return String(str).length * 6 * scale - scale; }
function drawRaw(str, x, y, scale, color) {
  const a = getFontAtlas(color);
  for (let i = 0; i < str.length; i++) {
    const idx = a.index[str[i]];
    if (idx === undefined) continue;
    ctx.drawImage(a.canvas, idx * 6, 0, 5, 7, x + i * 6 * scale, y, 5 * scale, 7 * scale);
  }
}
/* drawText(str, x, y, scale, color, align, shadowColor, outlineColor) */
function drawText(str, x, y, scale = 1, color = '#fff', align = 'left', shadow = null, outline = null) {
  str = String(str).toUpperCase();
  const w = textWidth(str, scale);
  let sx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  sx = Math.round(sx); y = Math.round(y);
  if (outline) {
    const o = Math.max(1, Math.floor(scale / 2));
    for (const [dx, dy] of [[-o,0],[o,0],[0,-o],[0,o],[-o,-o],[o,o],[-o,o],[o,-o]]) drawRaw(str, sx + dx, y + dy, scale, outline);
  }

// Word-wrap helper for the pixel font
function wrapText(str, maxW, scale = 1) {
  const words = String(str).split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (textWidth(test, scale) > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* ---------- Difficulty array ---------- */
const DIFFS = [
  { name: 'EASY',   color: '#7df06a', speed: 0.78, aggro: 0.65, react: 0.55, windup: 0.55, freeze: 8.0, beeMax: 1, stun: 1.5, hell: false },
  { name: 'MEDIUM', color: '#ffd23f', speed: 1.00, aggro: 1.00, react: 0.32, windup: 0.40, freeze: 6.0, beeMax: 2, stun: 2.0, hell: false },
  { name: 'HARD',   color: '#ff8c42', speed: 1.25, aggro: 1.45, react: 0.16, windup: 0.28, freeze: 4.5, beeMax: 3, stun: 2.4, hell: false },
  { name: 'HELL MODE', color: '#ff2d2d', speed: 1.55, aggro: 2.30, react: 0.02, windup: 0.14, freeze: 3.6, beeMax: 3, stun: 2.6, hell: true },
];

/* ---------- Persistent save data ---------- */
const SAVE_KEY = 'gearbugs_v2';
const NUM_LEVELS = 6;                 // Field, Meadow, Island, Barn, Factory, Desert Anthill
const save = {
  stars: 0,                                    // star coin inventory tally (permanent)
  unlocked: [1, 1, 1, 1],                      // levels unlocked per difficulty
  cleared: [0, 0, 0, 0].map(() => new Array(6).fill(0)),
  style: { c: 0, h: 0, p: 0 },                 // spider customization
  diff: 1,
  settings: { sound: true, shake: true, aim: true, autoFull: true },
  name: '',
};
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (s && typeof s === 'object') {
    if (typeof s.stars === 'number') save.stars = s.stars;
    // older saves had fewer levels: pad them, and having beaten the old final level opens the next one
    if (Array.isArray(s.cleared) && s.cleared.length === 4) save.cleared = s.cleared.map(r => { const a = Array.isArray(r) ? r.slice(0, NUM_LEVELS).map(v => v ? 1 : 0) : []; while (a.length < NUM_LEVELS) a.push(0); return a; });
    if (Array.isArray(s.unlocked) && s.unlocked.length === 4) save.unlocked = s.unlocked.map((v, d) => { let u = v | 0; while (u < NUM_LEVELS && save.cleared[d][u - 1]) u++; return clamp(u, 1, NUM_LEVELS); });
    if (s.style) save.style = { c: s.style.c | 0, h: s.style.h | 0, p: s.style.p | 0 };
    if (typeof s.diff === 'number') save.diff = clamp(s.diff | 0, 0, 3);
    if (s.settings) Object.assign(save.settings, s.settings);
    if (typeof s.name === 'string') save.name = s.name.slice(0, 8);
  }
} catch (e) { /* storage unavailable */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const settings = save.settings;

/* ---------- Optional analytics hook (GA4 if the page has gtag; never personal data) ---------- */
function track(name, params) {

}

/* ---------- Small shared helpers ---------- */
function fmtTime(t) { t = Math.max(0, t); const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); }
function fmtTimeTenths(t) { t = Math.max(0, t); const m = Math.floor(t / 60), s = Math.floor(t % 60), d = Math.floor((t * 10) % 10); return m + ':' + String(s).padStart(2, '0') + '.' + d; }
let shakeT = 0, shakeMag = 0;

/* ===== 10_audio.js ===== */
/* =====================================================================
   10_AUDIO - retro arcade sound effects synthesized with the Web Audio API
   ===================================================================== */
const SFX = {
  ac: null, master: null, noiseBuf: null, last: {},
  init() {
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ac = new AC();
        this.master = this.ac.createGain();
        this.master.gain.value = 0.32;
        this.master.connect(this.ac.destination);
        const len = this.ac.sampleRate;
        this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) { /* audio unavailable */ }
  },
  tone(f0, f1, dur, type = 'square', vol = 0.2, delay = 0) {
    if (!settings.sound || !this.ac) return;
    const c = this.ac, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol = 0.2, freq = 1200, delay = 0, ftype = 'lowpass') {
    if (!settings.sound || !this.ac) return;
    const c = this.ac, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.03);
  },
  // Play a named effect. `gap` throttles repeats (seconds) so swarms don't spam.
  play(name, gap = 0) {
    if (!settings.sound || !this.ac) return;
    if (gap) { const n = this.ac.currentTime; if (this.last[name] && n - this.last[name] < gap) return; this.last[name] = n; }
    switch (name) {
      case 'jump':    this.tone(280, 640, 0.12, 'square', 0.13); break;
      case 'drop':    this.tone(300, 200, 0.08, 'triangle', 0.12); break;
      case 'land':    this.tone(160, 90, 0.05, 'square', 0.05); break;
      case 'web':     this.tone(1150, 260, 0.13, 'sawtooth', 0.07); this.noise(0.07, 0.08, 3200, 0, 'highpass'); break;
      case 'attach':  this.tone(520, 880, 0.06, 'triangle', 0.14); break;
      case 'release': this.tone(500, 320, 0.08, 'triangle', 0.1); break;
      case 'snap':    this.noise(0.08, 0.15, 2400, 0, 'highpass'); break;
      case 'fly':     this.tone(988, 988, 0.07, 'square', 0.12); this.tone(1480, 1480, 0.2, 'square', 0.12, 0.07); break;
      case 'heart':   [880, 1175, 1568].forEach((f, i) => this.tone(f, f * 1.02, 0.12, 'triangle', 0.15, i * 0.07)); break;
      case 'reel':    this.tone(700, 1200, 0.15, 'triangle', 0.12); break;
      case 'powerup': [523, 659, 784, 1047, 1319].forEach((f, i) => { this.tone(f, f, 0.14, 'square', 0.12, i * 0.08); this.tone(f / 2, f / 2, 0.14, 'triangle', 0.11, i * 0.08); }); break;
      case 'trap':    this.noise(0.25, 0.22, 900); this.tone(300, 80, 0.3, 'square', 0.15); this.tone(1200, 1900, 0.2, 'triangle', 0.1, 0.1); break;
      case 'noeffect':this.tone(190, 160, 0.08, 'square', 0.13); this.tone(140, 110, 0.14, 'square', 0.13, 0.09); break;
      case 'slow':    this.tone(400, 150, 0.25, 'triangle', 0.14); break;
      case 'windup':  this.tone(90, 140, 0.28, 'sawtooth', 0.07); break;
      case 'tongue':  this.tone(180, 560, 0.15, 'triangle', 0.2); break;
      case 'hurt':    this.tone(420, 70, 0.35, 'sawtooth', 0.2); this.noise(0.2, 0.2, 800); break;
      case 'bite':    this.noise(0.15, 0.32, 600); this.tone(160, 55, 0.2, 'square', 0.24); this.tone(900, 1400, 0.12, 'square', 0.1, 0.15); break;
      case 'star':    [784, 988, 1175, 1568, 1976].forEach((f, i) => this.tone(f, f, 0.12, 'square', 0.12, i * 0.06)); break;
      case 'free':    this.tone(200, 420, 0.2, 'sawtooth', 0.1); break;
      case 'buzz':    this.tone(210, 230, 0.18, 'sawtooth', 0.035); break;
      case 'sting':   this.tone(1400, 600, 0.12, 'square', 0.13); this.noise(0.1, 0.15, 3000, 0, 'highpass'); break;
      case 'beedown': this.tone(900, 120, 0.35, 'square', 0.1); break;
      case 'splash':  this.noise(0.45, 0.3, 1400); this.tone(400, 90, 0.4, 'sine', 0.2); break;
      case 'dash':    this.noise(0.18, 0.18, 1800, 0, 'bandpass'); this.tone(120, 380, 0.18, 'sawtooth', 0.12); break;
      case 'shriek':  this.tone(1800, 900, 0.25, 'sawtooth', 0.1); this.tone(1700, 800, 0.25, 'square', 0.06, 0.04); break;

        if (m === l) { o.x = p.x - r; o.vx = -Math.abs(o.vx); } else if (m === rr) { o.x = p.x + p.w + r; o.vx = Math.abs(o.vx); }
        else if (m === t) { o.y = p.y - r; o.vy = -Math.abs(o.vy); } else { o.y = p.y + p.h + r; o.vy = Math.abs(o.vy); }
      }
    }
  }
  return hit;
}

/* ===== 40_levels.js ===== */
/* =====================================================================

   ===================================================================== */
const BIOMES = [

    far: ['#d9a640', '#e8bb52'], near: ['#c48a2e', '#d69d3a'], bush: ['#b8862a', '#d6a540'], sun: '#ff9a3c' },

    far: ['#2a2638', '#332e44'], near: ['#3a3f4c', '#5c6270'], bush: ['#ffd23f', '#1a1a1a'], sun: '#9ad0ff' },

];
const WOOD_TYPES = new Set(['branch', 'log', 'trunk', 'trunkR', 'palm', 'frond', 'drift', 'beam', 'plank', 'loft', 'fence', 'crate', 'hay', 'barnwall']);
const GROUND_Y = 320;

function mkPlat(x, y, w, h, type, extra) {
  const p = Object.assign({ x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h), type }, extra || {});
  p.wood = WOOD_TYPES.has(type);
  p.soft = type === 'frond';          // palm leaves: the gecko slips straight through them
  return p;
}
function rectsOverlap(a, b, m = 0) { return a.x - m < b.x + b.w && a.x + a.w + m > b.x && a.y - m < b.y + b.h && a.y + a.h + m > b.y; }

/* Can candidate c be placed? touch = platforms it may sit flush against */
function fits(c, plats, touch, margin, reserved) {
  if (c.x < 22 || c.x + c.w > 618 || c.y < 34) {
    if (!touch || !touch.length) return false;
  }
  for (const p of plats) {
    if (touch && touch.includes(p)) { if (rectsOverlap(c, p, -1)) return false; continue; }
    if (rectsOverlap(c, p, margin)) return false;
  }
  for (const z of reserved || []) if (rectsOverlap(c, z, 0)) return false;
  return true;
}

function generateLevel(biomeIdx, seed) {
  const r = rng((seed >>> 0) ^ (biomeIdx * 0x9E3779B1));
  const B = BIOMES[biomeIdx];
  const L = { biome: biomeIdx, B, seed: seed >>> 0, plats: [], spawns: [], enemySpawn: null, hive: null, barn: null, water: null, decor: [] };
  const P = L.plats;
  const M = 24;                       // free gap around platforms so crawlers always fit
  let ground, spawnXs = [70, 570, 200, 440];

  /* ---- Fixed frame per biome ---- */
  if (biomeIdx === 0) {
    ground = mkPlat(-400, GROUND_Y, 1440, 240, 'ground'); P.push(ground);
    P.push(mkPlat(-30, -400, 46, 720, 'trunk'));
    P.push(mkPlat(624, -400, 120, 720, 'cliff'));
  } else if (biomeIdx === 1) {
    ground = mkPlat(-400, GROUND_Y, 1440, 240, 'meadow'); P.push(ground);
    P.push(mkPlat(-30, -400, 46, 720, 'trunk'));
    P.push(mkPlat(624, -400, 46, 720, 'trunkR'));
    const hb = mkPlat(16, 64, 176, 11, 'branch', { hiveBranch: true }); P.push(hb);
    L.hive = { x: 136, y: hb.y + hb.h + 17 };
  } else if (biomeIdx === 2) {
    ground = mkPlat(96, 296, 448, 200, 'sand'); P.push(ground);
    L.water = { y: 330 };
    spawnXs = [150, 490, 250, 390];
  } else if (biomeIdx === 3) {
    ground = mkPlat(-400, GROUND_Y, 1440, 240, 'dirt'); P.push(ground);
    P.push(mkPlat(-30, -400, 46, 720, 'silo'));
    P.push(mkPlat(624, -400, 120, 720, 'barnwall'));
    P.push(mkPlat(330, 72, 294, 10, 'beam'));
    P.push(mkPlat(330, 82, 12, 170, 'barnwall', { inner: true }));
    L.barn = { x0: 330, x1: 624, y0: 72 };
  } else if (biomeIdx === 4) {
    // factory: steel floor, riveted walls and a girder ceiling the spiders can hang from
    ground = mkPlat(-400, GROUND_Y, 1440, 240, 'floor'); P.push(ground);
    P.push(mkPlat(-30, -400, 46, 720, 'fwall'));
    P.push(mkPlat(624, -400, 120, 720, 'fwall'));
    P.push(mkPlat(-400, -400, 1440, 416, 'ceiling'));
    L.movers = [];
  } else {
    // desert: rising sand floor between two sandstone mesas
    ground = mkPlat(-400, GROUND_Y, 1440, 240, 'sand2', { dyn: true, rising: true }); P.push(ground);
    P.push(mkPlat(-30, -400, 46, 720, 'mesa'));
    P.push(mkPlat(624, -400, 120, 720, 'mesa'));
  }
  const frame = P.slice();
  const gTop = ground.y;
  // Keep spawn points clear of ground-sitting props
  const reserved = spawnXs.map(x => ({ x: x - 20, y: gTop - 60, w: 40, h: 60 }));
  if (L.hive) reserved.push({ x: L.hive.x - 34, y: L.hive.y - 20, w: 68, h: 60 });

  const tryPlace = (make, n, tries = 90) => {
    let placed = 0;
    for (let t = 0; t < tries && placed < n; t++) {
      const c = make();
      if (!c) continue;
      if (fits(c, P, c.touch, M, reserved)) { delete c.touch; P.push(c); placed++; }
    }
    return placed;
  };
  const xIn = (w, x0 = 30, x1 = 610) => randInt(r, x0, Math.max(x0, x1 - w));

  /* ---- Biome specific random dressing ---- */
  if (biomeIdx === 0) {
    tryPlace(() => { const w = randInt(r, 96, 136); const c = mkPlat(16, randInt(r, 90, 150), w, 10, 'branch'); c.touch = [P[1]]; return c; }, 1);
    tryPlace(() => { const w = randInt(r, 72, 110); const c = mkPlat(624 - w, randInt(r, 96, 170), w, 13, 'shelf'); c.touch = [P[2]]; return c; }, 1);
    tryPlace(() => { const w = randInt(r, 80, 124); return mkPlat(xIn(w, 120, 560), randInt(r, 56, 130), w, randInt(r, 12, 14), 'ledge'); }, 2);
    tryPlace(() => { const w = randInt(r, 70, 120); return mkPlat(xIn(w), randInt(r, 150, 230), w, randInt(r, 12, 15), 'ledge'); }, 2);
    tryPlace(() => { const w = randInt(r, 46, 76), h = randInt(r, 34, 56); const c = mkPlat(xIn(w, 100, 560), gTop - h, w, h, 'boulder'); c.touch = [ground]; return c; }, 2);
    tryPlace(() => { const w = randInt(r, 34, 48); return mkPlat(xIn(w), randInt(r, 120, 250), w, randInt(r, 15, 19), 'rock'); }, 2);
    L.enemySpawn = { x: 560, y: gTop - 10 };
  } else if (biomeIdx === 1) {
    tryPlace(() => { const w = randInt(r, 64, 104); return mkPlat(xIn(w, 210, 600), randInt(r, 50, 120), w, 10, 'leaf'); }, 2);
    tryPlace(() => { const w = randInt(r, 70, 116); return mkPlat(xIn(w), randInt(r, 140, 230), w, 14, 'log'); }, 2);
    tryPlace(() => { const w = randInt(r, 40, 58); return mkPlat(xIn(w, 60, 590), randInt(r, 170, 250), w, 12, 'mushroom'); }, 2);
    tryPlace(() => { const w = randInt(r, 44, 70), h = randInt(r, 30, 50); const c = mkPlat(xIn(w, 120, 560), gTop - h, w, h, 'boulder'); c.touch = [ground]; return c; }, 2);
    tryPlace(() => { const w = randInt(r, 64, 96); const c = mkPlat(624 - w, randInt(r, 110, 200), w, 12, 'branch', { flip: true }); c.touch = [P[2]]; return c; }, 1);
    L.enemySpawn = { x: L.hive.x, y: L.hive.y };
  } else if (biomeIdx === 2) {
    // palms rising from the plateau with a frond canopy platform on top
    tryPlace(() => {
      const x = randInt(r, 150, 480), top = randInt(r, 120, 190);
      const c = mkPlat(x, top, 12, gTop - top, 'palm'); c.touch = [ground];
      return c;
    }, 2);
    for (const p of P.filter(q => q.type === 'palm')) {
      const f = mkPlat(p.x - 26, p.y - 8, 64, 8, 'frond');
      if (fits(f, P, [p], 14, [])) P.push(f);
    }
    tryPlace(() => { const w = randInt(r, 64, 110); return mkPlat(xIn(w, 14, 626), randInt(r, 60, 150), w, 10, 'drift'); }, 3);
    tryPlace(() => { const w = randInt(r, 50, 90); return mkPlat(xIn(w, 14, 626), randInt(r, 170, 250), w, 10, 'drift'); }, 2);
    tryPlace(() => { const w = randInt(r, 36, 60), h = randInt(r, 18, 30); const c = mkPlat(xIn(w, 120, 520), gTop - h, w, h, 'beachrock'); c.touch = [ground]; return c; }, 2);
    L.enemySpawn = { x: 470, y: gTop - 10 };
  } else if (biomeIdx === 3) {
    // exterior (wheat field side): fence rails and floating planks
    tryPlace(() => { const w = randInt(r, 60, 96); return mkPlat(xIn(w, 40, 300), randInt(r, 215, 262), w, 8, 'fence'); }, 1);
    tryPlace(() => { const w = randInt(r, 60, 100); return mkPlat(xIn(w, 40, 300), randInt(r, 70, 170), w, 10, 'plank'); }, 2);
    tryPlace(() => { const w = randInt(r, 36, 48); return mkPlat(xIn(w, 40, 300), randInt(r, 150, 240), w, randInt(r, 15, 18), 'rock'); }, 1);
    // interior: keep a clear column from the rafters to the floor for the widow's silk drop
    const beam = P.find(p => p.type === 'beam');
    const dropX = randInt(r, 384, 520);
    reserved.push({ x: dropX - 18, y: beam.y + beam.h, w: 36, h: gTop - beam.y - beam.h });
    // hay bales stay inside the barn (red wall behind them), crates go out in the wheat
    tryPlace(() => { const w = randInt(r, 40, 52), h = randInt(r, 24, 28); const c = mkPlat(xIn(w, 346, 618), gTop - h, w, h, 'hay'); c.touch = [ground]; return c; }, 1, 160);
    tryPlace(() => { const w = randInt(r, 80, 130); const c = mkPlat(624 - w, randInt(r, 130, 190), w, 10, 'loft'); c.touch = [P[2]]; return c; }, 1);
    tryPlace(() => { const w = randInt(r, 60, 100); return mkPlat(xIn(w, 362, 560), randInt(r, 120, 220), w, 10, 'plank'); }, 1);
    tryPlace(() => { const s = randInt(r, 26, 34); const c = mkPlat(xIn(s, 346, 618), gTop - s, s, s, 'crate'); c.touch = [ground]; return c; }, 1);
    tryPlace(() => { const s = randInt(r, 24, 32); const c = mkPlat(xIn(s, 60, 300), gTop - s, s, s, 'crate'); c.touch = [ground]; return c; }, 2);
    L.enemySpawn = { x: dropX, y: beam.y + beam.h + 10, plat: beam };   // the widow drops from the rafters
  } else if (biomeIdx === 4) {
    // moving lifts first: their whole travel path stays clear of everything else
    const placeMover = (make) => {
      for (let t = 0; t < 120; t++) {
        const c = make(); if (!c) continue;
        const m = c.move, sw = { x: Math.min(m.x0, m.x1), y: Math.min(m.y0, m.y1), w: Math.abs(m.x1 - m.x0) + c.w, h: Math.abs(m.y1 - m.y0) + c.h };
        if (sw.x < 30 || sw.x + sw.w > 610 || sw.y < 44) continue;
        if (!fits(sw, P, null, M, reserved)) continue;
        reserved.push({ x: sw.x - 14, y: sw.y - 14, w: sw.w + 28, h: sw.h + 28 });
        P.push(c); L.movers.push(c); return c;
      }
      return null;
    };
    placeMover(() => {   // overhead trolley lift gliding side to side
      const w = randInt(r, 52, 64), x0 = randInt(r, 90, 300), y = randInt(r, 70, 120), span = randInt(r, 120, 170);
      return mkPlat(x0, y, w, 10, 'lift', { dyn: true, move: { x0, y0: y, x1: x0 + span, y1: y, period: 5 + r() * 1.5, phase: r() }, axis: 'x' });
    });
    placeMover(() => {   // elevator going up and down
      const w = randInt(r, 46, 56), x = pick(r, [randInt(r, 70, 170), randInt(r, 440, 540)]), y1 = randInt(r, 232, 262), y0 = y1 - randInt(r, 100, 130);
      return mkPlat(x, y0, w, 10, 'lift', { dyn: true, move: { x0: x, y0, x1: x, y1, period: 4.2 + r() * 1.2, phase: r() }, axis: 'y' });
    });
    // conveyor belts: one running along the floor, one up in the air on a stand
    const beltSpeed = () => (r() < 0.5 ? -1 : 1) * randInt(r, 42, 58);
    tryPlace(() => { const w = randInt(r, 120, 160); const c = mkPlat(xIn(w, 130, 520), gTop - 12, w, 12, 'conveyor', { dyn: true, belt: beltSpeed() }); c.touch = [ground]; return c; }, 1, 160);
    tryPlace(() => { const w = randInt(r, 96, 136); return mkPlat(xIn(w, 40, 600), randInt(r, 168, 222), w, 12, 'conveyor', { dyn: true, belt: beltSpeed(), stand: true }); }, 1, 160);
    // steel girders and a metal crate
    tryPlace(() => { const w = randInt(r, 70, 110); return mkPlat(xIn(w, 40, 600), randInt(r, 56, 140), w, 10, 'girder'); }, 2);
    tryPlace(() => { const w = randInt(r, 60, 96); return mkPlat(xIn(w, 40, 600), randInt(r, 150, 240), w, 10, 'girder'); }, 1);
    tryPlace(() => { const s = randInt(r, 24, 32); const c = mkPlat(xIn(s, 100, 560), gTop - s, s, s, 'mcrate'); c.touch = [ground]; return c; }, 1);
    L.enemySpawn = { x: 470, y: 150 };
  } else {
    // the ant hill mound sits on the sand; its hole is where the colony pours out
    const mw = randInt(r, 92, 112), mx = randInt(r, 250, 390 - mw / 2);
    const mound = mkPlat(mx, gTop - 16, mw, 16, 'mound', { dyn: true, rising: true }); P.push(mound);
    L.mound = mound;
    reserved.push({ x: mx - 30, y: 150, w: mw + 60, h: gTop - 150 });   // keep the space above the nest clear
    tryPlace(() => { const w = randInt(r, 70, 120); return mkPlat(xIn(w, 30, 610), randInt(r, 52, 120), w, randInt(r, 12, 14), 'sandstone'); }, 3);
    tryPlace(() => { const w = randInt(r, 60, 100); return mkPlat(xIn(w, 30, 610), randInt(r, 132, 200), w, randInt(r, 12, 14), 'sandstone'); }, 2);
    tryPlace(() => { const w = randInt(r, 40, 64), h = randInt(r, 26, 44); const c = mkPlat(xIn(w, 60, 580), gTop - h, w, h, 'drock', { buriable: true }); c.touch = [ground]; return c; }, 2);
    tryPlace(() => { const w = randInt(r, 64, 90); const c = mkPlat(16, randInt(r, 140, 210), w, 12, 'sandstone'); c.touch = [P[1]]; return c; }, 1);
    tryPlace(() => { const w = randInt(r, 64, 90); const c = mkPlat(624 - w, randInt(r, 140, 210), w, 12, 'sandstone'); c.touch = [P[2]]; return c; }, 1);
    L.enemySpawn = { x: mx + mw / 2, y: gTop - 18 };
  }
  // Guarantee at least two high anchors for rope swinging
  let high = P.filter(p => !frame.includes(p) && p.y < 160 && !p.move).length;
  for (let t = 0; t < 60 && high < 2; t++) {
    const w = randInt(r, 60, 100);
    const type = ['ledge', 'leaf', 'drift', 'plank', 'girder', 'sandstone'][biomeIdx];
    const c = mkPlat(xIn(w, 100, 540), randInt(r, 60, 150), w, 10, type);
    if (fits(c, P, null, M, reserved)) { P.push(c); high++; }
  }
  // Spawn points (on the ground / plateau surface)
  L.spawns = spawnXs.map(x => ({ x, y: gTop - 9 }));
  if (L.movers) for (const m of L.movers) { m.bx = m.x; m.by = m.y; }
  // Decorative extras
  const dr = rng(seed ^ 0xABCDEF);
  if (biomeIdx === 3) for (let x = -20; x < 340; x += 4 + Math.floor(dr() * 5)) L.decor.push({ k: 'wheat', x, h: 18 + Math.floor(dr() * 22), ph: dr() * TAU });
  if (biomeIdx === 5) { for (let i = 0; i < 260; i++) L.decor.push({ k: 'grain', x: -60 + dr() * 760, y: 150 + dr() * 260, c: dr() < 0.5 ? '#c99a5a' : '#f6e0a8' }); }
  if (biomeIdx === 4) for (let i = 0; i < 5; i++) L.decor.push({ k: 'lamp', x: 60 + i * 130 + Math.floor(dr() * 30), len: 8 + Math.floor(dr() * 14) });
  if (biomeIdx === 2) for (let i = 0; i < 6; i++) L.decor.push({ k: 'shell', x: 110 + dr() * 420, c: pick(dr, ['#ffb3c1', '#fff3d6', '#ffd29a']) });
  return L;
}

/* =====================================================================
   ART: cached sky + scene layers per level, rebuilt on resize
   ===================================================================== */
const ART = { sky: null, scene: null, clouds: [], cloudSprites: [], level: null, bw: 0, bh: 0 };

function buildLevelArt(L) {
  ART.level = L; ART.bw = BW; ART.bh = BH;
  const B = L.B;
  /* ---- Sky ---- */
  ART.sky = makeCanvas(BW, BH);
  let g = ART.sky.getContext('2d');
  if (L.biome === 4) { drawFactoryBackdrop(g, L); ART.clouds = []; ART.cloudSprites = []; }
  else {
  const horizon = OY + (L.biome === 2 ? 240 : 290), bandH = Math.ceil(horizon / B.sky.length);
  B.sky.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, i * bandH, BW, bandH + 1); });
  g.fillStyle = B.sky[B.sky.length - 1]; g.fillRect(0, horizon, BW, BH);
  // sun
  const sx = OX + (L.biome === 3 ? 140 : 470), sy = OY + (L.biome === 3 ? 230 : 46), sr = L.biome === 3 ? 26 : 14;
  g.globalAlpha = 0.22; pxCircle(g, sx, sy, sr * 1.9, '#fff6c2');
  g.globalAlpha = 0.4; pxCircle(g, sx, sy, sr * 1.4, '#fff6c2');
  g.globalAlpha = 1; pxCircle(g, sx, sy, sr, B.sun); pxCircle(g, sx - sr * 0.25, sy - sr * 0.25, sr * 0.55, '#fff3c0');
  if (L.biome === 3) { // sunset bands across the sun
    g.fillStyle = B.sky[5]; for (let i = 0; i < 4; i++) g.fillRect(sx - sr - 2, sy + 4 + i * 6, sr * 2 + 4, 2);
  }
  if (L.biome === 2) { // sea horizon
    const sh = OY + 238;
    g.fillStyle = B.near[0]; g.fillRect(0, sh, BW, BH - sh);
    g.fillStyle = B.near[1]; for (let y = sh + 6; y < BH; y += 9) g.fillRect(0, y, BW, 2);
    // distant islands
    const ir = rng(L.seed ^ 77);
    for (let i = 0; i < 3; i++) {
      const ix = OX + ir() * REF_W, iw = 40 + ir() * 60;
      pxEllipse(g, ix, sh, iw, 9 + ir() * 6, B.far[0]);
      pxEllipse(g, ix - 6, sh - 3, iw * 0.6, 6, B.far[1]);
    }
    g.fillStyle = '#ffffff';
    for (let i = 0; i < 40; i++) g.fillRect(Math.floor(ir() * BW), sh + 3 + Math.floor(ir() * (BH - sh)), 2, 1);
  }
  /* ---- Cloud sprites ---- */
  ART.cloudSprites = [];
  const cr = rng(7 + L.biome);
  const cloudTint = L.biome === 3 ? ['#e8a3b0', '#ffd6c2'] : ['#c6e3f5', '#ffffff'];
  for (let i = 0; i < 4; i++) {
    const w = 50 + Math.floor(cr() * 40), h = 26;
    const c = makeCanvas(w + 10, h + 6), cg = c.getContext('2d');
    const blobs = [];
    for (let b = 0; b < 5; b++) blobs.push([8 + cr() * (w - 16), 12 + cr() * 6, 6 + Math.floor(cr() * 7)]);
    blobs.forEach(([bx, by, br]) => pxCircle(cg, bx + 3, by + 3, br, cloudTint[0]));
    blobs.forEach(([bx, by, br]) => pxCircle(cg, bx + 3, by + 1, br, cloudTint[1]));
    ART.cloudSprites.push(c);
  }
  ART.clouds = [];
  const n = Math.max(4, Math.round(BW / 130));
  for (let i = 0; i < n; i++) ART.clouds.push({ x: cr() * BW, y: 8 + cr() * (OY + 110), spr: i % 4, spd: 3 + cr() * 6 });
  }

  /* ---- Scene: hills, structures, platforms ---- */
  ART.scene = makeCanvas(BW, BH);
  g = ART.scene.getContext('2d');
  g.save(); g.translate(OX, OY);
  const xL = -OX - 4, xR = BW - OX + 4;
  if (L.biome !== 2 && L.biome !== 4) {

    case 'mushroom': {

      g.fillStyle = '#c9b89c'; g.fillRect(x + w / 2 + 2, y + h, 2, GROUND_Y - y - h);

      g.fillStyle = '#ff7a7a'; g.fillRect(x + 6, y + 2, w / 3, 2);
      for (let i = 0; i < w / 10; i++) pxCircle(g, x + 6 + r() * (w - 12), y + 3 + r() * (h - 6), 1 + Math.floor(r() * 2), '#fff4e0');

      g.fillStyle = cols[0]; g.fillRect(x, y, w, h);
      g.fillStyle = cols[1]; g.fillRect(x, y, w, 2);
      g.fillStyle = cols[2]; g.fillRect(x, y + h - 2, w, 2);
      for (let i = 0; i < w / 7; i++) { g.fillStyle = cols[3]; g.fillRect(x + 2 + Math.floor(r() * (w - 8)), y + 3 + Math.floor(r() * Math.max(1, h - 5)), 4 + Math.floor(r() * 6), 1); }
      if (p.type !== 'drift') for (let xx = x + 3; xx < x + w - 2; xx += 22) { g.fillStyle = '#3a2a1a'; g.fillRect(xx, y + 3, 1, 1); g.fillRect(xx, y + h - 4, 1, 1); }
      else { g.fillStyle = '#5fae8a'; for (let xx = x + 4; xx < x + w - 4; xx += 9) if (r() < 0.5) g.fillRect(xx, y + h, 2, 2); }

      break;
    }
    case 'crate': {

      g.strokeStyle = '#6b4220'; g.lineWidth = 3; g.beginPath(); g.moveTo(x + 3, y + 3); g.lineTo(x + w - 3, y + h - 3); g.moveTo(x + w - 3, y + 3); g.lineTo(x + 3, y + h - 3); g.stroke();
      g.fillStyle = '#d09a5a'; g.fillRect(x + 2, y + 2, w - 4, 1);

    }
    case 'floor': {
      const x0 = -OX - 4, x1 = BW - OX + 4, y0 = p.y, y1 = BH - OY + 4;
      g.fillStyle = '#3a3f4c'; g.fillRect(x0, y0, x1 - x0, y1 - y0);
      for (let yy = y0 + 10; yy < y1; yy += 6) for (let xx = x0 + ((yy / 6) % 2) * 4; xx < x1; xx += 8) { g.fillStyle = '#4a505e'; g.fillRect(xx, yy, 3, 1); g.fillRect(xx + 1, yy + 1, 1, 1); }
      g.fillStyle = '#5c6270'; g.fillRect(x0, y0, x1 - x0, 6); g.fillStyle = '#8a92a2'; g.fillRect(x0, y0, x1 - x0, 1);

      for (let yy = 60; yy < 300; yy += 90) { g.fillStyle = '#ffd23f'; for (let i = 0; i < 4; i++) g.fillRect(left ? edge - 10 + i * 2 : edge + 4 + i * 2, yy + i * 3, 2, 3); }
      break;
    }
    case 'ceiling': {
      const x0 = -OX - 4, x1 = BW - OX + 4, yb = y + h;
      g.fillStyle = '#23252e'; g.fillRect(x0, -OY - 4, x1 - x0, yb + OY + 4);
      g.fillStyle = '#3a3f4c'; g.fillRect(x0, yb - 6, x1 - x0, 6); g.fillStyle = '#5c6270'; g.fillRect(x0, yb - 2, x1 - x0, 2);

    case 'sandstone': case 'drock': {

      g.fillStyle = rock ? '#c99a6a' : '#e8b27a'; g.fillRect(x + 3, y + 1, w - 6, 2);
      for (let yy = y + 5; yy < y + h - 3; yy += 4) { g.fillStyle = '#a8663a'; g.fillRect(x + 2, yy, w - 4, 1); }
      for (let i = 0; i < w * h / 40; i++) { g.fillStyle = r() < 0.5 ? '#8a4e2a' : '#f0c890'; g.fillRect(x + 2 + Math.floor(r() * (w - 4)), y + 3 + Math.floor(r() * Math.max(1, h - 5)), 1, 1); }
      g.fillStyle = '#f2d9a0'; g.fillRect(x + 4, y - 1, w - 8, 1);
      if (!rock) for (let xx = x + 5; xx < x + w - 4; xx += 7 + Math.floor(r() * 6)) { g.fillStyle = '#8a4e2a'; g.fillRect(xx, y + h, 1, 1 + Math.floor(r() * 4)); }

    }
    case 'girder': {
      g.fillStyle = '#8a3418'; g.fillRect(x, y, w, h);
      g.fillStyle = '#c8502a'; g.fillRect(x, y, w, h - 2);
      g.fillStyle = '#e8743c'; g.fillRect(x, y, w, 2);
      g.fillStyle = '#a8401f'; g.fillRect(x, y + 4, w, 1);

}

/* ---------- Per-frame animated environment pieces ---------- */
function drawWater(L, t) {
  if (!L.water) return;
  const wy = L.water.y, x0 = -OX - 4, x1 = BW - OX + 4, y1 = BH - OY + 4;
  ctx.fillStyle = '#1f6fb8'; ctx.fillRect(x0, wy + 3, x1 - x0, y1 - wy);
  ctx.fillStyle = '#185a99';
  for (let y = wy + 12; y < y1; y += 10) ctx.fillRect(x0, y, x1 - x0, 3);
  for (let x = Math.floor(x0 / 2) * 2; x < x1; x += 2) {
    const h = Math.round(Math.sin(x * 0.08 + t * 2.4) * 1.5 + Math.sin(x * 0.031 - t * 1.3) * 1.5);
    ctx.fillStyle = '#3b97d9'; ctx.fillRect(x, wy + h, 2, 6);
    ctx.fillStyle = '#9ad8ff'; ctx.fillRect(x, wy + h, 2, 1);
  }
  // foam where the plateau meets the sea
  for (const p of L.plats) if (p.type === 'sand') {
    for (const ex of [p.x - 6, p.x + p.w]) { for (let i = 0; i < 6; i++) { const fx = ex + Math.round(Math.sin(t * 3 + i) * 2) + i, fy = wy - 1 + (i % 2); ctx.fillStyle = '#ffffff'; ctx.fillRect(fx, fy, 2, 1); } }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 12; i++) { const sx = ((i * 97 + t * 14) % (x1 - x0)) + x0, sy = wy + 8 + (i * 37) % Math.max(1, y1 - wy - 10); if (Math.sin(t * 4 + i * 2) > 0.6) ctx.fillRect(Math.round(sx), Math.round(sy), 2, 1); }
}
function drawWheat(L, t, front) {
  for (const d of L.decor) {
    if (d.k !== 'wheat') continue;
    if ((d.x % 3 === 0) !== front) continue;
    const sway = Math.sin(t * 1.6 + d.ph + d.x * 0.03) * 2.5;
    const bx = d.x, by = GROUND_Y + (front ? 2 : 0);
    ctx.fillStyle = front ? '#b8862a' : '#a87420';
    for (let i = 0; i < d.h; i++) ctx.fillRect(Math.round(bx + sway * i / d.h), by - i, 1, 1);
    const hx = Math.round(bx + sway), hy = by - d.h;
    ctx.fillStyle = front ? '#f0cf6a' : '#d6a540';
    for (let i = 0; i < 6; i++) { ctx.fillRect(hx - 1, hy - i * 2, 1, 2); ctx.fillRect(hx + 1, hy - i * 2 - 1, 1, 2); }
    ctx.fillRect(hx, hy - 13, 1, 3);
  }
}

/* ---------- Factory (level 5) art ---------- */
function drawFactoryBackdrop(g, L) {
  g.fillStyle = '#1c1a28'; g.fillRect(0, 0, BW, BH);
  g.save(); g.translate(OX, OY);

  // dark brick back wall
  for (let yy = Math.floor(y0 / 8) * 8, row = 0; yy < y1; yy += 8, row++) {
    for (let xx = Math.floor(x0 / 16) * 16 - (row % 2) * 8; xx < x1; xx += 16) {
      g.fillStyle = ((xx * 7 + yy * 3) & 31) < 6 ? '#2e2a3c' : '#28243a'; g.fillRect(xx, yy, 15, 7);
    }
  }
  // tall factory windows with cool light
  const wr = rng(L.seed ^ 31);
  for (let i = 0; i < 4; i++) {
    const wx = 40 + i * 156 + Math.floor(wr() * 20), wy = 34, ww = 64, wh = 104;
    g.fillStyle = '#14121c'; g.fillRect(wx - 3, wy - 3, ww + 6, wh + 6);
    g.fillStyle = '#3b4f78'; g.fillRect(wx, wy, ww, wh);
    g.fillStyle = '#4c6494'; g.fillRect(wx, wy, ww, wh / 2);
    g.fillStyle = '#14121c'; for (let k = 1; k < 4; k++) g.fillRect(wx + k * 16, wy, 2, wh); for (let k = 1; k < 5; k++) g.fillRect(wx, wy + k * 21, ww, 2);
    g.fillStyle = 'rgba(200,220,255,0.18)'; for (let k = 0; k < 6; k++) g.fillRect(wx + 4 + k * 9, wy + 4 + k * 12, 8, 2);
    if (wr() < 0.6) { g.fillStyle = '#1c1a28'; g.fillRect(wx + 16 * Math.floor(wr() * 4) + 2, wy + 21 * Math.floor(wr() * 5) + 2, 14, 19); }
    g.globalAlpha = 0.07; g.fillStyle = '#9ad0ff';
    g.beginPath(); g.moveTo(wx, wy + wh); g.lineTo(wx + ww, wy + wh); g.lineTo(wx + ww + 60, 320); g.lineTo(wx + 30, 320); g.closePath(); g.fill();
    g.globalAlpha = 1;
  }
  // pipes along the wall
  for (const [py, c1, c2] of [[262, '#4a5a6a', '#7a8ea2'], [284, '#5a4a3a', '#9a7a5a']]) {
    g.fillStyle = c1; g.fillRect(x0, py, x1 - x0, 7); g.fillStyle = c2; g.fillRect(x0, py + 1, x1 - x0, 2);
    for (let xx = Math.floor(x0 / 70) * 70 + 20; xx < x1; xx += 70) { g.fillStyle = '#2a2d36'; g.fillRect(xx, py - 1, 4, 9); }
  }
  for (const px of [180, 470]) { g.fillStyle = '#4a5a6a'; g.fillRect(px, 140, 7, 122); g.fillStyle = '#7a8ea2'; g.fillRect(px + 1, 140, 2, 122); pxCircle(g, px + 3, 156, 6, '#5c6270'); pxCircle(g, px + 3, 156, 3, '#c43a3a'); }
  g.restore();
}
/* Lamps hanging from the ceiling and the tracks the lifts ride on (cached with the scene) */
function drawFactoryFixtures(g, L) {
  for (const d of L.decor) if (d.k === 'lamp') {
    g.fillStyle = '#1a1a22'; g.fillRect(d.x, 16, 1, d.len);
    const ly = 16 + d.len;
    g.fillStyle = '#5c6270'; g.fillRect(d.x - 5, ly, 11, 3); g.fillRect(d.x - 3, ly - 2, 7, 2);
    g.fillStyle = '#fff3c0'; g.fillRect(d.x - 2, ly + 3, 5, 2);
    g.globalAlpha = 0.06; g.fillStyle = '#ffe9a0';
    g.beginPath(); g.moveTo(d.x - 4, ly + 4); g.lineTo(d.x + 5, ly + 4); g.lineTo(d.x + 40, 320); g.lineTo(d.x - 40, 320); g.closePath(); g.fill();
    g.globalAlpha = 1;
  }
  for (const m of L.movers || []) {
    const mv = m.move;
    if (m.axis === 'x') {   // ceiling rail
      g.fillStyle = '#2a2d36'; g.fillRect(mv.x0 + m.w / 2 - 6, 16, mv.x1 - mv.x0 + 12, 4);
      g.fillStyle = '#7a8090'; g.fillRect(mv.x0 + m.w / 2 - 6, 17, mv.x1 - mv.x0 + 12, 1);
    } else {                // elevator guide rails down to the floor
      for (const gx of [m.x - 3, m.x + m.w + 1]) { g.fillStyle = '#2a2d36'; g.fillRect(gx, mv.y0 - 10, 2, GROUND_Y - mv.y0 + 10); g.fillStyle = '#5c6270'; g.fillRect(gx, mv.y0 - 10, 1, GROUND_Y - mv.y0 + 10); }
    }
  }

}
/* Animated pieces: gears behind the scene, then lifts + conveyors drawn every frame */
function drawFactoryGears(t) {
  for (const [gx, gy, rr, sp] of [[110, 210, 34, 0.4], [168, 176, 18, -0.75], [560, 200, 40, -0.3]]) drawGearShape(ctx, gx, gy, rr, t * sp, '#24212f', '#2c2838');
}
function drawGearShape(g, cx, cy, rr, ang, c1, c2) {
  const teeth = Math.max(8, Math.round(rr / 3.5));
  g.fillStyle = c1; g.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const a = ang + i * Math.PI / teeth, R = i % 2 ? rr : rr + 5;
    const a2 = a + Math.PI / teeth;
    g.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); g.lineTo(cx + Math.cos(a2 - 0.08) * R, cy + Math.sin(a2 - 0.08) * R);
  }
  g.closePath(); g.fill();
  pxCircle(g, cx, cy, rr * 0.62, c2); pxCircle(g, cx, cy, rr * 0.22, c1);
  g.fillStyle = c1; for (let k = 0; k < 4; k++) { const a = ang + k * Math.PI / 2; g.fillRect(Math.round(cx + Math.cos(a) * rr * 0.42) - 2, Math.round(cy + Math.sin(a) * rr * 0.42) - 2, 4, 4); }
}
function drawDynPlatform(p, t) {

    else { ctx.fillStyle = '#2a2d36'; ctx.fillRect(x + w / 2 - 3, y + h, 6, GROUND_Y - y - h); ctx.fillStyle = '#9aa2b0'; ctx.fillRect(x + w / 2 - 2, y + h, 2, GROUND_Y - y - h); }
    ctx.fillStyle = '#2a2d36'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#8a94a4'; ctx.fillRect(x + 1, y, w - 2, h - 2);
    ctx.fillStyle = '#c4ccd8'; ctx.fillRect(x + 1, y, w - 2, 2);
    for (let xx = x + 2; xx < x + w - 2; xx += 8) { ctx.fillStyle = '#ffd23f'; ctx.fillRect(xx, y + 4, 4, h - 6); ctx.fillStyle = '#1a1a1a'; ctx.fillRect(xx + 4, y + 4, 4, h - 6); }
    ctx.fillStyle = Math.sin(t * 6) > 0 ? '#ff5a3a' : '#7a2a1a'; ctx.fillRect(x + 2, y + 1, 2, 1); ctx.fillRect(x + w - 4, y + 1, 2, 1);
    return;
  }
  if (p.type === 'conveyor') {
    const rr = h / 2, off = ((t * p.belt) % 8 + 8) % 8;
    ctx.fillStyle = '#2a2d36'; ctx.fillRect(x - 1, y, w + 2, h);
    ctx.fillStyle = '#16171c'; ctx.fillRect(x + 2, y, w - 4, 3); ctx.fillRect(x + 2, y + h - 3, w - 4, 3);
    ctx.fillStyle = '#5c6270'; ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
    for (let xx = x + 3 + off; xx < x + w - 3; xx += 8) { ctx.fillStyle = '#4a4e58'; ctx.fillRect(Math.round(xx), y, 3, 3); }
    for (let xx = x + w - 3 - off; xx > x + 3; xx -= 8) { ctx.fillStyle = '#4a4e58'; ctx.fillRect(Math.round(xx) - 3, y + h - 3, 3, 3); }
    // direction arrows along the side
    const dir = Math.sign(p.belt);
    for (let xx = x + 12; xx < x + w - 12; xx += 22) { ctx.fillStyle = '#ffd23f'; for (let k = 0; k < 3; k++) ctx.fillRect(xx + dir * k, y + 4 + k, 1, h - 8 - k * 2); }
    for (const ex of [x + rr, x + w - rr]) {
      pxCircle(ctx, ex, y + rr, rr, '#8a94a4'); pxCircle(ctx, ex, y + rr, rr - 2, '#3a3f4c');
      const a = t * p.belt / rr; ctx.fillStyle = '#c4ccd8'; ctx.fillRect(Math.round(ex + Math.cos(a) * (rr - 3)), Math.round(y + rr + Math.sin(a) * (rr - 3)), 1, 1);
    }
  }
}
/* Move lifts to where they are at time t; carry ropes anchored to them */
function updateMovers(L, t) {
  if (!L.movers) return;
  for (const p of L.movers) {
    const m = p.move, k = 0.5 - 0.5 * Math.cos(TAU * (t / m.period + m.phase));
    const nx = m.x0 + (m.x1 - m.x0) * k, ny = m.y0 + (m.y1 - m.y0) * k;
    p.dx = nx - p.x; p.dy = ny - p.y; p.x = nx; p.y = ny;
  }
}

/* ---------- Desert (level 6): rising sand + the ant hill ---------- */
function drawRisingSand(p, t) {
  const L = ART.level, x0 = -OX - 4, x1 = BW - OX + 4, y0 = Math.round(p.y), y1 = BH - OY + 4;
  ctx.fillStyle = '#d9a866'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  ctx.fillStyle = '#c99a5a'; for (let yy = y0 + 14; yy < y1; yy += 12) ctx.fillRect(x0, yy, x1 - x0, 2);
  if (L) for (const d of L.decor) if (d.k === 'grain' && d.y > y0 + 4) { ctx.fillStyle = d.c; ctx.fillRect(Math.round(d.x), Math.round(d.y), 2, 1); }
  // rippled top edge, drifting slowly
  for (let x = Math.floor(x0 / 2) * 2; x < x1; x += 2) {
    const hh = Math.round(Math.sin(x * 0.05 + t * 0.6) * 1.2 + Math.sin(x * 0.013) * 1.5);
    ctx.fillStyle = '#f2d9a0'; ctx.fillRect(x, y0 - 1 + hh, 2, 3);
    ctx.fillStyle = '#fff0c8'; ctx.fillRect(x, y0 - 1 + hh, 2, 1);
  }
}
function drawMound(p, t) {
  const x = p.x, y = p.y, w = p.w, h = p.h, cx = x + w / 2, burst = p.burstT || 0;
  const sh = burst > 0 ? Math.round(Math.sin(t * 50) * Math.min(2, burst)) : (p.tremble ? Math.round(Math.sin(t * 40)) : 0);
  // hill: stacked rows narrowing to the top, wider than the collision box at the base
  for (let i = 0; i < h + 6; i++) {
    const k = i / (h + 6), half = (w / 2 + 14) * (0.35 + 0.65 * k);
    ctx.fillStyle = i < 2 ? '#e8b27a' : i % 4 === 0 ? '#b8834a' : '#c99560';
    ctx.fillRect(Math.round(cx - half + sh), Math.round(y + i), Math.round(half * 2), 1);
  }
  for (let i = 0; i < 18; i++) { const a = (i * 2.4) % 1, b = (i * 0.37) % 1; ctx.fillStyle = i % 2 ? '#a8733e' : '#e2b27a'; ctx.fillRect(Math.round(cx + (a - 0.5) * w * 0.9 + sh), Math.round(y + 3 + b * h), 2, 1); }
  // the nest hole
  const hr = burst > 0 || p.open ? 9 : 6;
  pxEllipse(ctx, cx + sh, y + 1, hr + 2, 3, '#8a5a2a');
  pxEllipse(ctx, cx + sh, y + 1, hr, 2, '#1a0e06');
}

];

function drawGear(g, cx, cy, r, teeth, rot, color, hole) {
  g.save(); g.translate(cx, cy); g.rotate(rot); g.fillStyle = color;
  for (let i = 0; i < teeth; i++) { g.save(); g.rotate(i * TAU / teeth); g.fillRect(-r * 0.24, -r * 1.3, r * 0.48, r * 0.6); g.restore(); }
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
  g.fillStyle = hole; g.beginPath(); g.arc(0, 0, r * 0.4, 0, TAU); g.fill();
  g.restore();
}
function drawStarShape(g, x, y, r, color, rot = 0) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath(); g.fillStyle = color; g.fill();
}
function drawCocoon(g, w, h) {
  g.globalAlpha = 0.85;
  pxEllipse(g, 0, -1, w, h, 'rgba(235,245,255,0.55)');
  g.strokeStyle = '#ffffff'; g.lineWidth = 1;
  g.beginPath();
  for (let i = -w; i <= w; i += 4) { g.moveTo(i, -h); g.lineTo(i + 5, h); g.moveTo(i + 4, -h); g.lineTo(i - 1, h); }
  g.moveTo(-w - 1, -1); g.lineTo(w + 2, -2);
  g.stroke();
  g.globalAlpha = 1;
}

/* ---------- Spider (player / bots / remote players) ---------- */
function drawSpider(x, y, angle, facing, phase, o = {}) {
  const st = o.style || { c: 0, h: 0, p: 0 };
  const P = SPIDER_COLORS[st.c % SPIDER_COLORS.length];
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.rotate(angle);
  ctx.scale(facing * (o.scale || 1), o.scale || 1);
  if (o.powered) { ctx.globalAlpha = 0.22 + 0.14 * Math.sin(T * 8); pxCircle(ctx, 0, 0, 11, '#ffd23f'); ctx.globalAlpha = 1; }
  if (o.slowed) { ctx.globalAlpha = 0.35; pxCircle(ctx, 0, 0, 10, '#9ad0ff'); ctx.globalAlpha = 1; }
  const hips = [[-4, 0], [-1.5, 1], [1, 1], [3, 0]];
  const feet = [[-11, 8], [-5, 8], [4, 8], [10, 8]];
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    ctx.strokeStyle = layer === 0 ? P.leg : P.leg2;
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 4; i++) {
      const ph = phase + i * 1.6 + layer * Math.PI;
      let fx, fy;
      if (o.air) { fx = feet[i][0] * 1.05 + Math.sin(T * 18 + i + layer) * 1.2; fy = 5 + (i % 2) * 2; }
      else { fx = feet[i][0] + Math.sin(ph) * 2.2 + (layer ? 1 : -1); fy = feet[i][1] - Math.max(0, Math.cos(ph)) * 2.5; }
      const hx = hips[i][0], hy = hips[i][1];
      const kx = (hx + fx) / 2 + (fx >= 0 ? 1.5 : -1.5), ky = -6 + (layer ? 0 : 1);
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    }
  }
  // abdomen
  pxEllipse(ctx, -3.5, -1, 6, 5, P.dark);
  pxEllipse(ctx, -3.5, -1.5, 5, 4, P.body);
  // pattern accents
  ctx.fillStyle = P.light;
  if (st.p === 1) { ctx.fillRect(-7, -3, 1, 4); ctx.fillRect(-5, -4, 1, 6); ctx.fillRect(-1, -4, 1, 6); }
  else if (st.p === 2) { ctx.fillRect(-7, -2, 2, 2); ctx.fillRect(-2, -4, 2, 2); ctx.fillRect(-3, 1, 2, 1); }
  else if (st.p === 3) { ctx.fillStyle = '#ffe45c'; ctx.fillRect(-6, -4, 2, 2); ctx.fillRect(-5, -2, 2, 1); ctx.fillRect(-4, -1, 2, 2); ctx.fillRect(-3, 1, 1, 2); }
  else if (st.p === 4) { drawStarShape(ctx, -6, -1, 2.5, '#fff3a0', 0); }

  ctx.fillStyle = P.light; ctx.fillRect(3, -2, 2, 1);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(4, -2, 2, 2); ctx.fillRect(6, -1.5, 2, 2);
  ctx.fillStyle = o.powered ? '#ff3355' : '#120b20'; ctx.fillRect(5, -1, 1, 1); ctx.fillRect(7, -0.5, 1, 1);
  ctx.fillStyle = '#ffe7f0'; ctx.fillRect(6, 2.5, 1, 1.5); ctx.fillRect(5, 3, 1, 1);
  drawHat(st.h, P);

}

    case 2: ctx.fillStyle = '#ff5a9a'; ctx.fillRect(3, -4, 3, 1); ctx.fillRect(3, -5, 2, 1); ctx.fillRect(4, -6, 1, 1); ctx.fillStyle = '#ffe45c'; ctx.fillRect(4, -7, 1, 1); ctx.fillRect(3, -5, 1, 1); break;

/* ---------- Lizard ---------- */
function drawLizard(x, y, angle, facing, phase, headRot, o = {}) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(angle); ctx.scale(facing, 1);
  if (o.shiver) ctx.translate(Math.sin(T * 60) * 0.8, 0);
  const body = o.flash ? '#ff7a6a' : '#4fb944', dark = '#2f7f2b', belly = '#c9ec6d', spot = '#2a6a25';
  const legs = [[6, 0], [-6, 1]];

  for (let i = 0; i <= 12; i++) { const t = i / 12; pxCircle(ctx, -8 - t * 22, 1 + Math.sin(T * 2.5 + t * 3) * t * 2.2 + t * 1.5, Math.max(1, Math.round(3.3 * (1 - t) + 0.6)), i % 3 === 0 ? spot : body); }

  ctx.fillStyle = spot; ctx.fillRect(-5, -2, 2, 1); ctx.fillRect(0, -3, 2, 1); ctx.fillRect(4, -2, 2, 1);

  legs.forEach(([lx], i) => { const off = o.air ? -1 : Math.sin(phase * 0.35 + i * Math.PI) * 2; ctx.fillStyle = body; ctx.fillRect(lx - 1 + off * 0.5, 1, 3, 4); ctx.fillStyle = dark; ctx.fillRect(lx - 2 + off, 5, 5, 1); });
  ctx.save(); ctx.translate(8, -1); ctx.rotate(headRot);

/* ---------- Gecko (fast, sticky toe pads, 360 climber) ---------- */
function drawGecko(x, y, angle, facing, phase, headRot, o = {}) {
  ctx.save();

/* ---------- Black Widow (boss) ---------- */
function drawWidow(x, y, angle, facing, phase, o = {}) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(angle); ctx.scale(facing, 1);
  if (o.shiver) ctx.translate(Math.sin(T * 60) * 1, 0);

/* ---------- Bee ---------- */
function drawBee(x, y, facing, o = {}) {

/* ---------- Beehive ---------- */
function drawHive(x, y, o = {}) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y));

  for (const [ry, rw] of rings) { ctx.fillStyle = '#8a5418'; ctx.fillRect(-rw + 2, ry + 3, rw * 2 - 4, 1); }

/* ---------- Glowing red heart butterfly ---------- */
function drawButterfly(x, y, seed, fade = 1) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(1.1, 1.1);

  ctx.fillStyle = '#ffb3c1';

/* ---------- Golden fly ---------- */
function drawFly(x, y, o = {}) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y));

  ctx.fillStyle = '#7a1f1f'; ctx.fillRect(2, -1, 1, 1);

}
function drawStarCoin(x, y, s = 1) {
  ctx.globalAlpha = 0.35 + 0.2 * Math.sin(T * 6);

function drawHeart(x, y, s, filled) {
  const rows = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
  for (let ry = 0; ry < rows.length; ry++) for (let rx = 0; rx < 7; rx++) {

/* ---------- Fire flame (HELL MODE) ---------- */
function drawFlame(x, y, size, seed) {
  const f = Math.floor(T * 12 + seed * 7) % 3;
  const h = size * (1 + f * 0.15), w = size * 0.6;

  ctx.restore();

/* =====================================================================
   60_ENTITIES - spider physics & ropes, web shots, flies, enemies, fire
   ===================================================================== */

/* ---------- Spider movement tuning (Mario-like accel / decel) ---------- */
const SP = {
  R: 8, WALK: 96, SPRINT: 168, SPRINT_DELAY: 0.32, SPRINT_RAMP: 0.5,
  ACC: 560, TURN: 1250, FRIC: 380,               // surface accel, reverse-brake, release slide
  AIR_MAX: 150, AIR_ACC: 470, AIR_DRAG: 110,     // air control
  JUMP: 292, MAX_FALL: 480,
  WEB_SPEED: 680, WEB_RANGE: 250, WEB_CD: 0.26,
  ROPE_MAX: 250, ROPE_MIN: 14, ROPE_K: 95, ROPE_DAMP: 7, ROPE_REEL: 46, ROPE_REEL_FAST: 120, ROPE_PUMP: 330,
};

/* ---------- Particles & floating text ---------- */
function burst(W, x, y, n, colors, spd = 80, life = 0.6, grav = 200, size = 2) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = spd * (0.3 + Math.random() * 0.7);
    W.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.4), max: life, color: colors[Math.floor(Math.random() * colors.length)], size, grav });
  }
  if (W.particles.length > 600) W.particles.splice(0, W.particles.length - 600);
}
function floater(W, x, y, text, color = '#ffffff') { W.floaters.push({ x, y, text, color, life: 1.2 }); }

/* =====================================================================
   SPIDER BODY - the physics character used by the local player and bots
   ===================================================================== */
class SpiderBody {

    this.style = opts.style || { c: 0, h: 0, p: 0 };
    this.team = opts.team !== undefined ? opts.team : this.slot;
    this.isBot = !!opts.bot; this.local = true;
    this.r = SP.R; this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.state = 'air'; this.plat = null; this.s = 0; this.sv = 0; this.nx = 0; this.ny = -1;
    this.facing = opts.facing || 1; this.drawAngle = 0; this.walkPhase = 0; this.gear = 0;
    this.holdT = 0; this.holdSign = 0; this.lockDir = null; this.lockSign = 1;
    this.noStickPlat = null; this.noStickT = 0;
    this.rope = null; this.webCD = 0;
    this.maxHp = opts.hp || 3; this.hp = this.maxHp; this.alive = true; this.deadT = 0;
    this.invuln = 1.0; this.frozenT = 0; this.slowT = 0; this.stunT = 0; this.pauseT = 0;
    this.flies = 0; this.sh = 0; this.lastShot = { x, y, a: 0 };
    this.dmg = {}; this.bites = {}; this.killedBy = -1; this.cause = '';
    const hit = findCollision(x, y + 4, this.r + 6, null);
    if (hit) { attachTo(this, hit); this.state = 'stuck'; }
  }
  get powered() { return this.flies >= 5; }

  update(dt, c, W) {

    this.invuln = Math.max(0, this.invuln - dt);

    this.pauseT = Math.max(0, this.pauseT - dt);

    if (this.frozenT > 0) { this.frozenT -= dt; if (c.mash) { this.frozenT -= 0.1 * c.mash; SFX.play('mash'); } if (this.frozenT <= 0) { this.frozenT = 0; SFX.play('free'); burst(W, this.x, this.y, 10, ['#ffffff'], 70, 0.4); } }

    if (this.state === 'stuck') this.updateStuck(dt, ctl, W, speedMul, lock);
    if (this.state === 'air') this.updateAir(dt, ctl, W, speedMul);
    else if (this.state === 'rope') this.updateRope(dt, ctl, W);

    let target = 0;

    else if (this.state === 'rope' && this.rope) target = Math.atan2(this.rope.ay - this.y, this.rope.ax - this.x) + Math.PI / 2;
    else target = clamp(this.vx * 0.002, -0.3, 0.3);

  }

  updateStuck(dt, c, W, speedMul, lock) {
    const mx = c.mx, my = c.my, mag = Math.hypot(mx, my);

    syncStuck(this);
    if (c.jump && !lock) this.jump(c, W);
  }

  updateAir(dt, c, W, speedMul) {
    const max = SP.AIR_MAX * speedMul;
    if (Math.abs(c.mx) > 0.15) {
      const target = c.mx * max;
      // never bleed off momentum faster than max from a sprint-jump / swing release
      if (!(Math.abs(this.vx) > max && Math.sign(this.vx) === Math.sign(c.mx))) this.vx = approach(this.vx, target, SP.AIR_ACC * dt);
      else this.vx = approach(this.vx, target, SP.AIR_DRAG * 0.5 * dt);
    } else this.vx = approach(this.vx, 0, SP.AIR_DRAG * dt);
    this.vy = Math.min(this.vy + G * dt, SP.MAX_FALL);
    const hit = this.fly(dt);
    if (hit) this.land(hit, W);
    else if (Math.abs(this.vx) > 10) this.facing = this.vx > 0 ? 1 : -1;
  }

  updateRope(dt, c, W) {
    const R = this.rope;
    if (c.jump) { // jump off the end of the rope, keeping momentum
      this.state = 'air'; this.rope = null; this.vy -= 70; this.noStickT = 0.08; SFX.play('release');

    R.blockT = blocked ? R.blockT + dt : 0;
    if (R.blockT > 0.12) { this.state = 'air'; this.rope = null; SFX.play('snap'); burst(W, this.x, this.y, 5, ['#ffffff'], 50, 0.3, 80, 1); }
    if (Math.abs(this.vx) > 15) this.facing = this.vx > 0 ? 1 : -1;
  }

  fly(dt) {
    const steps = Math.max(1, Math.ceil(Math.hypot(this.vx, this.vy) * dt / 3)), sdt = dt / steps;

    else if (this.ny > 0.5) { this.detach(t.x * sv + c.mx * 40, 50); SFX.play('drop'); }

  }
  attachRope(ax, ay, plat) {

  shoot(c, W) {

    W.webs.push(new WebShot(W, this, this.x, this.y, a.x, a.y, { owner: this }));
    if (Math.abs(a.x) > 0.2 && this.state !== 'stuck') this.facing = a.x > 0 ? 1 : -1;

  applyHurt(kind, src, W) {

    if (this.state === 'chase' && t && dist(this.x, this.y, t.x, t.y) < t.r + 7) {
      W.hurt(t, 'sting', this);
      const a = Math.atan2(this.y - t.y, this.x - t.x);
      this.vx = Math.cos(a) * 150; this.vy = Math.sin(a) * 150 - 40;
      this.state = 'retreat'; this.stateT = 0.7;
    }
    // HELL: occasional fireball
    if (D.hell && this.state === 'chase' && t) {
      this.fireCD -= dt;
      if (this.fireCD <= 0 && dist(this.x, this.y, t.x, t.y) < 160) {
        this.fireCD = 4 + Math.random() * 3;
        const a = Math.atan2(t.y - this.y, t.x - this.x);
        W.enemyShots.push({ kind: 'fire', x: this.x, y: this.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, life: 1.0, src: this });
        SFX.play('ignite');

  draw(W) { if (this.alive) drawBee(this.x, this.y, this.facing, { falling: this.state === 'fall', hell: W.D.hell, angry: this.state === 'chase' }); }
}

/* =====================================================================
   FIRE SYSTEM (HELL MODE) - flames creep slowly along wooden platforms
   ===================================================================== */
class FireSystem {
  constructor() { this.nodes = []; }
  ignite(plat, x, y, W) {
    if (!plat || !plat.wood || this.nodes.length >= 70) return;
    const s = sFromPoint(plat, 3, x, y);
    this.add(plat, s, W);
  }
  add(plat, s, W) {
    const L = perimLen(plat, 3);
    s = ((s % L) + L) % L;
    let count = 0;
    for (const n of this.nodes) if (n.plat === plat) { count++; const ds = Math.abs(n.s - s); if (Math.min(ds, L - ds) < 7) return; }
    if (count >= 16) return;
    const p = perim(plat, 3, s);
    if (p.y < WORLD_TOP || p.y > REF_H) return;
    this.nodes.push({ plat, s, x: p.x, y: p.y, nx: p.nx, ny: p.ny, life: 9 + Math.random() * 4, spreadT: 1.2 + Math.random(), seed: Math.random() * 10 });
    if (W) SFX.play('ignite', 0.25);
  }
  update(dt, W) {
    for (let i = this.nodes.length - 1; i >= 0; i--) {
      const n = this.nodes[i];
      n.life -= dt; n.spreadT -= dt;
      if (n.life <= 0) { this.nodes.splice(i, 1); burst(W, n.x, n.y, 3, ['#555', '#888'], 20, 0.6, -30, 1); continue; }
      if (n.spreadT <= 0) { n.spreadT = 1.0 + Math.random() * 0.7; if (Math.random() < 0.75) this.add(n.plat, n.s + (Math.random() < 0.5 ? -9 : 9), W); }
      for (const t of W.targets()) if (dist(t.x, t.y, n.x - n.nx * 2, n.y - n.ny * 2) < t.r + 4) W.hurt(t, 'fire', n);
      if (Math.random() < dt * 3) W.particles.push({ x: n.x, y: n.y - 4, vx: (Math.random() - 0.5) * 10, vy: -30, life: 0.6, max: 0.6, color: '#ffb347', size: 1, grav: -20 });
    }
  }
  draw() {
    for (const n of this.nodes) {
      const sz = 5 + Math.min(1, n.life / 2) * 3;
      ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(Math.atan2(n.ny, n.nx) + Math.PI / 2);
      drawFlame(0, 2, sz, n.seed);
      ctx.restore();
    }
  }
}

/* =====================================================================
   REMOTE SPIDER - another player's spider, rendered ~130 ms in the past
   ===================================================================== */
const INTERP_DELAY = 130;
class RemoteSpider {
  constructor(id, slot) {
    this.id = id; this.slot = slot; this.local = false; this.isBot = false;
    this.buf = []; this.x = -100; this.y = -100; this.vx = 0; this.vy = 0; this.r = SP.R;
    this.a = 0; this.facing = 1; this.st = 'stuck'; this.alive = true; this.frozenT = 0; this.slowT = 0; this.stunT = 0;
    this.flies = 0; this.style = { c: slot % 6, h: 0, p: 0 }; this.name = 'P' + (slot + 1); this.team = slot;
    this.rope = null; this.walk = 0; this.gear = 0; this.lastRx = 0; this.hp = 3;
  }
  get powered() { return this.flies >= 5; }
  push(s, tRecv) {
    this.buf.push(Object.assign({ t: tRecv }, s));
    if (this.buf.length > 30) this.buf.shift();
    this.lastRx = tRecv;
  }
  update(dt) {
    const rt = nowMs() - INTERP_DELAY, b = this.buf;
    if (!b.length) return;
    let a = b[0], c = b[b.length - 1];
    for (let i = 0; i < b.length - 1; i++) if (b[i].t <= rt && b[i + 1].t >= rt) { a = b[i]; c = b[i + 1]; break; }
    let k = c.t > a.t ? clamp((rt - a.t) / (c.t - a.t), 0, 1) : 1;
    if (rt > c.t) { // extrapolate briefly
      const ex = Math.min(0.1, (rt - c.t) / 1000);
      a = c; k = 0; this.x = c.x + (c.vx || 0) * ex; this.y = c.y + (c.vy || 0) * ex;
    } else { this.x = lerp(a.x, c.x, k); this.y = lerp(a.y, c.y, k); }
    const src = k < 0.5 ? a : c;
    const ox = this.prevX === undefined ? this.x : this.prevX;
    this.walk += Math.abs(this.x - ox) * 0.45; this.prevX = this.x;
    this.vx = src.vx || 0; this.vy = src.vy || 0;
    this.a = a.a + angDiff(a.a, c.a) * k; this.facing = src.f || 1; this.st = src.st;
    this.alive = !!src.al; this.frozenT = src.frz || 0; this.slowT = src.slw || 0; this.stunT = src.stn || 0;
    this.rope = src.ra ? { ax: src.ra[0], ay: src.ra[1], len: dist(this.x, this.y, src.ra[0], src.ra[1]) } : null;
    this.gear += dt * 4;
  }
  draw() {
    if (this.x < -50) return;
    if (this.rope) drawRope(this.x, this.y, this.rope);
    drawSpider(this.x, this.y, this.alive ? this.a : this.a + T * 9, this.facing, this.walk, {
      air: this.st !== 'stuck', gear: this.gear, style: this.style, powered: this.powered && this.alive,
      frozen: this.frozenT > 0 || this.stunT > 0, slowed: this.slowT > 0,
    });
  }
}

/* ===== 65_longlegs.js ===== */
/* =====================================================================
   65_LONGLEGS - level 5 boss: a mechanical daddy long legs
   ---------------------------------------------------------------------
   Phase 1 (legs): the round body hovers on long telescoping legs that
   plant on any surface (floor, walls, ceiling, platforms) and re-plant as
   it travels, so it can cross the factory quickly. It stalks slowly and
   only chases and stabs with a leg when a spider gets close.
   To beat it: catch 5 flies, web a leg (it locks in place), then bite
   the leg to tear it off. Repeat for every leg.
   Phase 2 (ball): with no legs left the body drops and rolls, bounces
   and jumps at you. Web it, then bite it like any other creature.
   ===================================================================== */
const LL = { REACH: 230, HIP: 7, STRIKE_RANGE: 150, AGGRO: 120, BALL_R: 11 };

class LongLegs extends Enemy {

    this.relocT = 5; this.reloc = null; this.strikeCD = 2.5; this.fireCD = 4; this.eyeA = Math.PI;
    this.rot = 0; this.jumpCD = 1.5; this.grounded = false; this.debris = []; this.hurtCD = 0;

  findSpot(ang) {

  }
  plant(leg, spot) {

  legSegs(leg) { const h = this.hip(leg), k = this.knee(leg); return [[h.x, h.y, k.x, k.y], [k.x, k.y, leg.fx, leg.fy]]; }

  }
  /* ---------- web / bite rules ---------- */
  webbable() { return this.alive; }
  webHit(x, y) {

    this.webLeg = this.nearLeg(x, y, 5);

    return false;
  }
  aimPoints() {

  }
  onWeb(W, S) {

    if (!leg) {

      floater(W, this.x, this.y - 20, 'ARMORED!', '#ffb3c1'); floater(W, this.x, this.y - 8, 'WEB THE LEGS', '#ffd23f');
      return 'none';
    }

    if (!S.powered) {

      floater(W, hx, hy - 18, 'NO EFFECT!', '#ffb3c1'); floater(W, hx, hy - 6, 'NEED 5 FLIES', '#ffd23f');
      return 'none';
    }

    floater(W, hx, hy - 18, was ? 'MORE WEB!' : 'LEG WEBBED!', '#ffffff');

      const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
      this.debris.push({ x: cx, y: cy, hx: (x2 - x1) / 2, hy: (y2 - y1) / 2, rot: 0, vr: (Math.random() - 0.5) * 8, vx: (Math.random() - 0.5) * 120, vy: -120 - Math.random() * 80, life: 1.6 });
    }
    SFX.play('bite'); SFX.play('snap'); shake(0.35, 5);
    burst(W, kx, ky, 22, ['#ffd23f', '#ff8a00', '#ffffff', '#9aa4b4'], 140, 0.7);
    burst(W, this.x, this.y, 10, ['#ffd23f', '#ff8a00'], 90, 0.5);
    floater(W, kx, ky - 14, 'LEG DESTROYED!', '#ffd23f');
    if (this.legs.length) {
      floater(W, this.x, this.y - 24, this.legs.length + (this.legs.length === 1 ? ' LEG LEFT' : ' LEGS LEFT'), '#ff8c42');
      this.relocT = 0; this.flee = true;    // scuttle away to regroup
      if (W.rules.onBossPhase) W.rules.onBossPhase(this, 'leg', by);
    } else { if (W.rules.onBossPhase) W.rules.onBossPhase(this, 'leg', by); this.startBall(W); }
  }
  startBall(W) {
    this.phase = 'ball'; this.r = LL.BALL_R; this.hitR = 14; this.vx = (Math.random() - 0.5) * 60; this.vy = -60; this.grounded = false; this.jumpCD = 1.4;
    SFX.play('shriek'); shake(0.4, 5);
    burst(W, this.x, this.y, 30, ['#ffd23f', '#ff8a00', '#ffffff', '#5c6270'], 150, 0.8);
    if (W.rules.onBossPhase) W.rules.onBossPhase(this, 'ball');
  }
  /* ---------- simulation ---------- */
  /* ---------- VS network mirror (host simulates, guests draw) ---------- */
  netExtra() {

    for (const l of this.legs) a.push(Math.round(l.a * 100), nX(l.fx), nY(l.fy), (l.st === 'windup' ? 1 : 0) | (l.st === 'strike' || l.st === 'hold' ? 2 : 0), Math.round(l.webT * 10));

  }
  applyNetExtra(a, W) {

    if (ball && this.phase !== 'ball') { this.phase = 'ball'; this.r = LL.BALL_R; burst(W, this.x, this.y, 30, ['#ffd23f', '#ff8a00', '#ffffff'], 150, 0.8); SFX.play('shriek'); }

    this.netLegs = true;

    for (let i = 0; i < n; i++) {
      const k = 5 + i * 5;
      let l = this.legs[i];
      if (!l) { l = { a: 0, fx: this.x, fy: this.y, st: 'planted', webT: 0 }; this.legs.push(l); }
      l.a = a[k] / 100; l.tfx = dX(a[k + 1]); l.tfy = dY(a[k + 2]);
      l.st = a[k + 3] & 1 ? 'windup' : a[k + 3] & 2 ? 'strike' : 'planted'; l.webT = a[k + 4] / 10;

      return;
    }
    for (const d of this.debris) { d.life -= dt; d.vy += G * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt; if (d.y > GROUND_Y - 2) { d.y = GROUND_Y - 2; d.vy *= -0.3; d.vx *= 0.6; d.vr *= 0.5; } }

  }
  updateLegs(dt, W) {
    const D = W.D, t = W.nearestTarget(this.x, this.y);
    for (const leg of this.legs) if (leg.webT > 0) { leg.webT -= dt; if (leg.webT <= 0) { leg.webT = 0; floater(W, leg.fx, leg.fy - 16, 'BROKE FREE!', '#ff8c42'); SFX.play('free'); burst(W, leg.fx, leg.fy, 10, ['#ffffff', '#dfe8f5'], 70, 0.5); } }

    // webbed legs hold the body on a leash

      if (ld > LL.REACH) { const k = LL.REACH / ld; this.x = leg.fx + (this.x - leg.fx) * k; this.y = leg.fy + (this.y - leg.fy) * k; }

    if (t) this.eyeA += angDiff(this.eyeA, Math.atan2(t.y - this.y, t.x - this.x)) * Math.min(1, dt * 6);

    this.updateStrike(dt, W);

  startReloc(t) {

      const dp = dist(x, y, t.x, t.y);

  updateFeet(dt, W, maxStep) {
    let stepping = this.legs.filter(l => l.st === 'step').length;
    for (const leg of this.legs) {
      if (leg.st === 'planted') {
        if (leg.plat && leg.plat.move) { leg.fx = leg.plat.x + leg.ox; leg.fy = leg.plat.y + leg.oy; }

      } else if (leg.st === 'dangle') {

  startStrike(W, t) {

  updateStrike(dt, W) {

  hellShots(dt, W, t) {

  }
  burstColors() { return ['#ffd23f', '#ff8a00', '#ffffff', '#9aa4b4', '#ff2d2d']; }
  /* ---------- drawing ---------- */

      ctx.fillStyle = '#dfe8f5'; ctx.fillRect(Math.round(mx - w / 2), Math.round(my - 15), Math.round(w * frac), 2);
      if (Math.floor(T * 4) % 2 === 0) drawText('BITE!', mx, my - 26, 1, '#ffd23f', 'center', '#140c26');

  }
}

/* Body sprite: riveted steel orb with a single red eye. o.ball = rolling (no legs) */
function drawLongLegsBody(x, y, o) {
  let sx = x, sy = y;
  if (o.shiver) { sx += Math.round(Math.sin(T * 60)); }
  if (o.hell) { ctx.globalAlpha = 0.25 + 0.15 * Math.sin(T * 6); pxCircle(ctx, sx, sy, 17, '#ff2d2d'); ctx.globalAlpha = 1; }
  if (!o.ball) {   // antenna with a blinking light
    ctx.fillStyle = '#2a2d36'; ctx.fillRect(Math.round(sx), Math.round(sy) - 17, 1, 6);
    ctx.fillStyle = Math.floor(T * 3) % 2 ? '#ff2d2d' : '#5a1a1a'; ctx.fillRect(Math.round(sx) - 1, Math.round(sy) - 19, 3, 2);
  }
  pxCircle(ctx, sx, sy, 12, '#1a1c24');
  pxCircle(ctx, sx, sy, 11, '#6a7484');
  pxCircle(ctx, sx - 2, sy - 3, 7, '#8a94a4');
  pxCircle(ctx, sx - 4, sy - 5, 3, '#b4bcc8');
  // panel seams + rivets turn with the body when it rolls
  const r = o.rot || 0;
  ctx.fillStyle = '#3a3f4c';
  for (let k = 0; k < 6; k++) { const a = r + k * Math.PI / 3; ctx.fillRect(Math.round(sx + Math.cos(a) * 9), Math.round(sy + Math.sin(a) * 9), 2, 2); }
  for (let k = 0; k < 2; k++) { const a = r + k * Math.PI; for (let q = 4; q < 11; q++) ctx.fillRect(Math.round(sx + Math.cos(a) * q), Math.round(sy + Math.sin(a) * q), 1, 1); }
  // torn leg stubs spark once legs come off
  if (o.stubs && Math.random() < 0.5) { const a = Math.random() * TAU; ctx.fillStyle = pick(Math.random, ['#ffd23f', '#ff8a00', '#ffffff']); ctx.fillRect(Math.round(sx + Math.cos(a) * 12), Math.round(sy + Math.sin(a) * 12), 1, 1); }
  // eye
  const ex = sx + Math.cos(o.eye) * 4, ey = sy + 1 + Math.sin(o.eye) * 3;
  pxCircle(ctx, ex, ey, 4, '#1a0606');
  const lit = o.boot > 0 ? (Math.random() < 0.5 ? '#5a1a1a' : '#ff2d2d') : o.alert ? '#ff4a2a' : '#c42222';
  pxCircle(ctx, ex, ey, o.alert ? 3 : 2, o.frozen ? '#7a3a3a' : lit);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(ex) - 1, Math.round(ey) - 1, 1, 1);
  if (o.alert && !o.frozen && o.boot <= 0) { ctx.globalAlpha = 0.25; pxCircle(ctx, ex, ey, 6, '#ff2d2d'); ctx.globalAlpha = 1; }
  if (o.frozen) {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1;
    for (let k = 0; k < 5; k++) { const a = k * 1.3 + 0.4; ctx.beginPath(); ctx.moveTo(sx + Math.cos(a) * 13, sy + Math.sin(a) * 13); ctx.lineTo(sx - Math.cos(a + 0.9) * 13, sy - Math.sin(a + 0.9) * 13); ctx.stroke(); }
    ctx.globalAlpha = 0.35; pxCircle(ctx, sx, sy, 12, '#ffffff'); ctx.globalAlpha = 1;
  }
}
/* Small static preview for menus (practice card, overworld) */
function drawLongLegsPreview(x, y, t) {
  const bob = Math.sin(t * 2.4) * 1.5, by = y - 26 + bob;
  ctx.lineCap = 'round';

    ctx.strokeStyle = '#1a1c24'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x + kx, y + ky); ctx.lineTo(x + fx, y); ctx.stroke();
    ctx.strokeStyle = '#9aa4b4'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x + kx, y + ky); ctx.lineTo(x + fx, y); ctx.stroke();
